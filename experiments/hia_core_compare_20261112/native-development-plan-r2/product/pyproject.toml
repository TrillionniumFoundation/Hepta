[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hia-core"
version = "0.3.0"
description = "Typed HIA Core and AI Agent tooling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
verification = ["z3-solver==4.15.4.0"]
optimization = ["z3-solver==4.15.4.0"]

[project.scripts]
hia = "hepta.cli:hia_main"

[tool.setuptools]
packages = ["hepta"]
