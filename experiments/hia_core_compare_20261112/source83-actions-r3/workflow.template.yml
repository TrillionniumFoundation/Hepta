name: HIA numeric source83 fixed original negative commands on v89

on: [create]

permissions: {}

jobs:
  source83:
    if: >-
      ${{ github.repository == 'TrillionniumFoundation/Hepta' &&
          github.event_name == 'create' &&
          github.event.ref_type == 'branch' &&
          github.event.ref == 'codex/hia-core-numeric-source83-run-r3-20261112-e26e' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the exact adapter A without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: @@ADAPTER_COMMIT@@
          path: adapter
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/hia_core_compare_20261112/source83-actions-r3
      - name: Read the frozen four-command permissions, bound-closure launcher and exact transport repairs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: df4e7e5168877130e5e2b139c0d227b0d8ebff0a
          path: frozen
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/hia_core_compare_20261112/source83-on-v89-request-r3
