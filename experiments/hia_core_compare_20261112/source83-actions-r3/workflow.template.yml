      - name: Supply the explicitly supported new runner interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
          check-latest: false
      - name: Bind fresh runtime identities and exact source bytes without running project code
        id: prepare
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          NUMERIC_SOURCE83_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              test -n "${pythonLocation-}"
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          set -o noclobber
          operation="$RUNNER_TEMP/hia-numeric-source83-actions-r3-${GITHUB_RUN_ID}-1"
          "${pythonLocation}/bin/python3.14" -I -S -B adapter/experiments/hia_core_compare_20261112/source83-actions-r3/adapt_request.py --adapter-checkout "$GITHUB_WORKSPACE/adapter" --control-commit @@ADAPTER_COMMIT@@ --policy-sha256 ec04e640b2418448a5f4847888f9169c80efee158135cb550f2f5292704b7f0f --source-controls-checkout "$GITHUB_WORKSPACE/frozen" --base-checkout "$GITHUB_WORKSPACE/base" --output "$operation" > "$operation.prepare.stdout.log" 2> "$operation.prepare.stderr.log"
      - name: Run all 62 generators and exact 83 source methods once under original 180 plus 3 seconds
        id: source_operation
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          NUMERIC_SOURCE83_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              test -n "${pythonLocation-}"
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          set -o noclobber
          operation="$RUNNER_TEMP/hia-numeric-source83-actions-r3-${GITHUB_RUN_ID}-1"
          "${pythonLocation}/bin/python3.14" -I -S -B "$operation/control/launch.py" > "$operation.run.stdout.log" 2> "$operation.run.stderr.log"
      - name: Read the complete naturally closed source operation and all original file bindings
        id: readback
        if: always()
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          NUMERIC_SOURCE83_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              test -n "${pythonLocation-}"
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          set -o noclobber
          operation="$RUNNER_TEMP/hia-numeric-source83-actions-r3-${GITHUB_RUN_ID}-1"
          "${pythonLocation}/bin/python3.14" -I -S -B adapter/experiments/hia_core_compare_20261112/source83-actions-r3/finalize.py --adapter-checkout "$GITHUB_WORKSPACE/adapter" --control-commit @@ADAPTER_COMMIT@@ --policy-sha256 ec04e640b2418448a5f4847888f9169c80efee158135cb550f2f5292704b7f0f --source-controls-checkout "$GITHUB_WORKSPACE/frozen" > "$operation.finalize.stdout.log" 2> "$operation.finalize.stderr.log"
      - name: Emit only bounded whole original files and explicit omissions
        id: small_channel
        if: always()
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          NUMERIC_SOURCE83_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              test -n "${pythonLocation-}"
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          set -o noclobber
          operation="$RUNNER_TEMP/hia-numeric-source83-actions-r3-${GITHUB_RUN_ID}-1"
          "${pythonLocation}/bin/python3.14" -I -S -B adapter/experiments/hia_core_compare_20261112/source83-actions-r3/diagnostics.py --adapter-checkout "$GITHUB_WORKSPACE/adapter" --control-commit @@ADAPTER_COMMIT@@ --policy-sha256 ec04e640b2418448a5f4847888f9169c80efee158135cb550f2f5292704b7f0f 2> "$operation.diagnostics.stderr.log"
      - name: Preserve the complete actual private source subset and all failed or successful originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-numeric-source83-r3-${{ github.run_id }}-1
