name: HIA v79 complete original ZIP in two bounded artifacts

on: [create]

permissions: {}

jobs:
  retain_original:
    name: Retain one historical ZIP as two sealed parts
    if: >-
      ${{ github.repository == 'TrillionniumFoundation/Hepta' &&
          github.event_name == 'create' &&
          github.event.ref_type == 'branch' &&
          github.event.ref == 'codex/hia-v79-full-original-two-parts-run-r1-20261112-e26e' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact reviewed custody control without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: CONTROL_COMMIT_PLACEHOLDER
          path: control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
      - name: Set up the fixed custody interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
          check-latest: false
      - name: Verify frozen controls and create new private custody roots
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v79_ci_original_custody_20261112/full-zip-two-parts-r1/controller.py prepare --root "$RUNNER_TEMP/hia-v79-full-original-two-parts-r1" --policy-sha256 4b97d5f876ef2e72ec5a2119001cb1acca422ab4266426c7f1125f64f644a044 --control-commit CONTROL_COMMIT_PLACEHOLDER
      - name: Read the one sealed original ZIP and create two parts under the original 900-second guardian
        id: owned_collection
        timeout-minutes: 16
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HIA_CUSTODY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v79_ci_original_custody_20261112/full-zip-two-parts-r1/controller.py run --root "$RUNNER_TEMP/hia-v79-full-original-two-parts-r1" --policy-sha256 4b97d5f876ef2e72ec5a2119001cb1acca422ab4266426c7f1125f64f644a044 --control-commit CONTROL_COMMIT_PLACEHOLDER
      - name: Independently retain both parts and controls after closed ECHILD
        if: always()
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v79_ci_original_custody_20261112/full-zip-two-parts-r1/controller.py finalize --root "$RUNNER_TEMP/hia-v79-full-original-two-parts-r1" --policy-sha256 4b97d5f876ef2e72ec5a2119001cb1acca422ab4266426c7f1125f64f644a044 --control-commit CONTROL_COMMIT_PLACEHOLDER
      - name: Preserve original ZIP range zero and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v79-full-original-part-00-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v79-full-original-two-parts-public-r1/part-00/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Preserve original ZIP range one and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v79-full-original-part-01-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v79-full-original-two-parts-public-r1/part-01/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
