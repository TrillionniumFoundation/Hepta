[package]
name = "hia-ndu-bridge"
version = "0.1.0"
edition = "2024"
publish = false

# Same isolated package name as the established source-preserving builder.
# This is a separate adapter and protocol, never the historical v1 executable.
[dependencies]
codex-hepta-ndu = { path = "../hepta-ndu" }
codex-hepta-types = { path = "../hepta-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
