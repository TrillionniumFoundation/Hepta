[workspace]
members = [".", "upstream/hepta-ndu", "upstream/hepta-contracts", "upstream/hepta-types"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# These requirements preserve the pinned NDU workspace's production dependency
# declarations. The separate Cargo.lock fixes this isolated integration build.
[workspace.dependencies]
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
rustix = { version = "1.1.4", features = ["net"] }
serde = { version = "1", features = ["rc"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.8.2"

[package]
name = "hia-ndu-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
codex-hepta-ndu = { path = "upstream/hepta-ndu" }
codex-hepta-types = { path = "upstream/hepta-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[profile.release]
overflow-checks = true
strip = true
