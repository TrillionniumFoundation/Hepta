  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install original Agent discovery dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Install packaging dependencies for the actual portable Source fixture
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3
      - name: Refresh checker custody before HIA generation
        run: python -B tools/generate_hia_checker_inventory.py
      - name: Regenerate actual HIA sources
        run: |
          set -eu
          for component in core_workspace_pipeline core_workspace_facts core_workspace_facts_cli core_workspace_materialize core_workspace_cli capability_renaming core_module_graph core_workspace_json core_workspace_json_cli agent_identity agent_slice elf_linker native_filter core_json_cli agent_stdio agent_snapshot agent_snapshot_json agent_snapshot_json_cli sha256_stream native_observer sha256 json_preflight json_decode json_canonical core_json_frontend selfhost agent_binary64 agent_data_json instruction_policy program_shape function_shape artifact_publication core_admission_cli core_admission agent_binary64_format core_patch core_patch_cli core_patch_result_cli composite_types task_helpers composite_functions composite_constructor composite_outer worker_request release_install release_selection retirement_state agent_journal execution_budget candidate_budget source_build nominal_json slot_ledger cli_control cli_format json_wire worker_report machine_encoding machine_state machine_instructions machine_plan core_lowering core_emitter byte_wrapper machine_object execution_observation continuation enum_match enum_operations record_operations record_transitions task_operations call_primitive nominal_terminators nominal_module nominal_admission request_journal task_helper_cache artifact_namespace slot_ledger_continuation program_execution static_budget heap_bound heap_kernels core_json_bytes cpython_note_packer program_normalization linked_observer source_admission machine_elf machine_plan_control service_context core_lowering_control service_emission core_emitter_control native_byte_abi native_build_foreign native_build service_verification_foreign service_verification proof_contract service_requests service_requests_foreign core_verification assembly_front service_artifacts service_artifacts_foreign service_evaluation service_evaluation_foreign release_launch store_lifecycle_foreign store_lifecycle candidate_build selfhost_linux_stdio linux_stdio_entry cli_discovery_json selfhost_linux_process linux_process_entry selfhost_linux_cli_process linux_cli_entry native_cli_process cli_discovery_routing cli_parser_context selfhost_linux_file linux_file_entry native_file_read; do
            python -B -m "tools.generate_hia_$component"
          done
          git diff --exit-code
      - name: Refresh checker custody after HIA generation
        run: python -B tools/generate_hia_checker_inventory.py
      - run: python -B tools/check_hia_core_only.py
      - run: python -B tools/generate_hia_selfhost_contract.py --check
      - run: python -B tests/test_hia_selfhost_language_coverage.py --generate-inventory
      - run: git diff --exit-code
      - name: Check final checker custody inventory
        run: python -B tools/generate_hia_checker_inventory.py --check
      - name: Core source and independent reference controls
        env:
          HEPTA_HIA_CANDIDATE_BUILD_TEST_EVIDENCE: ${{ runner.temp }}/hia-candidate-build-source
          HEPTA_HIA_LINUX_STDIO_SOURCE_EVIDENCE: ${{ runner.temp }}/hia-linux-stdio-source
