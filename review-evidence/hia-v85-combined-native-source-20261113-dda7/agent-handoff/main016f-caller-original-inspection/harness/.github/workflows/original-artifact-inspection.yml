name: Inspect one original 016f artifact
on:
  push:
    branches:
      - codex/hia-016f-original-artifact-inspection-v85-20261113-dda7
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read original artifact without product execution
        run: python3 -B tools/inspect_original_artifact.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve inspection and exact matched targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-016f-artifact-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/original-artifact-inspection/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
