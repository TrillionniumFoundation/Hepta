name: HIA fixed execution research toolchain
description: Install the explicitly registered Clang 20 / Rust 1.95 / Z3 4.15.4 / Lean 4.19 profile
runs:
  using: composite
  steps:
    - name: Install signed LLVM packages and fixed proof dependencies
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/hia-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
        fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hia-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
        test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        sudo install -m 0644 "$RUNNER_TEMP/hia-llvm.asc" /usr/share/keyrings/hia-llvm.asc
        printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hia-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hia-llvm20.list
        sudo apt-get update
        sudo apt-get install -y clang-20 libclang-rt-20-dev llvm-20 lld-20 build-essential
        python -m pip install --disable-pip-version-check z3-solver==4.15.4.0 zstandard==0.25.0 PyYAML==6.0.2
        rustup toolchain install 1.95.0 --profile minimal --no-self-update
        rustup default 1.95.0
        python -B tools/bootstrap_verification.py --directory "$RUNNER_TEMP/hia-verification-tools" --lean-only
        printf 'CLANG=/usr/bin/clang-20\nHEPTA_CLANG=/usr/bin/clang-20\nCLANGXX=/usr/bin/clang++-20\n' >> "$GITHUB_ENV"
        printf 'LEAN=%s\n' "$RUNNER_TEMP/hia-verification-tools/lean-4.19.0/bin/lean" >> "$GITHUB_ENV"

