name: Publish authorized HIA evidence delivery
on:
  push:
    branches: [work/hia-object-transfer-6bd02c4-20261030]
permissions:
  contents: write
concurrency:
  group: hepta-object-transfer-6bd02c4
  cancel-in-progress: false
jobs:
  restore-original-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Only this job uses the repository-scoped checkout credential to
          # publish the already authorized named branch after hash checks.
          persist-credentials: true
      - name: Verify chunks, restore original Git objects, publish exact evidence commit
        run: python .hia-transfer/6bd02c4/restore.py
      - name: Retain transfer identity and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-original-object-transfer-6bd02c4
          path: TRANSFER_RESULT_6bd02c4.json
          if-no-files-found: error
