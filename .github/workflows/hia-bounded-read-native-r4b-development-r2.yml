name: HIA bounded-read r4b native development

on:
  create:

permissions: {}

jobs:
  bounded-read-development:
    if: >-
      github.repository == 'TrillionniumFoundation/Hepta' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'codex/hia-bounded-read-native-r4b-run-r2-20261112-e26e' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HIA_BOUNDED_READ_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Exact reviewed control checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 30f053a6585b29bf052e36806e4a657d5bda9935
          path: control
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Exact r4b product checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0e36619bc65ada7072c1e8a1f1454728036fee4e
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Fixed CPython target
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - name: Original CI dependency versions
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in ""|"${pythonLocation}/lib") unset LD_LIBRARY_PATH ;; *) exit 64 ;; esac
          python -I -B -m pip --disable-pip-version-check install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Prepare fixed current-source operation
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in ""|"${pythonLocation}/lib") unset LD_LIBRARY_PATH ;; *) exit 64 ;; esac
          control="$GITHUB_WORKSPACE/control/experiments/hia_bounded_read_owner_20261112/actions-native-development-r2"
          python -I -S -B -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); assert len(b)==29427 and hashlib.sha256(b).hexdigest()=="026776460c4597615e3d26d6b802f9c2e43380efbc88890b44f6eadd5959775f"' "$control/controller.py"
          python -I -S -B "$control/controller.py" prepare --root "$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2" --source "$GITHUB_WORKSPACE/source" --control-commit 30f053a6585b29bf052e36806e4a657d5bda9935 --policy-sha256 7eeec008bc7e8b1dbdf4645c1eee96af6891e4de0de7b6d3e51554665df9451b >"$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2.prepare.stdout.log" 2>"$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2.prepare.stderr.log"
      - name: Fresh B0 B1 B2 and all 55 plus original 8 under original 180 seconds
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in ""|"${pythonLocation}/lib") unset LD_LIBRARY_PATH ;; *) exit 64 ;; esac
          control="$GITHUB_WORKSPACE/control/experiments/hia_bounded_read_owner_20261112/actions-native-development-r2"
          python -I -S -B -c 'import hashlib,pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); assert len(b)==29427 and hashlib.sha256(b).hexdigest()=="026776460c4597615e3d26d6b802f9c2e43380efbc88890b44f6eadd5959775f"' "$control/controller.py"
          python -I -S -B "$control/controller.py" run --root "$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2" --source "$GITHUB_WORKSPACE/source" --control-commit 30f053a6585b29bf052e36806e4a657d5bda9935 --policy-sha256 7eeec008bc7e8b1dbdf4645c1eee96af6891e4de0de7b6d3e51554665df9451b >"$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2.run.stdout.log" 2>"$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2.run.stderr.log"
      - name: Independent closed-process verification and typed original custody
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in ""|"${pythonLocation}/lib") unset LD_LIBRARY_PATH ;; *) exit 64 ;; esac
          control="$GITHUB_WORKSPACE/control/experiments/hia_bounded_read_owner_20261112/actions-native-development-r2"
          python -I -S -B -c 'import hashlib,pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); assert len(b)==29427 and hashlib.sha256(b).hexdigest()=="026776460c4597615e3d26d6b802f9c2e43380efbc88890b44f6eadd5959775f"' "$control/controller.py"
          python -I -S -B "$control/controller.py" finalize --root "$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2" --source "$GITHUB_WORKSPACE/source" --control-commit 30f053a6585b29bf052e36806e4a657d5bda9935 --policy-sha256 7eeec008bc7e8b1dbdf4645c1eee96af6891e4de0de7b6d3e51554665df9451b >"$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2.finalize.stdout.log" 2>"$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2.finalize.stderr.log"
      - name: Fixed whole-file small original channel
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in ""|"${pythonLocation}/lib") unset LD_LIBRARY_PATH ;; *) exit 64 ;; esac
          control="$GITHUB_WORKSPACE/control/experiments/hia_bounded_read_owner_20261112/actions-native-development-r2"
          python -I -S -B -c 'import hashlib,pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); assert len(b)==21252 and hashlib.sha256(b).hexdigest()=="8f8c9508490dd23fa65a6822cccc5d2409c76a7d58336ca13ddf0653fbee7276"' "$control/diagnostics.py"
          python -I -S -B "$control/diagnostics.py" --root "$RUNNER_TEMP/hia-bounded-read-native-r4b-development-r2" --source "$GITHUB_WORKSPACE/source" --control-commit 30f053a6585b29bf052e36806e4a657d5bda9935 --policy-sha256 7eeec008bc7e8b1dbdf4645c1eee96af6891e4de0de7b6d3e51554665df9451b
      - name: Preserve complete closed originals and all fixed host stage logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-bounded-read-development-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: |
            ${{ runner.temp }}/hia-bounded-read-native-r4b-development-r2/public/
            ${{ runner.temp }}/hia-bounded-read-native-r4b-development-r2.prepare.stdout.log
            ${{ runner.temp }}/hia-bounded-read-native-r4b-development-r2.prepare.stderr.log
            ${{ runner.temp }}/hia-bounded-read-native-r4b-development-r2.run.stdout.log
            ${{ runner.temp }}/hia-bounded-read-native-r4b-development-r2.run.stderr.log
            ${{ runner.temp }}/hia-bounded-read-native-r4b-development-r2.finalize.stdout.log
            ${{ runner.temp }}/hia-bounded-read-native-r4b-development-r2.finalize.stderr.log
