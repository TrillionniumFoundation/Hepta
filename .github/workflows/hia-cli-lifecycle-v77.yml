name: HIA CLI lifecycle development v77
'on':
  push:
    branches:
    - codex/hia-cli-lifecycle-v77-4b19-20261112-dda7
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: harness
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: 4b19af89a766593f7d5f1cc2db256e81aba7afcb
        path: source
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@v5
      with:
        python-version: 3.14.4
    - name: Install exact existing fixture dependencies
      run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0
        jsonschema==4.26.0
    - name: Run all 39 CLI source and native controls on exact source overlay
      run: python -B harness/inputs/run_cli_development.py --source source --inputs
        harness/inputs --output "$RUNNER_TEMP/hia-cli-v77"
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Retain every original result including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hia-cli-lifecycle-v77-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/hia-cli-v77

          harness/inputs

          harness/README.md

          harness/.github/workflows/hia-cli-lifecycle-v77.yml'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
