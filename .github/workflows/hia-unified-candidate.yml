name: HIA unified candidate source qualification

on:
  push:
    branches: [main, codex/hia-p0-p3-20261107, codex/hia-followup-20261107-faa85]
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/test_core_seven_shared_acceptance.py'
      - 'tests/test_core_seven_shared_source_closure.py'
      - 'tools/core_seven_shared_acceptance_plan.py'
      - 'docs/seven-shared-composition.md'
      - 'tests/test_hia_candidate_preflight.py'
      - 'tests/test_hia_release.py'
      - 'tests/test_hia_first_use.py'
      - 'tests/test_hia_agent_provider.py'
      - 'tests/hia_candidate_preflight_integration.py'
      - 'tests/test_hia_agent_macro_policy.py'
      - 'tests/test_hia_macro_campaign.py'
      - 'tests/test_hia_macro_codex_provider.py'
      - 'tests/test_hia_agent_native*'
      - 'tests/test_hia_machine_plan.py'
      - 'tests/test_hia_machine_registers.py'
      - 'tests/test_hia_machine_leaf_registers.py'
      - 'tests/test_hia_agent_first_use_recovery.py'
      - 'tests/test_hia_macro_multistep.py'
      - 'tests/test_hia_macro_exec_adapter.py'
      - 'tests/test_hia_native_byte_abi.py'
      - 'tests/test_hia_bootstrap_components.py'
      - 'tests/test_hia_selfhost.py'
      - 'tests/test_hia_selfhost_contract.py'
      - 'tests/test_hia_selfhost_machine_plans.py'
      - 'tools/hia_candidate_preflight.py'
      - 'tools/hia_release.py'
      - 'tools/qualify_hia_first_use.py'
      - 'tools/qualify_hia_agent_provider.py'
      - 'experiments/hia_agent_first_use_20261107/**'
      - 'tools/hia_agent_native_qualification.py'
      - 'tools/qualify_hia_candidate.py'
      - 'tools/qualify_hia_macro_campaign.py'
      - 'tools/hia_macro_codex_provider.py'
      - 'tools/hia_macro_legacy_catalog_probe.py'
      - 'tools/build_hia_ndu_bridge.py'
      - 'rust/hia-ndu-bridge/**'
      - 'tools/qualify_hia_machine_choices.py'
      - 'tools/qualify_hia_machine_registers.py'
      - 'tools/qualify_hia_bootstrap_components.py'
      - 'tools/qualify_hia_selfhost.py'
      - 'tools/qualify_hia_selfhost_machine_plans.py'
      - 'tools/prepare_hia_first_use_example.py'
      - 'tools/hia_selfhost_child.py'
      - 'tools/generate_hia_selfhost.py'
      - 'tools/hia_selfhost_cases.py'
      - 'tools/hia_selfhost_resources.py'
      - 'tools/hia_selfhost_tailcalls.py'
      - 'tools/hia_agent_fresh_session.py'
      - 'tools/hia_agent_codex_transport.py'
      - 'tools/qualify_hia_selfhost_leaf_plans.py'
      - 'tools/*hia*multistep*.py'
      - 'tools/*hia*followup*.py'
      - 'tools/hia_macro_exec_adapter.py'
      - 'tools/prepare_hia_macro_launcher.py'
      - 'tools/qualify_hia_cli_public_capability.py'
      - 'benchmarks/hia_macro_multistep/**'
      - 'tools/hia_selfhost_contract.py'
      - 'tools/generate_hia_selfhost_contract.py'
      - 'tools/replay_hia_selfhost_cold.py'
      - 'examples/hia_bootstrap/**'
      - 'docs/HIA_AGENT_MACHINE_PLANS.md'
      - 'docs/HIA_AGENT_MACRO_POLICY.md'
      - 'docs/HIA_DIRECT_BYTE_BOOTSTRAP.md'
      - 'docs/HIA_SELF_HOSTING_CORE.md'
      - 'docs/HIA_SELFHOST_CORE_SUPPORT.json'
      - 'docs/HIA_RELEASE_ENTRY.md'
      - 'docs/HIA_AGENT_NATIVE_QUALIFICATION.md'
      - 'releases/hia-current.json'
      - '.github/workflows/hia-unified-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-native-and-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HEPTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Same reviewed runtime used by the exact-source closure workflow.
      HIA_RUNTIME_SOURCE_SHA: 4cd85c99c5f5a480832c48fbde8561bb365f67a9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact source and evidence directory
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'jsonschema==4.25.1'
          command -v cc
          command -v ld
          command -v objdump
          mkdir "$RUNNER_TEMP/hia-unified"
      - name: Freeze this exact candidate with the reviewed runtime
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: http.extraheader
          GIT_CONFIG_VALUE_1: ''
        shell: bash
        run: |
          set -euo pipefail
          HIA_RUNTIME_ROOT="$RUNNER_TEMP/hia-unified-runtime-$HIA_RUNTIME_SOURCE_SHA"
          test ! -e "$HIA_RUNTIME_ROOT"
          test ! -L "$HIA_RUNTIME_ROOT"
          {
            timeout --kill-after=10s 30s git init -- "$HIA_RUNTIME_ROOT"
            timeout --kill-after=10s 30s git -C "$HIA_RUNTIME_ROOT" remote add origin https://github.com/TrillionniumFoundation/hepta-runtime.git
            timeout --kill-after=10s 30s git -C "$HIA_RUNTIME_ROOT" config remote.origin.promisor true
            timeout --kill-after=10s 30s git -C "$HIA_RUNTIME_ROOT" config remote.origin.partialclonefilter blob:none
            timeout --kill-after=10s 300s git -C "$HIA_RUNTIME_ROOT" fetch --no-tags --no-recurse-submodules --filter=blob:none --depth=1 origin "$HIA_RUNTIME_SOURCE_SHA"
            test "$(git --no-replace-objects -C "$HIA_RUNTIME_ROOT" rev-parse FETCH_HEAD)" = "$HIA_RUNTIME_SOURCE_SHA"
            timeout --kill-after=10s 600s git -C "$HIA_RUNTIME_ROOT" checkout --detach "$HIA_RUNTIME_SOURCE_SHA"
            test "$(git --no-replace-objects -C "$HIA_RUNTIME_ROOT" rev-parse HEAD)" = "$HIA_RUNTIME_SOURCE_SHA"
            test -z "$(git -C "$HIA_RUNTIME_ROOT" status --porcelain --untracked-files=all)"
            git --no-replace-objects -C "$HIA_RUNTIME_ROOT" rev-parse HEAD 'HEAD^{tree}'
          } 2>&1 | tee "$RUNNER_TEMP/hia-unified/release-runtime-fetch.log"
          printf 'HIA_RUNTIME_ROOT=%s\n' "$HIA_RUNTIME_ROOT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B tools/hia_release.py freeze \
            --hepta-root "$GITHUB_WORKSPACE" --hepta-revision "$HEPTA_SOURCE_SHA" \
            --runtime-checkout "$HIA_RUNTIME_ROOT" --runtime-revision "$HIA_RUNTIME_SOURCE_SHA" \
            --release-id "hia-unified-ci-$HEPTA_SOURCE_SHA" \
            --output "$RUNNER_TEMP/hia-unified/release-lock.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/release-freeze.log"
          sha256sum "$RUNNER_TEMP/hia-unified/release-lock.json" > "$RUNNER_TEMP/hia-unified/release-lock.sha256"
          python -B tools/hia_release.py --lock "$RUNNER_TEMP/hia-unified/release-lock.json" describe > "$RUNNER_TEMP/hia-unified/release-contract.json"
      - name: Run full retained direct inventory and new candidate tests without skips
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B tools/qualify_hia_candidate.py --output "$RUNNER_TEMP/hia-unified/tests.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/tests.log"
      - name: Observe separate native machine choices and full scoped costs
        run: |
          set -eu
          python -B tools/qualify_hia_machine_choices.py --out "$RUNNER_TEMP/hia-unified/machine-choices"
      - name: Retain checked scalar register and instruction-choice attempts
        run: |
          set -eu
          python -B tools/qualify_hia_machine_registers.py --out "$RUNNER_TEMP/hia-unified/machine-registers"
      - name: Retain native fixed-Core self-compilation and modified-self generations
        run: |
          set -eu
          python -B tools/qualify_hia_selfhost.py --output "$RUNNER_TEMP/hia-unified/selfhost.json"
      - name: Check explicit machine plans on the selected real compiler workload
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/qualify_hia_selfhost_machine_plans.py run \
            --output "$RUNNER_TEMP/hia-unified/selfhost-machine-plans" --repetitions 7
          python -B tools/qualify_hia_selfhost_machine_plans.py verify \
            --output "$RUNNER_TEMP/hia-unified/selfhost-machine-plans"
      - name: Rebuild the pinned Selfhost-Core with fresh source and Python state
        run: |
          set -eu
          python -B tools/generate_hia_selfhost_contract.py --check
          python -B tools/replay_hia_selfhost_cold.py --output "$RUNNER_TEMP/hia-unified/selfhost-cold.json"
      - name: Build exact original native NDU for the four-arm macro fixture
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          hia_ndu_checkout="$RUNNER_TEMP/hia-unified-ndu-source"
          hia_ndu_commit=$(python -c 'import json; print(json.load(open("rust/hia-ndu-bridge/upstream.json"))["commit"])')
          git init "$hia_ndu_checkout"
          git -C "$hia_ndu_checkout" remote add origin https://github.com/TrillionniumFoundation/hepta-private-ci.git
          git -C "$hia_ndu_checkout" config remote.origin.promisor true
          git -C "$hia_ndu_checkout" config remote.origin.partialclonefilter blob:none
          git -C "$hia_ndu_checkout" -c protocol.version=2 fetch --filter=blob:none --depth=1 origin "$hia_ndu_commit"
          test "$(git -C "$hia_ndu_checkout" rev-parse FETCH_HEAD)" = "$hia_ndu_commit"
          RUSTC="$(rustup which --toolchain 1.95.0 rustc)" \
          CARGO_TARGET_DIR="$RUNNER_TEMP/hia-unified-ndu-target" \
          python -B tools/build_hia_ndu_bridge.py \
            --upstream "$hia_ndu_checkout" --output "$RUNNER_TEMP/hia-unified/ndu-build" \
            --cargo "$(rustup which --toolchain 1.95.0 cargo)" \
            > "$RUNNER_TEMP/hia-unified/ndu-build.stdout.log" \
            2> "$RUNNER_TEMP/hia-unified/ndu-build.stderr.log"
      - name: Retain and independently verify every macro fixture arm and cost
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/qualify_hia_macro_campaign.py run \
            --output "$RUNNER_TEMP/hia-unified/macro-campaign" \
            --native-binary "$RUNNER_TEMP/hia-unified-ndu-target/debug/hia-ndu-bridge" \
            --native-build-receipt "$RUNNER_TEMP/hia-unified/ndu-build/build-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/macro-campaign.log"
          python -B tools/qualify_hia_macro_campaign.py verify \
            --bundle "$RUNNER_TEMP/hia-unified/macro-campaign" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/macro-verification.log"
      - name: Verify integration with exact existing runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$HIA_RUNTIME_ROOT" rev-parse HEAD)" = "$HIA_RUNTIME_SOURCE_SHA"
          python -B tests/hia_candidate_preflight_integration.py \
            --runtime-checkout "$HIA_RUNTIME_ROOT" \
            --runtime-revision "$HIA_RUNTIME_SOURCE_SHA" -v \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/runtime-preflight.log"
      - name: Reproduce the release contract in fresh source checkouts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/hia-unified/release-lock.sha256"
          python -B tools/hia_release.py --lock "$RUNNER_TEMP/hia-unified/release-lock.json" materialize \
            --hepta-repository "$GITHUB_WORKSPACE" \
            --runtime-repository "$HIA_RUNTIME_ROOT" \
            --directory "$RUNNER_TEMP/hia-unified-cold" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/release-materialize.log"
          python -B tools/hia_release.py --lock "$RUNNER_TEMP/hia-unified/release-lock.json" check \
            --hepta-root "$RUNNER_TEMP/hia-unified-cold/hepta" \
            --runtime-checkout "$RUNNER_TEMP/hia-unified-cold/runtime" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/release-check.log"
      - name: Reproduce the locked release through the default public GitHub URLs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/hia-unified/release-lock.sha256"
          python -B tools/hia_release.py --lock "$RUNNER_TEMP/hia-unified/release-lock.json" materialize \
            --directory "$RUNNER_TEMP/hia-unified-public-remote" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/release-public-materialize.log"
          python -B tools/hia_release.py --lock "$RUNNER_TEMP/hia-unified/release-lock.json" check \
            --hepta-root "$RUNNER_TEMP/hia-unified-public-remote/hepta" \
            --runtime-checkout "$RUNNER_TEMP/hia-unified-public-remote/runtime" \
            2>&1 | tee "$RUNNER_TEMP/hia-unified/release-public-check.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-unified-${{ env.HEPTA_SOURCE_SHA }}
          path: ${{ runner.temp }}/hia-unified/
          if-no-files-found: error
          retention-days: 30
