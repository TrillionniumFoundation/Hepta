name: Independent C source filename fidelity
on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/test_c_source_paths.py'
      - 'tests/test_c_backend.py'
      - 'tests/test_c_owned_backend.py'
      - 'tests/test_parser.py'
      - 'tests/test_checker.py'
      - 'tests/test_debug_info.py'
      - 'tools/test_c_source_paths.py'
      - '.github/workflows/hepta-c-source-paths.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source and execute all controls without skips
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          rustup toolchain install 1.90.0 --profile minimal
          export RUSTC="$(rustup which --toolchain 1.90.0 rustc)"
          export CC="$(command -v gcc)"
          command -v readelf
          mkdir -p artifacts/c-source-paths
          { uname -a; "$CC" --version; "$RUSTC" --version; readelf --version; \
            sha256sum "$CC" "$RUSTC"; } > artifacts/c-source-paths/toolchains.txt
          python -B tools/test_c_source_paths.py 2>&1 | tee artifacts/c-source-paths/tests.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-source-paths-${{ matrix.os }}-${{ env.EXPECTED_HEAD }}
          path: artifacts/c-source-paths
          if-no-files-found: error
