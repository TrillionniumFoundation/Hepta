name: Hepta qualified full gates

on:
  push:
    branches:
      - feat/hepta-p0-p1-verified-ir-20261024
      - feat/hepta-agent-safe-cfg-cpp-20261024
      - feat/hepta-safe-migration-agent-20261024
      - dot/hepta-p0-p1-semantic-bridge-20261025
      - dot/hepta-p0-p7-integration-20261025
      - codex/hepta-p4-p6-guardrails-20261025
      - assistant/hepta-p0-p7-semantic-budget-20261025
      - implement/hia-unified-native-20261026
      - audit/pr179-native-rustc-env-20261026
      - audit/pr218-aarch64-lld-qemu-ci-20261026
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Qualify the PR head, not GitHub's synthetic merge commit. Different source
# versions retain independent runs even when they share a branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEPTA_QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout frozen source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_QUALIFICATION_HEAD_SHA }}
      - name: Record and verify the tested source head
        shell: bash
        run: |
          actual_head=$(git rev-parse HEAD)
          mkdir -p artifacts
          printf '{"schema":"hepta.workflow-source.v1","expected_head_sha":"%s","checkout_head_sha":"%s","event_sha":"%s"}\n' \
            "$HEPTA_QUALIFICATION_HEAD_SHA" "$actual_head" "$GITHUB_SHA" > artifacts/workflow-source.json
          test "$actual_head" = "$HEPTA_QUALIFICATION_HEAD_SHA"
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verification archive dependency
        run: python -m pip install zstandard
      - name: Native compilers and required namespace runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap gcc g++ curl gnupg gdb libboost-dev qemu-system-arm
      - name: Install the explicit LLVM 20 resource backend toolchain
        shell: bash
        run: |
          # Ubuntu 24.04 runner images ship Clang 18 by default. The owned
          # LLVM profile requires 20+, and every native receipt hashes the
          # actual selected compiler. Use LLVM's signed versioned repository.
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/hepta-llvm.asc" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          hepta_llvm_fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$hepta_llvm_fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' \
            | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install --yes clang-20 libclang-rt-20-dev lld-20
          test -x /usr/lib/llvm-20/bin/clang
          test -x /usr/lib/llvm-20/bin/clang++
          test -x /usr/lib/llvm-20/bin/ld.lld
          /usr/lib/llvm-20/bin/ld.lld --version | grep -E '(^|[[:space:]])LLD 20\.'
          printf '%s\n' /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
          /usr/lib/llvm-20/bin/clang --version
      - name: Install SHA-256-locked Rust 1.90.0 toolchain and cross stdlibs
        run: python tools/bootstrap_toolchain.py
      - name: Bind native qualification to the installed Rust 1.90.0
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          from hepta.backend import find_rustc, toolchain_info
          from tools.validate import rustc_path
          
          prefix = (Path.cwd().resolve().parent / "toolchains/rust-1.90.0").resolve(strict=True)
          rustc = (prefix / "bin/rustc").resolve(strict=True)
          rustc.relative_to(prefix)
          info = toolchain_info(str(rustc))
          if info["host"] != "x86_64-unknown-linux-gnu":
              raise SystemExit("Unexpected pinned Rust host: " + info["host"])
          sysroot = Path(subprocess.check_output(
              [str(rustc), "--print", "sysroot"], text=True, timeout=30).strip()).resolve(strict=True)
          if sysroot != prefix:
              raise SystemExit("Pinned Rust sysroot does not match the bootstrapped prefix")
          os.environ["RUSTC"] = str(rustc)
          os.environ["PATH"] = str(prefix / "bin") + os.pathsep + os.environ["PATH"]
          selected = {"backend": find_rustc(), "native_validator": rustc_path(),
                      "PATH": shutil.which("rustc")}
          if any(not path or Path(path).resolve() != rustc for path in selected.values()):
              raise SystemExit("A compiler selector did not select the pinned Rust compiler")
          receipt = {"schema": "hepta.workflow-toolchain.v1", "rustc": info,
                     "sysroot": str(sysroot), "selectors": selected}
          Path("artifacts/workflow-toolchain.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write("RUSTC=" + str(rustc) + "\n")
          with open(os.environ["GITHUB_PATH"], "a") as path_file:
              path_file.write(str(prefix / "bin") + "\n")
          PYTHON
      - name: Install SHA-256-locked Lean and QEMU tools
        run: python tools/bootstrap_verification.py
      - name: Expose SHA-256-locked QEMU AArch64 runner to native tests
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("formal/qemu-toolchain-lock.json").read_text())
          binary = (Path.cwd().resolve().parent /
                    "toolchains/qemu-8.2.2/qemu-aarch64-static").resolve(strict=True)
          if not binary.is_file() or not os.access(binary, os.X_OK):
              raise SystemExit("E_QEMU_IDENTITY: pinned QEMU binary is not executable")
          with binary.open("rb") as source:
              digest = hashlib.file_digest(source, "sha256").hexdigest()
          if digest != lock["binary_sha256"]:
              raise SystemExit("E_QEMU_IDENTITY: pinned QEMU binary hash mismatch")
          bindir = Path(os.environ["RUNNER_TEMP"]) / "hepta-qualified-aarch64-runner"
          bindir.mkdir(mode=0o700, exist_ok=False)
          entry = bindir / "qemu-aarch64"
          entry.symlink_to(binary)
          if entry.resolve(strict=True) != binary:
              raise SystemExit("E_QEMU_IDENTITY: runner path mismatch")
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(bindir) + "\n")
          print(json.dumps({"schema": "hepta.qemu-runner-identity.v1",
                            "binary_sha256": digest, "runner": str(binary),
                            "alias": str(entry)}, sort_keys=True))
          PYTHON
      - name: Run all current native and experiment qualification gates
        run: >-
          python tools/release_check.py
          --output-directory artifacts/candidate
          --continue-on-failure
      - name: Qualify the standalone HIA interpreter and direct native paths
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          export LEAN="$GITHUB_WORKSPACE/../toolchains/lean-4.19.0/bin/lean"
          python tools/qualify_hia_unified.py \
            --output-directory artifacts/hia-unified \
            --clang /usr/lib/llvm-20/bin/clang \
            --rustc "$GITHUB_WORKSPACE/../toolchains/rust-1.90.0/bin/rustc" \
            --linker "$GITHUB_WORKSPACE/../toolchains/rust-1.90.0/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" \
            --qemu-aarch64 "$GITHUB_WORKSPACE/../toolchains/qemu-8.2.2/qemu-aarch64-static" \
            --qemu-system-arm /usr/bin/qemu-system-arm
      - name: Preserve failures and all raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-release-evidence-${{ env.HEPTA_QUALIFICATION_HEAD_SHA }}
          path: |
            artifacts/
            evidence/
          if-no-files-found: warn
