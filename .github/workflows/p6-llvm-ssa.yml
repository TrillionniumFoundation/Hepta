name: Hepta P6 direct SSA PHI LLVM native pilot

on:
  push:
    branches:
      - codex/hepta-p1-structural-cfg-20261024
  pull_request:
    branches:
      - codex/hepta-hsir-c-migration-20261024

permissions:
  contents: read

jobs:
  llvm-ssa-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bounded native LLVM SSA pilot and adversarial tests
        run: |
          python -m unittest discover -s tests -p test_ssa_scalar.py -v
          python -m unittest discover -s tests -p test_ssa_verify.py -v
          python -m unittest discover -s tests -p test_ssa_differential.py -v
          python -m unittest discover -s tests -p test_llvm_ssa_backend.py -v
          python -m unittest discover -s tests -p test_llvm_ssa_target.py -v
          python -m unittest discover -s tests -p test_ssa_native_benchmark.py -v
      - name: Install exact SHA-locked Rust 1.90 native oracle
        run: |
          python tools/bootstrap_toolchain.py --prefix "$RUNNER_TEMP/hepta-rust" --targets
          echo "RUSTC=$RUNNER_TEMP/hepta-rust/bin/rustc" >> "$GITHUB_ENV"
      - name: Hepta native source to LLVM PHI and actual C ABI execution
        run: |
          python -m hepta build-llvm-ssa examples/ssa_llvm.hepta \
            --output "$RUNNER_TEMP/hepta-llvm-ssa.so" \
            > artifacts/p6-ssa-llvm-report.json
          python - "$RUNNER_TEMP/hepta-llvm-ssa.so" artifacts/p6-ssa-llvm-report.json <<'PY'
          import ctypes, json, sys
          path, report = sys.argv[1:]
          data = json.load(open(report, encoding="utf-8"))
          assert data["schema"] == "hepta.build-llvm-ssa.v0"
          assert data["status"] == "native_host_compiled_unqualified"
          assert data["reference_validation"]["ok"] is True
          assert data["build"]["claims"]["backend_refinement_proven"] is False
          f = ctypes.CDLL(path).hepta_accumulate
          f.argtypes = [ctypes.c_int32]
          f.restype = ctypes.c_int32
          def expected(n):
              return sum(i if i < 4 else 1 for i in range(max(0, n)))
          for n in [-4, 0, 1, 2, 3, 4, 5, 8, 12, 20]:
              assert f(n) == expected(n), n
          PY
      - name: Verify SSA/PHI object identity on Linux x64, ARM64 and Windows x64
        run: |
          python -m hepta build-llvm-ssa examples/ssa_llvm.hepta \
            --target x86_64-unknown-linux-gnu \
            --output "$RUNNER_TEMP/hepta-ssa-linux-x64.o" > artifacts/p6-ssa-linux-x64.json
          python -m hepta build-llvm-ssa examples/ssa_llvm.hepta \
            --target aarch64-unknown-linux-gnu \
            --output "$RUNNER_TEMP/hepta-ssa-linux-arm64.o" > artifacts/p6-ssa-linux-arm64.json
          python -m hepta build-llvm-ssa examples/ssa_llvm.hepta \
            --target x86_64-pc-windows-msvc \
            --output "$RUNNER_TEMP/hepta-ssa-windows-x64.obj" > artifacts/p6-ssa-windows-x64.json
          python - <<'PY'
          import json
          for target, suffix in [("x86_64-unknown-linux-gnu", "linux-x64"),
                                 ("aarch64-unknown-linux-gnu", "linux-arm64"),
                                 ("x86_64-pc-windows-msvc", "windows-x64")]:
              d=json.load(open("artifacts/p6-ssa-"+suffix+".json"))
              assert d["build"]["target"] == target
              assert d["status"] == "cross_object_only_not_executed"
              assert d["build"]["claims"]["target_program_executed"] is False
              assert d["build"]["claims"]["foreign_c_abi_qualified"] is False
          PY
      - name: Record timed Hepta LLVM SSA vs independent native C samples
        run: |
          python tools/ssa_native_benchmark.py \
            --library "$RUNNER_TEMP/hepta-llvm-ssa.so" \
            --symbol hepta_accumulate \
            --output artifacts/p6-ssa-perf.json \
            --iterations 15000 --trials 7 --bound 20
          python - <<'PY'
          import json
          data = json.load(open("artifacts/p6-ssa-perf.json"))
          assert data["status"] == "completed_host_sample_not_proof"
          assert len(data["raw_samples"]) == 14
          assert data["claims"]["whole_language_faster_than_rust_or_c"] is False
          assert data["claims"]["service_p99_qualified"] is False
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-p6-native-ssa-host-evidence
          path: |
            artifacts/p6-ssa-llvm-report.json
            artifacts/p6-ssa-perf.json
            artifacts/p6-ssa-linux-x64.json
            artifacts/p6-ssa-linux-arm64.json
            artifacts/p6-ssa-windows-x64.json
          if-no-files-found: warn
