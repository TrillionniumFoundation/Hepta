name: HIA continuation resource Core

on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'formal/**'
      - 'tests/test_hia_*'
      - 'tools/qualify_hia_owned_exit.py'
      - 'tools/qualify_stb_context_opportunity.py'
      - '.github/workflows/hepta-continuation-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  selected-owned-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEPTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the exact source and pinned proof dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/continuation-core"
          python -m pip install -e '.[optimization]' zstandard==0.25.0
          python tools/bootstrap_verification.py --lean-only --directory "$RUNNER_TEMP/continuation-tools"
      - name: Recheck the shared catalog and meaningful boundary controls without skips
        run: |
          python tools/generate_hia_catalog.py --check
          python - <<'PY'
          import json, os, unittest
          from pathlib import Path
          suites = ['tests.test_hia_semantics_contract', 'tests.test_hia_opcode_catalog',
                    'tests.test_hia_schema_unification', 'tests.test_hia_agent_assembly',
                    'tests.test_hia_optimization_contract', 'tests.test_hia_owned_exit',
                    'tests.test_hia_context_specialization']
          suite = unittest.defaultTestLoader.loadTestsFromNames(suites)
          count = suite.countTestCases()
          output = Path(os.environ['RUNNER_TEMP']) / 'continuation-core'
          with (output / 'tests.log').open('w') as stream:
              result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          passed = (count > 0 and result.testsRun == count and result.wasSuccessful()
                    and not result.skipped and not result.expectedFailures)
          report = {'source': os.environ['HEPTA_SOURCE_SHA'], 'suites': suites,
                    'planned': count, 'run': result.testsRun, 'failures': len(result.failures),
                    'errors': len(result.errors), 'skipped': len(result.skipped), 'passed': passed}
          (output / 'UNIT_RESULT.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          raise SystemExit(0 if passed else 1)
          PY
      - name: Execute the actual pinned Lean kernel and all VM exit ledgers
        run: |
          python tools/qualify_hia_owned_exit.py \
            --lean "$RUNNER_TEMP/continuation-tools/lean-4.19.0/bin/lean" \
            --output-directory "$RUNNER_TEMP/continuation-core/owned-exit"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.qualify_hia_owned_exit import validate_report
          directory = Path(os.environ['RUNNER_TEMP']) / 'continuation-core/owned-exit'
          report = json.loads((directory / 'qualification.json').read_text())
          validate_report(report, directory)
          assert report['ok'] and report['vm_case_count'] == 192
          assert len(report['theorems']) == 31 and len(report['negative_controls']) == 3
          PY
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain complete success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-continuation-core-${{ env.HEPTA_SOURCE_SHA }}
          path: ${{ runner.temp }}/continuation-core
          if-no-files-found: error
