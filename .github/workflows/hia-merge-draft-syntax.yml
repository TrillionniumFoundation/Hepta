name: Fixed merge draft syntax and AST custody

on:
  push:
    branches:
      - codex/hia-fixed-merge-draft-syntax-v85-r1-20261113-dda7

permissions:
  contents: read

jobs:
  fixed-source-syntax:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14.4"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the isolated source inspection harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false
      - name: Select the recorded syntax interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check fixed source syntax and original selfhost AST custody
        shell: bash
        env:
          HIA_SYNTAX_READ_TOKEN: ${{ github.token }}
          EXPECTED_INPUTS_GIT_BLOB: e8e97cec51cfc7676ebdca213894446f4c88946f
          EXPECTED_DRIVER_GIT_BLOB: 9f44b353c8cb4508b88a39c3cd6a64df7279cbcc
        run: |
          python -I -B "${GITHUB_WORKSPACE}/harness/tools/check_fixed_draft_syntax.py" \
            --inputs "${GITHUB_WORKSPACE}/harness/inputs/FIXED-INPUTS.json" \
            --root "${RUNNER_TEMP}/hia-fixed-merge-draft-syntax-v85"
      - name: Preserve fixed sources and all results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-fixed-merge-draft-syntax-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-fixed-merge-draft-syntax-v85/evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
