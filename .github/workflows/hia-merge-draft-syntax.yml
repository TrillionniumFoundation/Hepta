name: Fixed combined source syntax and AST custody R2

on:
  push:
    branches:
      - codex/hia-fixed-combined-static-v85-r2-20261113-dda7

permissions:
  contents: read

jobs:
  fixed-source-syntax:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14.4"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the isolated source inspection harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false
      - name: Select the recorded syntax interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check all 251 fixed combined sources and retained AST
        shell: bash
        env:
          HIA_SYNTAX_READ_TOKEN: ${{ github.token }}
          EXPECTED_INPUTS_GIT_BLOB: 54aa03eaabf05a2320c90b48d93a5057ddef4bc7
          EXPECTED_DRIVER_GIT_BLOB: b3019e0c163f9e86a79c303a9f73d572d79eaf42
        run: |
          python -I -B "${GITHUB_WORKSPACE}/harness/tools/check_fixed_draft_syntax.py" \
            --inputs "${GITHUB_WORKSPACE}/harness/inputs/FIXED-INPUTS.json" \
            --root "${RUNNER_TEMP}/hia-fixed-combined-source-static-v85-r2"
      - name: Preserve fixed sources and all results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-fixed-combined-static-r2-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-fixed-combined-source-static-v85-r2/evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
