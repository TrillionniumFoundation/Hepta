      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Generate compile and execute the new private program projector
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-program-recovery
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/program/ci_program_inspection_r1.py 2>&1 | tee "$RUNNER_TEMP/hia-program-driver.log"
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-program-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-program-recovery
            ${{ runner.temp }}/hia-program-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cli:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[hia-ci:') ||
      contains(github.event.head_commit.message, '[hia-ci:all]') ||
