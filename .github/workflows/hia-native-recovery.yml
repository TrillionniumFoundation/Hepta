        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/namespace-ci/namespace-filesystem-r3-ci.py 2>&1 | tee "$RUNNER_TEMP/hia-namespace-driver.log"
      - name: Preserve complete independent success or failure evidence
