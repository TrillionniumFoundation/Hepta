      contains(github.event.head_commit.message, '[hia-ci:all]') ||
      contains(github.event.head_commit.message, '[hia-ci:candidate]')
    name: Remaining candidate private 44 and byte boundaries 2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require the original Ubuntu 24.04 x86_64 execution domain
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          test "${ImageOS:?}" = ubuntu24
          printf 'HIA_RUNNER_DOMAIN id=%s version=%s architecture=%s image=%s image_version=%s\n' "$ID" "$VERSION_ID" "$(uname -m)" "$ImageOS" "${ImageVersion:?}"
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct and execute independent candidate gates
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-candidate-recovery
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_candidate_recovery_r1.py 2>&1 | tee "$RUNNER_TEMP/hia-candidate-driver.log"
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-candidate-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-candidate-recovery
            ${{ runner.temp }}/hia-candidate-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

