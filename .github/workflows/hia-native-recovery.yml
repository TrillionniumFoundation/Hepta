          path: |
            ${{ runner.temp }}/hia-namespace-recovery
            ${{ runner.temp }}/hia-namespace-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  namespace_carrier:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[hia-ci:') ||
      contains(github.event.head_commit.message, '[hia-ci:all]') ||
      contains(github.event.head_commit.message, '[hia-ci:namespace-carrier]')
    name: New filesystem syscall carrier and physical kernel controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
