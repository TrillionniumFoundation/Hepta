    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct and execute independent candidate gates
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-candidate-recovery
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
