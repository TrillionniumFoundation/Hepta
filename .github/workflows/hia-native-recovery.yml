name: HIA independent native recovery

on:
  push:
    branches:
      - recovery/hia-function-9acdfa-20261111
    paths:
      - .github/workflows/hia-native-recovery.yml
      - review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hia-independent-recovery-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:

  candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[hia-ci:') ||
      contains(github.event.head_commit.message, '[hia-ci:all]') ||
      contains(github.event.head_commit.message, '[hia-ci:candidate]')
    name: Candidate 17 + retained 87 + private 44 + byte boundaries 2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct and execute independent candidate gates
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-candidate-recovery
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_candidate_recovery_r1.py 2>&1 | tee "$RUNNER_TEMP/hia-candidate-driver.log"
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-candidate-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-candidate-recovery
            ${{ runner.temp }}/hia-candidate-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cli:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[hia-ci:') ||
      contains(github.event.head_commit.message, '[hia-ci:all]') ||
      contains(github.event.head_commit.message, '[hia-ci:cli]')
    name: Reconstructed CLI components and actual seven-image entry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct and execute independent cli gates
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-cli-recovery
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/cli/development/ci_cli_reconstruction_r1.py 2>&1 | tee "$RUNNER_TEMP/hia-cli-driver.log"
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-cli-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-cli-recovery
            ${{ runner.temp }}/hia-cli-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  namespace:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[hia-ci:') ||
      contains(github.event.head_commit.message, '[hia-ci:all]') ||
      contains(github.event.head_commit.message, '[hia-ci:namespace]')
    name: Namespace filesystem VM and actual native owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct and execute independent namespace gates
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-namespace-recovery
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/namespace-ci/namespace-filesystem-r3-ci.py 2>&1 | tee "$RUNNER_TEMP/hia-namespace-driver.log"
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-namespace-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-namespace-recovery
            ${{ runner.temp }}/hia-namespace-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  worker:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[hia-ci:') ||
      contains(github.event.head_commit.message, '[hia-ci:all]') ||
      contains(github.event.head_commit.message, '[hia-ci:worker]')
    name: Worker records and actual journal bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct and execute independent worker gates
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-worker-recovery
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/worker-ci/worker_records_journal_ci_r2.py 2>&1 | tee "$RUNNER_TEMP/hia-worker-driver.log"
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-worker-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-worker-recovery
            ${{ runner.temp }}/hia-worker-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  diagnostic:
    name: Read exact original CLI generation failure
    if: contains(github.event.head_commit.message, '[hia-ci:diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out submitted diagnostic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact retained prior CLI artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13892287301'
          run-id: '43101326649'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-cli
      - name: Read pinned original nested failure
        shell: bash
        run: >-
          python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/cli/development/read_original_cli_failure_r1.py
          --download "$RUNNER_TEMP/prior-cli"
          --output "$RUNNER_TEMP/cli-original-failure"
          2>&1 | tee "$RUNNER_TEMP/cli-original-failure-driver.log"
      - name: Preserve exact original failure readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-original-cli-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-original-failure
            ${{ runner.temp }}/cli-original-failure-driver.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
