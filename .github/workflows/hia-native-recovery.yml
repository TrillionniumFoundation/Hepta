      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Download exact passed predecessor namespace evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13893575504'
          run-id: '43103197988'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hia-namespace-597
      - name: Build and execute only the new filesystem carrier gates
        shell: bash
        env:
          HIA_CI_OUTPUT: ${{ runner.temp }}/hia-namespace-carrier-recovery
          HIA_NAMESPACE_PREDECESSOR_DIR: ${{ runner.temp }}/hia-namespace-597
          HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/namespace-ci/namespace-filesystem-carrier-ci.py 2>&1 | tee "$RUNNER_TEMP/hia-namespace-carrier-driver.log"
