name: HIA independent native recovery

on:
  push:
    branches:
      - recovery/hia-function-9acdfa-20261111
    paths:
      - .github/workflows/hia-native-recovery.yml
      - review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hia-independent-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate 17 + retained 87 + private 44 + byte boundaries 2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HIA_CI_OUTPUT: ${{ runner.temp }}/hia-candidate-recovery
      HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct, compile, and execute original-limit candidate gates
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_candidate_recovery_r1.py
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-candidate-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-candidate-recovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cli:
    name: Reconstructed CLI components and actual seven-image entry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HIA_CI_OUTPUT: ${{ runner.temp }}/hia-cli-recovery
      HIA_CI_COMMON: ${{ github.workspace }}/review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/ci/ci_recovery_common_r1.py
    steps:
      - name: Check out submitted recovery source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the independent exact reference
        uses: actions/checkout@v4
        with:
          ref: 0ef9541b2fc12f4b01ab5078b05d0b304cfa90f5
          path: ci-reference-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the declared development solver
        run: python -m pip install z3-solver==4.15.4.0
      - name: Reconstruct and execute CLI component and entry gates
        run: python -B review-evidence/hia-native-rewrite-20261111/remote-recovery-r3/cli/development/ci_cli_reconstruction_r1.py
      - name: Preserve complete independent success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-cli-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-cli-recovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
