  diagnostic:
    name: Read exact original CLI generation failure
    if: contains(github.event.head_commit.message, '[hia-ci:diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out submitted diagnostic source
        uses: actions/checkout@v4
