name: HIA v89 complete original ZIP in bounded artifacts

on: [create]

permissions: {}

jobs:
  retain_original:
    name: Retain one historical ZIP as a fixed complete partition
    if: >-
      ${{ github.repository == 'TrillionniumFoundation/Hepta' &&
          github.event_name == 'create' &&
          github.event.ref_type == 'branch' &&
          github.event.ref == 'codex/hia-v89-full32-failed-original-parts-run-r1-20261112-e26e' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact reviewed custody control without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: b43a354a91c7b2bb858edab40ffe4c8cb1fc24ca
          path: control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
      - name: Set up the fixed custody interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
          check-latest: false
      - name: Verify frozen controls and create new private custody roots
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v89_full32_failed_custody_20261112/multipart-r1/controller.py prepare --root "$RUNNER_TEMP/hia-v89-full32-failed-parts-r1" --policy-sha256 afeb641caf510559f32731c44db4ef997437bdd8a597c602625c4f63420aeafb --control-commit b43a354a91c7b2bb858edab40ffe4c8cb1fc24ca
      - name: Read the one sealed original ZIP and create the fixed partition under the original 900-second guardian
        id: owned_collection
        timeout-minutes: 16
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HIA_CUSTODY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v89_full32_failed_custody_20261112/multipart-r1/controller.py run --root "$RUNNER_TEMP/hia-v89-full32-failed-parts-r1" --policy-sha256 afeb641caf510559f32731c44db4ef997437bdd8a597c602625c4f63420aeafb --control-commit b43a354a91c7b2bb858edab40ffe4c8cb1fc24ca
      - name: Independently retain every fixed part and controls after closed ECHILD
        if: always()
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v89_full32_failed_custody_20261112/multipart-r1/controller.py finalize --root "$RUNNER_TEMP/hia-v89-full32-failed-parts-r1" --policy-sha256 afeb641caf510559f32731c44db4ef997437bdd8a597c602625c4f63420aeafb --control-commit b43a354a91c7b2bb858edab40ffe4c8cb1fc24ca
      - name: Preserve original ZIP range 00 and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v89-full32-failed-original-part-00-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v89-full32-failed-parts-public-r1/part-00/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Preserve original ZIP range 01 and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v89-full32-failed-original-part-01-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v89-full32-failed-parts-public-r1/part-01/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Preserve original ZIP range 02 and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v89-full32-failed-original-part-02-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v89-full32-failed-parts-public-r1/part-02/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
