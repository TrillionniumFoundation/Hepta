name: HIA NDU scalar caller selection integration

on:
  push:
    branches: ['codex/hia-sixgap-source-*', 'codex/hia-ndu-scalar-*']
    # Every exact release candidate needs fresh NDU evidence for its own commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      HEPTA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the exact clean source and pinned verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir "$RUNNER_TEMP/hia-ndu-scalar"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-ndu-scalar/source-before.txt"
          python -m pip install 'jsonschema==4.25.1' 'z3-solver==4.15.4.0'
          python -m pip freeze > "$RUNNER_TEMP/hia-ndu-scalar/dependencies.txt"
      - name: Build the unchanged pinned native ranking evaluator
        shell: bash
        run: |
          set -euo pipefail
          # Same anonymous exact-commit path as hia-unified-candidate.yml.
          # The builder verifies the original Git blobs and committed Cargo.lock.
          rustup toolchain install 1.95.0 --profile minimal
          hia_scalar_checkout="$RUNNER_TEMP/hia-ndu-scalar-upstream"
          hia_scalar_commit=$(python -c 'import json; print(json.load(open("rust/hia-ndu-bridge/upstream.json"))["commit"])')
          git init "$hia_scalar_checkout"
          git -C "$hia_scalar_checkout" remote add origin https://github.com/TrillionniumFoundation/hepta-private-ci.git
          git -C "$hia_scalar_checkout" config remote.origin.promisor true
          git -C "$hia_scalar_checkout" config remote.origin.partialclonefilter blob:none
          git -C "$hia_scalar_checkout" -c protocol.version=2 fetch --filter=blob:none --depth=1 origin "$hia_scalar_commit"
          test "$(git -C "$hia_scalar_checkout" rev-parse FETCH_HEAD)" = "$hia_scalar_commit"
          RUSTC="$(rustup which --toolchain 1.95.0 rustc)" \
          CARGO_TARGET_DIR="$RUNNER_TEMP/hia-ndu-scalar-target" \
          python -B tools/build_hia_ndu_bridge.py \
            --upstream "$hia_scalar_checkout" --output "$RUNNER_TEMP/hia-ndu-scalar/build" \
            --cargo "$(rustup which --toolchain 1.95.0 cargo)" \
            > "$RUNNER_TEMP/hia-ndu-scalar/build.stdout.log" \
            2> "$RUNNER_TEMP/hia-ndu-scalar/build.stderr.log"
          printf 'HEPTA_NDU_BRIDGE=%s\nHEPTA_NDU_BUILD=%s\nHEPTA_NDU_UPSTREAM=%s\n' \
            "$RUNNER_TEMP/hia-ndu-scalar-target/debug/hia-ndu-bridge" \
            "$RUNNER_TEMP/hia-ndu-scalar/build" "$hia_scalar_checkout" >> "$GITHUB_ENV"
      - name: Retain actual native ambiguity and run the complete integration suite with zero skips
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-ndu-scalar/integration.log"
          from hashlib import sha256
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import time
          import unittest
          from hepta.hia_ndu_optimizer import _native_rank
          from hepta.hia_ndu_scalar_selection import resolve_scalar_selection

          evidence = Path(os.environ['RUNNER_TEMP']) / 'hia-ndu-scalar'
          started = time.perf_counter_ns()
          report = {'schema': 'hepta.hia.ndu-scalar-integration.v1',
              'source_sha': os.environ['HEPTA_SOURCE_SHA'], 'status': 'INCOMPLETE',
              'new_provider_calls': 0, 'economic_benefit_established': False,
              'model_cost': None, 'full_cost_complete': False,
              'scope': 'software integration and actual scalar native ABI; no Agent or performance claim',
              'python': sys.version, 'platform': platform.platform(),
              'dependencies': {name: importlib.metadata.version(name) for name in ('jsonschema','z3-solver')}}
          try:
              if sys.platform != 'linux':
                  raise AssertionError('sealed ranking transport requires Linux')
              bridge = {'binary': os.environ['HEPTA_NDU_BRIDGE'],
                  'build_receipt': str(Path(os.environ['HEPTA_NDU_BUILD']) / 'build-receipt.json')}
              request = {'schema': 'hepta.hia.ndu-request.v1', 'objective_sha256': '1' * 64,
                  'generation': 1, 'resource_cap_q32': 1000, 'candidates': [
                      {'id': cid, 'cost_q32': cost, 'uncertainty_q32': 0, 'resource_q32': 0,
                       'hard_violation': False, 'support_sha256': '2' * 64}
                      for cid,cost in (('abstain',100),('beta',50),('alpha',50))]}
              response, identity = _native_rank(bridge,request,timeout_s=2)
              selection = resolve_scalar_selection(request,response)
              probe = {'request': request, 'native_response': response, 'native_identity': identity,
                  'selection_resolution': selection, 'scope': 'actual native ABI regression input; not a task cohort'}
              (evidence / 'actual-native-tie.json').write_text(json.dumps(probe,indent=2) + '\n')
              assert response['advisory_recommendation'] is None
              assert response['disposition'] == 'ParetoSetRequiresSlowPath'
              assert response['pareto_frontier'] == ['alpha','beta']
              assert selection['selected_id'] == 'alpha'
              assert selection['selection_source'] == 'caller_pareto_tie_policy'
              report['actual_native_probe'] = {'completed': True,
                  'sha256': sha256((evidence / 'actual-native-tie.json').read_bytes()).hexdigest(),
                  'binary_sha256': identity['binary_sha256'],
                  'build_receipt_sha256': identity['build_receipt_sha256']}
              modules = [
                  'tests.test_hia_ndu_scalar_selection',
                  'tests.test_hia_agent_macro_policy',
                  'tests.test_hia_macro_strong_control',
                  'tests.test_hia_macro_multistep',
                  'tests.test_hia_ndu_optimizer',
                  'tests.test_hia_ndu_optimizer_budget',
                  'tests.test_hia_ndu_optimizer_transport']
              suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
              class Result(unittest.TextTestResult):
                  def __init__(self,*args,**kwargs):
                      super().__init__(*args,**kwargs)
                      self.completed_ids = []
                  def addSuccess(self,test):
                      self.completed_ids.append(test.id())
                      super().addSuccess(test)
              result = unittest.TextTestRunner(verbosity=2,resultclass=Result).run(suite)
              required = 'tests.test_hia_ndu_scalar_selection.NativeScalarSelectionTests.test_actual_native_tie_and_injected_wrong_frontier'
              qualified = (result.wasSuccessful() and not result.skipped and not result.expectedFailures
                  and required in result.completed_ids and result.testsRun > 0)
              report.update(status='QUALIFIED' if qualified else 'FAILED',
                  modules=modules, tests_run=result.testsRun, successes=result.completed_ids,
                  failures=[{'test': t.id(),'traceback':detail} for t,detail in result.failures],
                  errors=[{'test': t.id(),'traceback':detail} for t,detail in result.errors],
                  expected_failures=[{'test':t.id(),'traceback':detail} for t,detail in result.expectedFailures],
                  skipped=[{'test':t.id(),'reason':reason} for t,reason in result.skipped],
                  required_native_test_completed=required in result.completed_ids)
              if not qualified:
                  raise AssertionError('all named integration tests and the native test must pass with zero skips')
          except BaseException as error:
              report['error'] = {'type':type(error).__name__,'message':str(error)}
              raise
          finally:
              report['validation_wall_ns'] = time.perf_counter_ns() - started
              (evidence / 'integration-result.json').write_text(json.dumps(report,indent=2) + '\n')
          PY
      - name: Require the identical clean source after success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-ndu-scalar/source-after.txt"
          cmp "$RUNNER_TEMP/hia-ndu-scalar/source-before.txt" "$RUNNER_TEMP/hia-ndu-scalar/source-after.txt"
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain original build and test receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-ndu-scalar-selection-${{ github.sha }}
          path: ${{ runner.temp }}/hia-ndu-scalar/
          if-no-files-found: error
          retention-days: 30
