name: HIA P0 release p99 #517 exact-head fail-closed regression (research DENY_ALL)

on:
  push:
    branches:
      - research/hia-p0-release-p99-517-**
  pull_request:
    paths:
      - tools/qualify_hia_release_parity.py
      - tests/test_hia_release_parity_tail_gate.py
      - .github/workflows/hia-release-p99-517-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-tail-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze exact source and independently execute finite tail counterexample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-release-tail-gate"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/hia-release-tail-gate/tree.txt"
          sha256sum tools/qualify_hia_release_parity.py tests/test_hia_release_parity_tail_gate.py \
            | tee "$RUNNER_TEMP/hia-release-tail-gate/file-hashes.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-release-tail-gate/tests.log"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import unittest

          root = Path.cwd()
          out = Path(os.environ["RUNNER_TEMP"]) / "hia-release-tail-gate"
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_hia_release_parity_tail_gate")
          planned = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree_sha = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          passed = (planned == 5 and result.testsRun == planned and result.wasSuccessful()
                    and not result.skipped and not result.expectedFailures
                    and not result.unexpectedSuccesses
                    and actual_sha == os.environ["EXPECTED_HEAD"])
          files = ["tools/qualify_hia_release_parity.py", "tests/test_hia_release_parity_tail_gate.py",
                   ".github/workflows/hia-release-p99-517-gate.yml"]
          receipt = {
              "schema": "hepta.hia.release-p99-tail-gate.v1",
              "source_commit": actual_sha,
              "source_tree": tree_sha,
              "files_sha256": {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in files},
              "expected_tests": planned, "executed_tests": result.testsRun,
              "errors": len(result.errors), "failures": len(result.failures),
              "skipped": len(result.skipped), "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
              "status": "passed" if passed else "failed",
              "synthetic_cohort_only": True,
              "measured_native_performance": False,
              "rust_parity_established": False,
              "authority": "DENY_ALL",
              "production_activation_allowed": False,
          }
          (out / "receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          if not passed:
              raise SystemExit(1)
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain exact-source receipt, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-release-p99-517-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hia-release-tail-gate/
          if-no-files-found: warn
          retention-days: 30
