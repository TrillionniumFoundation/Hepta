name: HIA reconciliation workflow YAML negative-gate (research DENY_ALL)

on:
  push:
    branches:
      - research/hia-seven-track-yaml-negative-gate-20261031-run9
  pull_request:
    branches:
      - work/hia-seven-track-reconcile-p7-driver-digest-20261031-gpt6
    paths:
      - 'tests/test_hia_reconciliation_workflow_yaml.py'
      - '.github/workflows/hia-reconciliation-yaml-gate.yml'
      - '.github/workflows/hepta-c-posttest-hosts.yml'
      - '.github/workflows/hepta-crc-context.yml'
      - '.github/workflows/hepta-intelligent-assembly-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-adversarial-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HEPTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Parse exact workflows, reject parent failure and retain clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m unittest -v tests.test_hia_reconciliation_workflow_yaml
          test -z "$(git status --porcelain --untracked-files=all)"
