name: Resume retained a733 original evidence without product execution
on:
  push:
    branches: ["codex/hia-normal-core-custody-v85-r2-20261113-dda7"]
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Parse frozen custodian and explicitly guarded resume
        run: |
          python -B - <<'PY'
          import ast, hashlib, json, pathlib
          for p in ("collect_originals.py", "resume_a733.py"):
              ast.parse(pathlib.Path(p).read_bytes())
          assert hashlib.sha256(pathlib.Path("collect_originals.py").read_bytes()).hexdigest() == "a252031e27c492671cc045654ad8dd4fd25730d57ab3bd1c4c0ea9a3e6f954cb"
          assert hashlib.sha256(pathlib.Path("inputs/ORIGINALS.json").read_bytes()).hexdigest() == "22cf6e2f6d1353faee1998625aa580bcea17cfe00e196abf1c7b424018f7940d"
          d = json.loads(pathlib.Path("inputs/RESUME.json").read_bytes())
          assert d["carrier"]["artifact"]["id"] == 14007242551
          assert d["original"]["artifact"]["id"] == 14006895740
          assert d["source_replay"] is False and d["product_imports"] is False and d["new_qualification"] is False
          print("Frozen original verifier and narrow transport resume parsed. Product execution count: 0.")
          PY
      - name: Read original failure then resume only its retained a733 bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B resume_a733.py
      - name: Retain exact carrier, original bytes, complete or partial pools and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v85-normal-core-custody-resume-r2
          path: |
            ${{ runner.temp }}/hia-v85-normalcore-custody-${{ github.run_id }}/*.json
            ${{ runner.temp }}/hia-v85-normalcore-custody-${{ github.run_id }}/*.zip
            ${{ runner.temp }}/hia-v85-normalcore-custody-${{ github.run_id }}/*.tar.gz
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
