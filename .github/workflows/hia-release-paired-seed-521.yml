name: HIA P0 paired-seed release parity exact-head (research DENY_ALL)

on:
  push:
    branches:
      - 'research/hia-p0-paired-seed-parity-521-*'
  pull_request:
    paths:
      - tools/qualify_hia_release_parity.py
      - tests/test_hia_release_paired_seed.py
      - .github/workflows/hia-release-paired-seed-521.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-seed-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Immutable exact-head paired-workload adversarial regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-paired-seed"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee "$RUNNER_TEMP/hia-paired-seed/commit.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/hia-paired-seed/tree.txt"
          sha256sum tools/qualify_hia_release_parity.py benchmarks/hia_native_ndu/PROTOCOL.json tests/test_hia_release_paired_seed.py .github/workflows/hia-release-paired-seed-521.yml | tee "$RUNNER_TEMP/hia-paired-seed/file-hashes.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-paired-seed/tests.log"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import unittest

          name = "tests.test_hia_release_paired_seed"
          suite = unittest.defaultTestLoader.loadTestsFromName(name)
          def walk(s):
              for item in s:
                  if isinstance(item, unittest.TestSuite):
                      yield from walk(item)
                  else:
                      yield item.id()
          planned_ids = list(walk(suite))
          planned = len(planned_ids)
          class ExactResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.started_ids = []
                  self.stopped_ids = []
              def startTest(self, test):
                  self.started_ids.append(test.id())
                  super().startTest(test)
              def stopTest(self, test):
                  self.stopped_ids.append(test.id())
                  super().stopTest(test)
          result = unittest.TextTestRunner(verbosity=2, resultclass=ExactResult).run(suite)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          paths = ("tools/qualify_hia_release_parity.py", "benchmarks/hia_native_ndu/PROTOCOL.json",
                   "tests/test_hia_release_paired_seed.py", ".github/workflows/hia-release-paired-seed-521.yml")
          expected_suffixes = ("test_unseen_holdout_seed_swap_must_fail_despite_identical_pooled_p99",
                               "test_training_seed_swap_must_fail_even_if_holdout_remains_clean",
                               "test_identical_seed_matched_native_timings_still_pass",
                               "test_full_registered_request_coverage_remains_mandatory")
          expected_ids = {name + ".ReleasePairedSeedTests." + item for item in expected_suffixes}
          good = (planned == 4 and set(planned_ids) == expected_ids
                  and len(set(planned_ids)) == planned and planned_ids == result.started_ids
                  and result.started_ids == result.stopped_ids
                  and result.testsRun == planned and result.wasSuccessful()
                  and not result.skipped and not result.expectedFailures
                  and not result.unexpectedSuccesses and head == os.environ["EXPECTED_HEAD"])
          receipt = {"schema": "hepta.hia.p0-paired-seed-admission.v1",
                     "head": head, "tree": tree, "planned": planned, "executed": result.testsRun,
                     "planned_ids": planned_ids, "started_ids": result.started_ids,
                     "stopped_ids": result.stopped_ids,
                     "failures": len(result.failures), "errors": len(result.errors),
                     "skipped": len(result.skipped), "xfail": len(result.expectedFailures),
                     "xpass": len(result.unexpectedSuccesses),
                     "sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in paths},
                     "status": "passed" if good else "failed",
                     "synthetic_paired_seed_tests_only": True, "measured_native_performance": False,
                     "authority": "DENY_ALL", "production_activation_allowed": False}
          Path(os.environ["RUNNER_TEMP"], "hia-paired-seed", "receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2)+"\n")
          print(json.dumps(receipt, sort_keys=True))
          if not good:
              raise SystemExit(1)
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain failure and success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-paired-seed-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hia-paired-seed/
          if-no-files-found: warn
          retention-days: 30
