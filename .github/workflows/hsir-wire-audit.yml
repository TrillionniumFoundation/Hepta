name: Hepta HSIR wire audit regressions

on:
  push:
    paths:
      - tools/audit_hsir_wire.py
      - tests/test_hsir_wire_audit.py
      - .github/workflows/hsir-wire-audit.yml
  pull_request:
    paths:
      - tools/audit_hsir_wire.py
      - tests/test_hsir_wire_audit.py
      - .github/workflows/hsir-wire-audit.yml

permissions:
  contents: read

jobs:
  hsir-wire-negative-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out commit and clean tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Run positive and adversarial HSIR wire audit tests
        run: python3 -m unittest discover -s tests -p 'test_hsir_wire_audit.py' -v
