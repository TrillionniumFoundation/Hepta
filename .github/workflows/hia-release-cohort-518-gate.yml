name: HIA P0 release cohort registration exact-head safety (research DENY_ALL)

on:
  push:
    branches:
      - 'research/hia-p0-release-cohort-518-*'
  pull_request:
    paths:
      - tools/qualify_hia_release_parity.py
      - tests/test_hia_release_protocol_completeness.py
      - .github/workflows/hia-release-cohort-518-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head finite acceptance regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-release-cohort"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee "$RUNNER_TEMP/hia-release-cohort/commit.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/hia-release-cohort/tree.txt"
          sha256sum tools/qualify_hia_release_parity.py tests/test_hia_release_protocol_completeness.py tests/test_hia_release_parity_tail_gate.py \
            | tee "$RUNNER_TEMP/hia-release-cohort/file-hashes.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-release-cohort/tests.log"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import unittest

          root = Path.cwd()
          output = Path(os.environ["RUNNER_TEMP"]) / "hia-release-cohort"
          selectors = ("tests.test_hia_release_parity_tail_gate",
                       "tests.test_hia_release_protocol_completeness")
          suites = [unittest.defaultTestLoader.loadTestsFromName(name) for name in selectors]
          suite = unittest.TestSuite(suites)
          planned = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          paths = ["tools/qualify_hia_release_parity.py",
                   "tests/test_hia_release_parity_tail_gate.py",
                   "tests/test_hia_release_protocol_completeness.py",
                   ".github/workflows/hia-release-cohort-518-gate.yml"]
          good = (planned == 12 and result.testsRun == planned and result.wasSuccessful()
                  and not result.skipped and not result.expectedFailures
                  and not result.unexpectedSuccesses and head == os.environ["EXPECTED_HEAD"])
          receipt = {"schema": "hepta.hia.release-cohort-registration.v1",
                     "source_commit": head, "source_tree": tree,
                     "files_sha256": {path: hashlib.sha256((root/path).read_bytes()).hexdigest() for path in paths},
                     "planned": planned, "executed": result.testsRun,
                     "failed": len(result.failures), "errors": len(result.errors),
                     "skipped": len(result.skipped),
                     "expected_failures": len(result.expectedFailures),
                     "unexpected_successes": len(result.unexpectedSuccesses),
                     "status": "passed" if good else "failed",
                     "synthetic_cohort_only": True, "native_performance_measured": False,
                     "authority": "DENY_ALL", "production_activation_allowed": False}
          (output/"receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2)+"\n")
          print(json.dumps(receipt, sort_keys=True))
          if not good:
              raise SystemExit(1)
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain immutable exact-source receipt including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-release-cohort-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hia-release-cohort/
          if-no-files-found: warn
          retention-days: 30
