name: Isolated ELF development v76
on:
  push:
    branches:
      - codex/hia-elf-development-v76-20261112-dda7
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elf-development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact original product source
        uses: actions/checkout@v4
        with:
          ref: 7e9c5a796a29746d169f9db97392ec774f627c03
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install original pinned development prerequisites
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Actual ELF component and original caller controls
        run: >-
          python -B harness/inputs/run_elf_development.py
          --source source --inputs harness/inputs --output elf-development-evidence
      - name: Retain complete original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-elf-v76-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            elf-development-evidence
            harness/inputs
          if-no-files-found: error
