name: HIA heap optimization development
on:
  push:
    branches: [codex/hia-heap-optimization-development-v76-20261112-dda7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-heap-development-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact product base
        uses: actions/checkout@v4
        with:
          ref: 5f7f95367e8e395863801487e969d286b9091110
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install original source-pinned test dependencies
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Exact-source development compile and original gates
        run: >-
          python -I -B harness/scripts/run_heap_development.py
          --source source --inputs harness/inputs --evidence heap-development-evidence
      - name: Preserve original complete evidence and inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-heap-optimization-development-v76-r1
          if-no-files-found: error
          retention-days: 90
          path: |
            heap-development-evidence/
            harness/inputs/
            harness/scripts/
            harness/.github/workflows/hia-heap-optimization-development.yml
