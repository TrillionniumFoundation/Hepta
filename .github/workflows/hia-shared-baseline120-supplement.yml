name: HIA original shared frame 120-case observation supplement
on:
  push:
    branches:
      - codex/hia-core-plan-r4-baseline120-r2-20261112-dda7
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout the new observation caller only
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout the unchanged original independent harness
        uses: actions/checkout@v4
        with:
          ref: 0cade56c88497b1baa90f541c16c1ce3ff6c85cd
          path: original
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the exact published product base
        uses: actions/checkout@v4
        with:
          ref: 4b19af89a766593f7d5f1cc2db256e81aba7afcb
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Select the actual independent interpreter
        uses: actions/setup-python@v5
        with:
          python-version: 3.14.4
      - name: Install the unchanged original prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils gcc strace
          python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Repeat only original source admission and baseline preparation
        id: baseline
        run: >-
          python -B original/inputs/run_development.py
          --source "$GITHUB_WORKSPACE/source"
          --out "$RUNNER_TEMP/hia-shared-r3-baseline120-cpython314-r2"
          --stage baseline
      - name: Execute the original 120-case probe with its actual positional interface
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: >-
          python -B harness/run_baseline120.py
          --source "$GITHUB_WORKSPACE/source"
          --original "$GITHUB_WORKSPACE/original"
          --out "$RUNNER_TEMP/hia-shared-r3-baseline120-cpython314-r2"
      - name: Retain the complete original observation and every raw failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-shared-r3-baseline120-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-shared-r3-baseline120-cpython314-r2
            harness/run_baseline120.py
            harness/STATIC-REVIEW.json
            harness/README.md
            original/inputs
          retention-days: 90
          if-no-files-found: error
