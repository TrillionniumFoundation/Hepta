name: HIA v92 failed CI original ranges and step42 diagnostics

on: [create]

permissions: {}

jobs:
  retain_original:
    name: Retain one historical ZIP as a fixed complete partition
    if: >-
      ${{ github.repository == 'TrillionniumFoundation/Hepta' &&
          github.event_name == 'create' &&
          github.event.ref_type == 'branch' &&
          github.event.ref == 'codex/hia-v92-failed-ci-original-parts-r1-20261113-e26e' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact reviewed custody control without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 89aa086c8e345ecae66cb32a2dd9ff39fe1f35de
          path: control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
      - name: Set up the fixed custody interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
          check-latest: false
      - name: Verify frozen controls and create new private custody roots
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v92_failed_ci_20261113/multipart-r1/controller.py prepare --root "$RUNNER_TEMP/hia-v92-failed-ci-parts-r1" --policy-sha256 c4171e09f97480c0ba4d1b7b31aac477590f579b6dcc370b4f8505d5e4dc7806 --control-commit 89aa086c8e345ecae66cb32a2dd9ff39fe1f35de
      - name: Read the one sealed original ZIP and create the fixed partition under the original 900-second guardian
        id: owned_collection
        timeout-minutes: 16
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HIA_CUSTODY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v92_failed_ci_20261113/multipart-r1/controller.py run --root "$RUNNER_TEMP/hia-v92-failed-ci-parts-r1" --policy-sha256 c4171e09f97480c0ba4d1b7b31aac477590f579b6dcc370b4f8505d5e4dc7806 --control-commit 89aa086c8e345ecae66cb32a2dd9ff39fe1f35de
      - name: Independently retain every fixed part and controls after closed ECHILD
        if: always()
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_v92_failed_ci_20261113/multipart-r1/controller.py finalize --root "$RUNNER_TEMP/hia-v92-failed-ci-parts-r1" --policy-sha256 c4171e09f97480c0ba4d1b7b31aac477590f579b6dcc370b4f8505d5e4dc7806 --control-commit 89aa086c8e345ecae66cb32a2dd9ff39fe1f35de
      - name: Preserve available step42 original diagnostics and current closed owner first
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v92-failed-ci-step42-originals-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v92-failed-ci-parts-public-r1/small/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Preserve original ZIP range 00 and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v92-failed-ci-original-part-00-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v92-failed-ci-parts-public-r1/part-00/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Preserve original ZIP range 01 and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v92-failed-ci-original-part-01-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v92-failed-ci-parts-public-r1/part-01/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Preserve original ZIP range 02 and complete small controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-v92-failed-ci-original-part-02-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-v92-failed-ci-parts-public-r1/part-02/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
