name: Default build output paths
on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/**'
      - 'tools/test_cli_default_output_path.py'
      - 'tools/cli_default_output_path_inventory.json'
      - '.github/workflows/hepta-cli-default-output-path.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind source and execute the frozen default-output and inherited input controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          rustup toolchain install 1.90.0 --profile minimal
          export RUSTC="$(rustup which --toolchain 1.90.0 rustc)"
          export CC="$(command -v gcc)"
          mkdir -p artifacts/cli-default-output-path
          { git rev-parse HEAD HEAD^{tree}; uname -a; python --version; \
            "$CC" --version; git --version; "$RUSTC" --version; \
            sha256sum "$CC" "$(command -v git)" "$RUSTC"; \
          } > artifacts/cli-default-output-path/identities.txt
          python -B tools/test_cli_default_output_path.py 2>&1 | tee artifacts/cli-default-output-path/tests.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-default-output-path-${{ matrix.os }}-${{ env.EXPECTED_HEAD }}
          path: artifacts/cli-default-output-path
          if-no-files-found: error
