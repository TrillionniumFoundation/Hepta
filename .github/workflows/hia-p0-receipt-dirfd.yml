name: HIA P0 secure qualification receipts (scoped)
on:
  push:
    branches: [work/hia-p0-secure-qualification-receipts-20261031-gpt6]
  pull_request:
    branches: [work/hia-p7-queue-intake-snapshot-20261031-gpt6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-dirfd-and-real-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strict receipt writer adversarial and real test-identity gate
        run: |
          set -eu
          python -B -m unittest tests.test_hia_three_lane_gate -v
          python -B -m tools.qualify_hia_three_lane --suite gate --output "$RUNNER_TEMP/hia-dirfd-gate.json"
          python -B -m tools.qualify_hia_three_lane --suite core --output "$RUNNER_TEMP/hia-dirfd-core.json"
      - name: Re-run existing real C/ELF and paired sample evidence
        run: |
          set -eu
          python -B -m tools.qualify_hia_three_lane --suite native --output "$RUNNER_TEMP/hia-dirfd-native.json"
      - name: Verify source and no untracked receipt writes
        run: |
          set -eu
          python -B -m py_compile tools/qualify_hia_three_lane.py tests/test_hia_three_lane_gate.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-p0-dirfd-source-bound-receipts
          path: |
            ${{ runner.temp }}/hia-dirfd-gate.json
            ${{ runner.temp }}/hia-dirfd-core.json
            ${{ runner.temp }}/hia-dirfd-native.json
          if-no-files-found: warn
