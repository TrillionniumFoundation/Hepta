name: Fixed combined HIA source generation and complete Source gate
on:
  push:
    branches:
      - codex/hia-combined-source-build-v87-r5-20261113-dda7
permissions:
  contents: write
jobs:
  generate-and-check-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out only the isolated integration harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false
      - name: Select the original development interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - name: Install the original Source discovery dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Parse and compile the exact integration harness without running it
        run: |
          python -I -B - <<'PY'
          import ast, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'harness' / 'tools'
          for path in sorted(root.glob('*.py')):
              compile(ast.parse(path.read_bytes(), filename=str(path)), str(path), 'exec', dont_inherit=True)
              print('harness syntax PASS:', path.name)
          PY
      - name: Merge fixed heads, regenerate all HIA owners and run the complete Source suite
        env:
          HIA_REHEARSAL_TOKEN: ${{ github.token }}
          EXPECTED_INPUTS_GIT_BLOB: bf9664cd49486aaca25ce7bff15a59ae3b628fe3
          EXPECTED_DRIVER_GIT_BLOB: c63dec1726b9c9ac3d67147abd479583ea0b644e
        run: |
          python -I -B "${GITHUB_WORKSPACE}/harness/tools/materialize_candidate.py" \
            --inputs "${GITHUB_WORKSPACE}/harness/inputs/MATERIALIZATION.json" \
            --root "${RUNNER_TEMP}/hia-combined-source-v87-r5"
      - name: Retain real input sources, partial generated bytes, logs and all outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-combined-source-v87-r5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-combined-source-v87-r5/evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
