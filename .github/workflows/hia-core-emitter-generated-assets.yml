name: HIA exact original Core Emitter generated assets

on: [create]

permissions: {}

jobs:
  frame_originals:
    if: >-
      ${{ github.repository == 'TrillionniumFoundation/Hepta' &&
          github.event_name == 'create' &&
          github.event.ref_type == 'branch' &&
          github.event.ref == 'codex/hia-core-emitter-generated-assets-run-r1-20261112-e26e' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact reviewed asset reader without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 8b10b000a43e57cdaa27f60d425b6625e4b2209a
          path: control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
      - name: Set up the fixed custody interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
          check-latest: false
      - name: Verify frozen control bytes and create new private custody roots
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              if [[ -z "${pythonLocation-}" ]]; then
                printf '%s\n' 'setup-python location is unavailable' >&2
                exit 1
              fi
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          python -I -S -B control/experiments/hia_core_emitter_20261111/generated-assets-reader-r1/controller.py prepare --root "$RUNNER_TEMP/hia-core-emitter-generated-assets-r1" --policy-sha256 23084b55ea9fae4c7e8696064f3ee98635622994182c11d872fc6751044196fd --control-commit 8b10b000a43e57cdaa27f60d425b6625e4b2209a
      - name: Read all 103 exact original members under the unchanged 900-second guardian
        id: owned_collection
        timeout-minutes: 16
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HIA_CUSTODY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              if [[ -z "${pythonLocation-}" ]]; then
                printf '%s\n' 'setup-python location is unavailable' >&2
                exit 1
              fi
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          python -I -S -B control/experiments/hia_core_emitter_20261111/generated-assets-reader-r1/controller.py run --root "$RUNNER_TEMP/hia-core-emitter-generated-assets-r1" --policy-sha256 23084b55ea9fae4c7e8696064f3ee98635622994182c11d872fc6751044196fd --control-commit 8b10b000a43e57cdaa27f60d425b6625e4b2209a
      - name: Verify original bytes and frame all 39 units only after closed cleanup
        if: always()
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              if [[ -z "${pythonLocation-}" ]]; then
                printf '%s\n' 'setup-python location is unavailable' >&2
                exit 1
              fi
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          python -I -S -B control/experiments/hia_core_emitter_20261111/generated-assets-reader-r1/controller.py finalize --root "$RUNNER_TEMP/hia-core-emitter-generated-assets-r1" --policy-sha256 23084b55ea9fae4c7e8696064f3ee98635622994182c11d872fc6751044196fd --control-commit 8b10b000a43e57cdaa27f60d425b6625e4b2209a
      - name: Preserve independent raw source custody and bounded HOLD originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-core-emitter-generated-assets-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-core-emitter-generated-asset-receipts-r1/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
