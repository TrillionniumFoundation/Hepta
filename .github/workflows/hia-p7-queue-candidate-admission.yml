name: HIA P7 bounded queue candidate image admission (research)
on:
  push:
    branches:
      - work/hia-p7-queue-candidate-admission-unfixed-20261031-gpt6
      - work/hia-p7-queue-candidate-admission-20261031-gpt6
  pull_request:
    branches:
      - work/hia-p7-image-token-mode-admission-20261031-gpt6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record exact Git source under test
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain
      - name: Reject oversized candidate before dictionary, preserve cost semantics
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_queue_candidate_admission.CandidateAdmissionControls -v 2>&1 | tee /tmp/hia-p7-candidate-admission-fixtures.log
          if grep -qE 'skipped|expected failure|unexpected success' /tmp/hia-p7-candidate-admission-fixtures.log; then exit 1; fi
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-candidate-admission-negative-controls
          path: /tmp/hia-p7-candidate-admission-fixtures.log
          if-no-files-found: warn

  pinned-native-and-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CLANG: /usr/bin/clang-20
      HEPTA_CLANG: /usr/bin/clang-20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin actual Clang20, Z3, and optimization dependencies
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev llvm-20 lld-20 build-essential
          python -m pip install --disable-pip-version-check -e '.[optimization]' 'zstandard==0.25.0'
          test -x "$CLANG"
          python -c 'import z3; print("Z3", z3.get_version_string())'
      - name: Verify native positive control and P0/P1/P5/P7 owner contract
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python -B -m unittest tests.test_hia_queue_candidate_admission tests.test_hia_continuation tests.test_hia_image_token_admission -v 2>&1 | tee /tmp/hia-p7-candidate-native.log
          if grep -qE 'skipped|expected failure|unexpected success' /tmp/hia-p7-candidate-native.log; then exit 1; fi
          python -B -m tools.qualify_hia_three_lane --suite core --output /tmp/hia-p7-candidate-core.json
          python -B -m tools.qualify_hia_three_lane --suite native --output /tmp/hia-p7-candidate-native.json
          python -B -m py_compile hepta/hia_stateful.py tests/test_hia_queue_candidate_admission.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-candidate-admission-native-source-bound
          path: |
            /tmp/hia-p7-candidate-native.log
            /tmp/hia-p7-candidate-core.json
            /tmp/hia-p7-candidate-native.json
          if-no-files-found: warn
