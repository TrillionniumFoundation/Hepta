name: HIA Core lowering CI43560277563 exact24 diagnostics-only r1

on: [create]

permissions: {}

jobs:
  retain_original:
    name: Retain 24 exact Core lowering diagnostic originals
    if: >-
      ${{ github.repository == 'TrillionniumFoundation/Hepta' &&
          github.event_name == 'create' &&
          github.event.ref_type == 'branch' &&
          github.event.ref == 'codex/hia-core-owner-ci43560277563-diagnostics-only-r1-20261114-e26e' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact reviewed custody control without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 1917f6208420b47004f277d66b0da8e3b4f98e5c
          path: control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
      - name: Set up the fixed custody interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
          check-latest: false
      - name: Verify frozen controls and create new private custody roots
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_core_owner_20261114/ci43560277563-diagnostics-only-r1/controller.py prepare --root "$RUNNER_TEMP/hia-core-owner-ci43560277563-diagnostics-r1" --policy-sha256 f4a7e836f169d6828e6e16813c641f2b0683927e2a52c33e1f5637eca49db8cc --control-commit 1917f6208420b47004f277d66b0da8e3b4f98e5c
      - name: Read one sealed original ZIP and all fixed diagnostics under the original 900-second guardian
        id: owned_collection
        timeout-minutes: 16
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HIA_CUSTODY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_core_owner_20261114/ci43560277563-diagnostics-only-r1/controller.py run --root "$RUNNER_TEMP/hia-core-owner-ci43560277563-diagnostics-r1" --policy-sha256 f4a7e836f169d6828e6e16813c641f2b0683927e2a52c33e1f5637eca49db8cc --control-commit 1917f6208420b47004f277d66b0da8e3b4f98e5c
      - name: Independently retain every fixed diagnostic and controls after closed ECHILD
        if: always()
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          python -I -S -B control/experiments/hia_core_owner_20261114/ci43560277563-diagnostics-only-r1/controller.py finalize --root "$RUNNER_TEMP/hia-core-owner-ci43560277563-diagnostics-r1" --policy-sha256 f4a7e836f169d6828e6e16813c641f2b0683927e2a52c33e1f5637eca49db8cc --control-commit 1917f6208420b47004f277d66b0da8e3b4f98e5c
      - name: Preserve exact Core lowering originals and the closed collector owner first
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-core-owner-ci43560277563-diagnostics-r1-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-core-owner-ci43560277563-diagnostics-public-r1/small/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
