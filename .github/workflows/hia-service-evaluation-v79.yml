name: Service evaluation P1 independent development
on:
  push:
    branches: [codex/hia-service-evaluation-v81-cpython314-r6-20261112-dda7]
permissions:
  contents: read
jobs:
  development:
    name: Actual CPython 3.14.4 nine-body evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout independent immutable harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout authentic published 4b source
        uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 4b19af89a766593f7d5f1cc2db256e81aba7afcb
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact saved joint development recipe
        uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 794d441e1b44e3478f779c900d1fbf5319b8c2c5
          path: joint
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Explicit original development prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gcc strace clang-20
          python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Admit complete Git trees and finite frozen source overlay
        id: prepare
        run: python -B harness/inputs/run_evaluation_development.py --stage prepare --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Generate all original assets and two new Evaluation assets
        id: generate
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage generate --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Complete new source and adapter groups plus original resource contracts
        id: source
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage source --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Actual HIA build with original 20-second compiler limit
        id: build
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage build --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Actual original pre/post-admission helper binding observations
        id: helper_bindings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage helper-binding --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Complete new native permissions and independent VM controls
        id: component
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage component --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Original Agent 48 complete caller group (1800 seconds)
        id: agent
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage agent --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Original namespace wrapper and all 35 nested callers (1800 seconds)
        id: namespace
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage namespace --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Original ledger wrapper and all 48 nested callers (1800 seconds)
        id: ledger
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -B harness/inputs/run_evaluation_development.py --stage ledger --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - name: Preserve all actual outcomes and lossless evidence
        id: finish
        if: ${{ always() }}
        run: python -B harness/inputs/run_evaluation_development.py --stage finish --source "$GITHUB_WORKSPACE/source" --joint "$GITHUB_WORKSPACE/joint" --output "$RUNNER_TEMP/service-evaluation-r6"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: service-evaluation-r6-original-evidence
          path: |
            ${{ runner.temp }}/service-evaluation-r6
            harness/inputs
            harness/README.md
            harness/STATIC-REVIEW.json
          if-no-files-found: error
          retention-days: 90
