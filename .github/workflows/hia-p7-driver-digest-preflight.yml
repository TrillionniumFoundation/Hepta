name: HIA P7 driver digest exact SHA-256 preflight (research)
on:
  push:
    branches:
      - research/hia-p7-driver-sha-preflight-20261031-gpt6
  pull_request:
    paths:
      - hepta/hia_artifact_session.py
      - tests/test_hia_artifact_driver_preflight.py
      - .github/workflows/hia-p7-driver-digest-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-digest-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD^{tree}
          git rev-parse HEAD^
          sha256sum hepta/hia_artifact_session.py tests/test_hia_artifact_driver_preflight.py
      - name: Execute source-exact digest refusal and allowed path tests with no skips
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_artifact_driver_preflight -v 2>&1 | tee "$RUNNER_TEMP/driver-digest.log"
          if grep -Eq '\.\.\. (skipped|expected failure|unexpected success)' "$RUNNER_TEMP/driver-digest.log"; then exit 1; fi
          python -B -m py_compile hepta/hia_artifact_session.py tests/test_hia_artifact_driver_preflight.py
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-p7-driver-digest-${{ github.sha }}
          path: ${{ runner.temp }}/driver-digest.log
          if-no-files-found: warn

  native-driver-and-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CLANG: /usr/bin/clang-20
      HEPTA_CLANG: /usr/bin/clang-20
      HEPTA_RUN_ARTIFACT_SESSION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin the native compiler and actual Z3 verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD^{tree}
          sha256sum hepta/hia_artifact_session.py tests/test_hia_artifact_driver_native.py
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev llvm-20 lld-20 build-essential
          python -m pip install --disable-pip-version-check -e '.[optimization]' 'zstandard==0.25.0'
          python -c 'import z3; print("Z3", z3.get_version_string())'
          test -x "$CLANG"
      - name: Run real native driver SHA admission and retained prepared-artifact execution
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_artifact_driver_preflight tests.test_hia_artifact_driver_native tests.test_hia_artifact_session.PreparedArtifactSessionTests.test_independent_proof_once_then_actual_native_reuse_without_new_solver tests.test_hia_artifact_session.PreparedArtifactSessionTests.test_entry_byte_lease_and_execution_limits_refuse_without_extra_build -v 2>&1 | tee "$RUNNER_TEMP/hia-driver-native.log"
          if grep -Eq '\.\.\. (skipped|expected failure|unexpected success)' "$RUNNER_TEMP/hia-driver-native.log"; then exit 1; fi
      - name: Independently requalify source-bound Core and genuine native gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_hia_catalog.py --check
          python -B -m tools.qualify_hia_three_lane --suite core --output "$RUNNER_TEMP/hia-driver-core.json"
          python -B -m tools.qualify_hia_three_lane --suite native --output "$RUNNER_TEMP/hia-driver-native.json"
          python -B -m py_compile hepta/hia_artifact_session.py tests/test_hia_artifact_driver_preflight.py tests/test_hia_artifact_driver_native.py tools/qualify_hia_verified_increment.py
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-p7-driver-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hia-driver-native.log
            ${{ runner.temp }}/hia-driver-core.json
            ${{ runner.temp }}/hia-driver-native.json
          if-no-files-found: warn
