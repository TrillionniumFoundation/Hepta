name: HIA three-lane P0-P1-P5 integration qualification
on:
  push:
    branches:
      - work/hia-crosslane-p0-p1-p5-20261031-gpt6
      - work/hia-p0-p7-verified-json-matrix-20261031-gpt6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-python-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact project solver dependency (no skipped proof)
        run: |
          set -eu
          python -m pip install --disable-pip-version-check 'z3-solver==4.15.4.0'
          python -c 'import z3; print("Z3", z3.get_version_string())'
      - name: Rebuild/check single HIA instruction catalog
        run: |
          set -eu
          python tools/generate_hia_catalog.py --check
      - name: Execute source-exact P0/P1/P5 semantic/resource tests with ZERO SKIP
        run: |
          set -eu
          python -B -m tools.qualify_hia_three_lane --suite core --output /tmp/hia-three-lane-core.json
      - name: Run real C/ELF observer and raw native paired replay with ZERO SKIP
        run: |
          set -eu
          python -B -m tools.qualify_hia_three_lane --suite native --output /tmp/hia-three-lane-native.json
      - name: Check Python source and no test-induced mutation
        run: |
          set -eu
          python -B -m py_compile hepta/hia_program.py hepta/hia_program_runtime.py hepta/hia_opcodes.py hepta/hia_bounded_wire.py tools/qualify_hia_three_lane.py
          git diff --exit-code
      - name: Retain scoped test receipts including refused failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-three-lane-python-${{ github.sha }}
          path: |
            /tmp/hia-three-lane-core.json
            /tmp/hia-three-lane-native.json
          if-no-files-found: error

  independent-rust-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Rust 1.95 profile and record toolchain
        run: |
          set -eu
          rustup toolchain install 1.95.0 --profile minimal
          python --version
          rustc --version
          cargo --version
          clang --version
      - name: Stage Cargo.lock crates before STRICT OFFLINE test build
        run: |
          set -eu
          cargo fetch --locked --manifest-path rust/hia-core-shadow/Cargo.toml
          cargo metadata --locked --offline --manifest-path rust/hia-core-shadow/Cargo.toml --format-version 1 --no-deps > /tmp/hia-rust-locked-metadata.json
      - name: Run independent Rust shadow / bounded ledger tests with ZERO SKIP
        run: |
          set -eu
          python -B -m tools.qualify_hia_three_lane --suite rust --output /tmp/hia-three-lane-rust.json
      - name: Recheck tracked source
        run: git diff --exit-code
      - name: Retain Rust shadow admission receipt on either outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-three-lane-rust-${{ github.sha }}
          path: |
            /tmp/hia-three-lane-rust.json
            /tmp/hia-rust-locked-metadata.json
          if-no-files-found: warn
