name: HIA original evidence recovery v73
on:
  push:
    branches: ['codex/hia-evidence-recovery-v73-20261112-dda7']
permissions:
  contents: read
  actions: read
jobs:
  recover-and-check-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            review-evidence/hia-native-rewrite-20261111/v73/recovery-harness/
      - uses: actions/checkout@v4
        with:
          ref: ac3fb576419d9ec36841822b4be0fca420268f1b
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install exact existing source-control prerequisites
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Read the original aa801 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13908947654'
          run-id: 43136468788
          github-token: ${{ github.token }}
          repository: TrillionniumFoundation/Hepta
          path: ${{ runner.temp }}/aa801-original-evidence
          merge-multiple: true
      - name: Recover exact originals and check resource source bindings
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B harness/review-evidence/hia-native-rewrite-20261111/v73/recovery-harness/recover_originals.py \
            --source "$GITHUB_WORKSPACE/candidate" \
            --artifact "$RUNNER_TEMP/aa801-original-evidence" \
            --capsule "$GITHUB_WORKSPACE/harness/review-evidence/hia-native-rewrite-20261111/v73/recovery-harness/source-admission-r1-r3-capsule.json" \
            --output "$RUNNER_TEMP/hia-original-recovery-v73-r1"
      - name: Retain originals, source identities and every actual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-original-recovery-v73-${{ github.run_id }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hia-original-recovery-v73-r1
            ${{ runner.temp }}/aa801-original-evidence
