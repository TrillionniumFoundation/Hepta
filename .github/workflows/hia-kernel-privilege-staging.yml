name: HIA kernel privilege encoder staging

on:
  push:
    paths:
      - hepta/hia_machine_x64.py
      - hepta/hia_machine_x64_kernel.py
      - tests/test_hia_x86_kernel_privilege_staging.py
      - .github/workflows/hia-kernel-privilege-staging.yml
  pull_request:
    paths:
      - hepta/hia_machine_x64.py
      - hepta/hia_machine_x64_kernel.py
      - tests/test_hia_x86_kernel_privilege_staging.py
      - .github/workflows/hia-kernel-privilege-staging.yml

permissions:
  contents: read

jobs:
  x86-privilege-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm independent disassembler available
        run: command -v objdump && objdump --version
      - name: Verify complete cold-replay source closure, including the new kernel helper
        run: python3 -B -c 'from tools.hia_selfhost_contract import validate_contract; validate_contract()'
      - name: Check isolated kernel-only CR3/INVLPG vectors and unchanged ordinary Code
        run: python3 -B -m unittest tests.test_hia_x86_kernel_privilege_staging -v
