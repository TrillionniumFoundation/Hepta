name: HIA kernel privilege encoder staging

on:
  push:
    paths:
      - hepta/hia_machine_x64.py
      - hepta/hia_machine_x64_kernel.py
      - docs/HIA_SELFHOST_CORE_SUPPORT.json
      - docs/HIA_X86_KERNEL_PRIVILEGE_STAGING.md
      - tests/test_hia_x86_kernel_privilege_staging.py
      - tests/test_hia_x86_kernel_interrupt_staging.py
      - tests/test_hia_x86_kernel_atomic_staging.py
      - .github/workflows/hia-kernel-privilege-staging.yml
  pull_request:
    paths:
      - hepta/hia_machine_x64.py
      - hepta/hia_machine_x64_kernel.py
      - docs/HIA_SELFHOST_CORE_SUPPORT.json
      - docs/HIA_X86_KERNEL_PRIVILEGE_STAGING.md
      - tests/test_hia_x86_kernel_privilege_staging.py
      - tests/test_hia_x86_kernel_interrupt_staging.py
      - tests/test_hia_x86_kernel_atomic_staging.py
      - .github/workflows/hia-kernel-privilege-staging.yml

permissions:
  contents: read

jobs:
  x86-privilege-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm independent disassembler available
        run: command -v objdump && objdump --version
      - name: Verify complete cold-replay source closure, including the new kernel helper
        run: python3 -B -c 'from tools.hia_selfhost_contract import validate_contract; validate_contract()'
      - name: Check isolated kernel privilege/atomic encodings and userspace CAS/XADD oracle
        run: python3 -B -m unittest tests.test_hia_x86_kernel_privilege_staging tests.test_hia_x86_kernel_interrupt_staging tests.test_hia_x86_kernel_atomic_staging -v
