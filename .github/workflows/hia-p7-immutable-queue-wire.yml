name: HIA P7 immutable generation-fenced queue wire
on:
  push:
    branches: [work/hia-p7-immutable-fenced-queue-wire-20261031-gpt6]
  pull_request:
    branches: [work/hia-p0-secure-qualification-receipts-20261031-gpt6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-owner-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CLANG: /usr/bin/clang-20
      HEPTA_CLANG: /usr/bin/clang-20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute source-only queue wire, collision and mutable-intake controls
        run: |
          set -eu
          python -B -m unittest tests.test_hia_stateful_wire tests.test_hia_stateful_queue_capture -v
      - name: Install locked toolchain and proof dependency for actual native owner
        run: |
          set -eu
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev llvm-20 lld-20 build-essential
          python -m pip install --disable-pip-version-check -e '.[optimization]' 'zstandard==0.25.0'
          test -x "$CLANG"
          python -c 'import z3; print("Pinned Z3", z3.get_version_string())'
      - name: Actual native owner executes canonical fenced wire and inherited source mutation
        run: |
          set -eu
          python -B -m unittest tests.test_hia_stateful.OwnedNativeTests.test_immutable_fenced_wire_executes_real_native_owner -v
          python -B -m unittest tests.test_hia_stateful.OwnedNativeTests.test_real_native_owner_uses_detached_work_even_after_producer_clears_dict -v
      - name: Integrated clean-core test identity and native evidence
        run: |
          set -eu
          python -B -m tools.qualify_hia_three_lane --suite core --output "$RUNNER_TEMP/hia-p7-wire-core.json"
          python -B -m tools.qualify_hia_three_lane --suite native --output "$RUNNER_TEMP/hia-p7-wire-native.json"
          python -B -m py_compile hepta/hia_stateful.py tests/test_hia_stateful_wire.py tests/test_hia_stateful.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-p7-wire-owned-state-receipts
          path: |
            ${{ runner.temp }}/hia-p7-wire-core.json
            ${{ runner.temp }}/hia-p7-wire-native.json
          if-no-files-found: warn
