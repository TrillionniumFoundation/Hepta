name: HIA pinned Python 3.13 verification wheel
on:
  push:
    branches: ['audit/hia-py313-tools-20261114-f90f']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the pinned wheel without executing package code
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hia-py313-verification-wheel"
          python3 -m pip download --disable-pip-version-check --index-url https://pypi.org/simple --no-cache-dir --only-binary=:all: --no-deps --python-version 3.13 --implementation cp --abi cp313 --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 --dest "$RUNNER_TEMP/hia-py313-verification-wheel" 'rpds-py==2026.6.3' > "$RUNNER_TEMP/hia-py313-verification-wheel/download.stdout" 2> "$RUNNER_TEMP/hia-py313-verification-wheel/download.stderr"
          sha256sum "$RUNNER_TEMP"/hia-py313-verification-wheel/*.whl > "$RUNNER_TEMP/hia-py313-verification-wheel/sha256.txt"
      - name: Preserve whole wheel and original download diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-py313-rpds-2026.6.3-${{ github.sha }}
          path: ${{ runner.temp }}/hia-py313-verification-wheel/
          if-no-files-found: error
          retention-days: 7
