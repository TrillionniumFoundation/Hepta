name: Hepta HSIR and C migration checks
on:
  push:
    branches:
      - dot/hsir-c2hepta-p0-p3-20261024
      - audit/hepta-rustup-pinned-identity-20261028
  workflow_dispatch:

concurrency:
  group: hepta-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-and-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and independently identify pinned Rust 1.90.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          python3 -c 'from hepta.backend import find_rustc, toolchain_info; print(toolchain_info(find_rustc())["version"])'
      - name: Test rustup shim identity and fail-closed controls
        run: python3 -m unittest discover -s tests -p test_rustup_real_compiler_identity.py -v
      - name: Verify compilers
        run: |
          python3 --version
          clang --version
          gcc --version
      - name: Run c2hepta and HSIR suite
        run: python3 -m unittest discover -s tests -p test_c2hepta.py -v
      - name: Run entire Python test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
