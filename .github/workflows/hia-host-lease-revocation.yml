name: HIA P7 owner-grant token revocation exact-head adversarial regression (research DENY_ALL)

on:
  push:
    branches:
      - 'research/hia-p7-token-revocation-*'
  pull_request:
    branches:
      - 'research/hia-p1-lease-authority-fixed-20261031-gpt6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-lease-key-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verifier dependency
        run: python -m pip install 'z3-solver==4.15.4.0'
      - name: Execute original lease grants and three new token-revocation adversarial cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-p7-lease-revocation"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            python -V
            uname -a
            sha256sum hepta/hia_host_region.py tests/test_hia_host_region_lease_authority.py tests/test_hia_host_region_lease_token_revocation.py .github/workflows/hia-host-lease-revocation.yml
          } > "$RUNNER_TEMP/hia-p7-lease-revocation/source-identity.txt"
          set +e
          python -B -m unittest tests.test_hia_host_region_lease_authority tests.test_hia_host_region_lease_token_revocation -v \
            2>&1 | tee "$RUNNER_TEMP/hia-p7-lease-revocation/tests.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'test_exit=%s\\n' "$status" > "$RUNNER_TEMP/hia-p7-lease-revocation/result.txt"
          grep -q 'Ran 7 tests' "$RUNNER_TEMP/hia-p7-lease-revocation/tests.log"
          if grep -Eq 'skipped=|expected failures=|unexpected successes=' "$RUNNER_TEMP/hia-p7-lease-revocation/tests.log"; then
            echo 'Skipping adversarial release tests cannot qualify' >&2
            exit 1
          fi
          test "$status" -eq 0
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve actual RED and repaired GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-p7-lease-revocation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hia-p7-lease-revocation/
          if-no-files-found: warn
          retention-days: 30
