name: Hepta P3 Windows ABI failure trace
on:
  push:
    branches:
      - dot/hepta-p3-native-host-evidence-20261025
  pull_request:
    branches:
      - dot/hepta-p0-p1-semantic-bridge-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain)"
      - name: Test fail-closed evidence
        run: python -m unittest tests.test_native_host_evidence -v
      - name: Run actual Windows ABI matrix without masking failure
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          python tools/validate_native_host.py --rustc "$(rustup which --toolchain 1.90.0 rustc)" --cc clang --expected-system Windows --expected-machine x86_64 --output artifacts/native-host-p3.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-windows-trace-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/native-host-p3.json
          if-no-files-found: warn
