name: HIA exact original Core Emitter generated assets - independent r2

on: [create]

permissions: {}

jobs:
  frame_originals:
    if: >-
      ${{ github.repository == 'TrillionniumFoundation/Hepta' &&
          github.event_name == 'create' &&
          github.event.ref_type == 'branch' &&
          github.event.ref == 'codex/hia-core-emitter-generated-assets-run-r2-20261112-e26e' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact reviewed asset reader without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 16b5040a1282447646212d243f84a11a58e48094
          path: control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
      - name: Set up the fixed custody interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
          check-latest: false
      - name: Verify frozen control bytes and create new private custody roots
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              if [[ -z "${pythonLocation-}" ]]; then
                printf '%s\n' 'setup-python location is unavailable' >&2
                exit 1
              fi
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          python -I -S -B control/experiments/hia_core_emitter_20261112/generated-assets-reader-r2/controller.py prepare --root "$RUNNER_TEMP/hia-core-emitter-generated-assets-r2" --policy-sha256 4592d2c0284a55534808b568efa9a65c9db7b52dd6d533a2fae59191bd1fab27 --control-commit 16b5040a1282447646212d243f84a11a58e48094
      - name: Read all 103 exact original members under the unchanged 900-second guardian
        id: owned_collection
        timeout-minutes: 16
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HIA_CUSTODY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              if [[ -z "${pythonLocation-}" ]]; then
                printf '%s\n' 'setup-python location is unavailable' >&2
                exit 1
              fi
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          python -I -S -B control/experiments/hia_core_emitter_20261112/generated-assets-reader-r2/controller.py run --root "$RUNNER_TEMP/hia-core-emitter-generated-assets-r2" --policy-sha256 4592d2c0284a55534808b568efa9a65c9db7b52dd6d533a2fae59191bd1fab27 --control-commit 16b5040a1282447646212d243f84a11a58e48094
      - name: Verify original bytes and frame all 39 units only after closed cleanup
        if: always()
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HIA_CUSTODY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "${LD_LIBRARY_PATH-}" in
            "") ;;
            "${pythonLocation-}/lib")
              if [[ -z "${pythonLocation-}" ]]; then
                printf '%s\n' 'setup-python location is unavailable' >&2
                exit 1
              fi
              ;;
            *)
              printf '%s\n' 'unapproved loader-library environment' >&2
              exit 1
              ;;
          esac
          unset LD_LIBRARY_PATH
          python -I -S -B control/experiments/hia_core_emitter_20261112/generated-assets-reader-r2/controller.py finalize --root "$RUNNER_TEMP/hia-core-emitter-generated-assets-r2" --policy-sha256 4592d2c0284a55534808b568efa9a65c9db7b52dd6d533a2fae59191bd1fab27 --control-commit 16b5040a1282447646212d243f84a11a58e48094
      - name: Preserve independent raw source custody and bounded HOLD originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-core-emitter-generated-assets-${{ github.run_id }}-1
          path: '${{ runner.temp }}/hia-core-emitter-generated-asset-receipts-r2/'
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
          overwrite: false
