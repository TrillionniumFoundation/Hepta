name: HIA fixed composition proofs and full-cost execution (research)

on:
  push:
    branches: [work/hia-full-execution-20261031, work/hia-unified-core-cost-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/hia-execution-toolchain
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/hepta-private-ci
          ref: 8e52e1187f47f6d4edc8d942fc7cb7eca4bc447d
          path: _hia_ndu_source
          persist-credentials: false
      - name: Build, execute, reject and recover one exact source composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mv _hia_ndu_source "$RUNNER_TEMP/hia-ndu-source"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B tools/qualify_hia_composition.py \
            --output "$RUNNER_TEMP/hia-composition" \
            --ndu-source "$RUNNER_TEMP/hia-ndu-source" \
            --cargo-home "$HOME/.cargo" \
            --clang "$CLANG" --clangxx "$CLANGXX" --cc /usr/bin/gcc \
            --rustc "$(rustup which rustc)" --cargo "$(rustup which cargo)" --lean "$LEAN"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain positive and negative evidence, including failed commands
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-composition-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/hia-composition/**/*.json
            ${{ runner.temp }}/hia-composition/**/*.stdout
            ${{ runner.temp }}/hia-composition/**/*.stderr
            ${{ runner.temp }}/hia-composition/**/*.gz
            ${{ runner.temp }}/hia-composition/**/*.ll
            ${{ runner.temp }}/hia-composition/**/*.smt2
            ${{ runner.temp }}/hia-composition/**/*.asm
