name: Independent Core and assembly front v81 r4
on:
  push:
    branches:
      - codex/hia-core-assembly-front-v81-r4-20261112-dda7
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-interpreters:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.14.4'
            profile: native314
          - python: '3.11'
            profile: default311
    steps:
      - name: Check actual Ubuntu24.04 x86_64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, platform
          release = platform.freedesktop_os_release()
          observed = {'system': platform.system(), 'architecture': platform.machine(),
                      'distribution': release.get('ID'), 'version_id': release.get('VERSION_ID')}
          Path('runner-platform.json').write_text(json.dumps(observed, sort_keys=True, indent=2) + '\n')
          print(json.dumps(observed, sort_keys=True))
          if observed != {'system': 'Linux', 'architecture': 'x86_64', 'distribution': 'ubuntu', 'version_id': '24.04'}:
              raise RuntimeError('actual Ubuntu24.04 x86_64 required')
          PY
      - name: Checkout isolated exact harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact admitted source baseline
        uses: actions/checkout@v4
        with:
          ref: 64f67ae897c3cb49d45a1e1a4622db974812e3fe
          path: source
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install original pinned prerequisites
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Run new source and actual interpreter controls
        run: >-
          python -B harness/inputs/run_split_development.py
          --source source --inputs harness/inputs --workspace front-work
          --profile ${{ matrix.profile }}
      - name: Export completed original text without rerunning tests
        if: always()
        run: python -B harness/inputs/export_completed_text.py --workspace front-work
      - name: Preserve complete raw evidence and exact inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-core-assembly-v81-r4-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            front-work
            !front-work/source/**
            harness/inputs
            runner-platform.json
          if-no-files-found: error
