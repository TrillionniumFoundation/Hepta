        HEPTA_HIA_MACHINE_PLAN_FIXTURE_EVIDENCE: ${{ runner.temp }}/hia-machine-plan
      id: original_36
      if: ${{ !cancelled() && steps.original_4.outcome == 'success' && steps.original_5.outcome == 'success' && steps.source_admission.outcome
        == 'success' }}
    - name: Native machine plan through complete original callers
      run: "python -B tools/qualify_hia_machine_plan_native_callers.py \\\n  --cold-report \"$RUNNER_TEMP/hia-cold.json\"\
        \ \\\n  --output \"$RUNNER_TEMP/hia-machine-plan-callers.json\" \\\n  --evidence-dir \"$RUNNER_TEMP/hia-machine-plan-callers\"\
        \n"
      id: original_37
      if: ${{ !cancelled() && steps.original_4.outcome == 'success' && steps.original_5.outcome == 'success' && steps.source_admission.outcome
        == 'success' }}
    - name: Native service context policy integers and held proof identity
      run: "python -B - <<'PYCONTEXT76'\nimport unittest\nnames = (\n    'tests.test_hia_service_context_native',\n    'tests.test_hia_service_context_builder',\n\
        )\nsuite = unittest.defaultTestLoader.loadTestsFromNames(names)\nif suite.countTestCases() != 52:\n    raise AssertionError('complete\
        \ native component test inventory changed')\nresult = unittest.TextTestRunner(verbosity=2).run(suite)\npassed = (result.wasSuccessful()\
        \ and result.testsRun == 52\n          and not result.skipped and not result.expectedFailures\n          and not result.unexpectedSuccesses)\n\
        raise SystemExit(0 if passed else 1)\nPYCONTEXT76\n"
      env:
        HEPTA_HIA_SERVICE_CONTEXT_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
        HEPTA_HIA_SERVICE_CONTEXT_EVIDENCE: ${{ runner.temp }}/hia-service-context
      id: original_38
      if: ${{ !cancelled() && steps.original_4.outcome == 'success' && steps.original_5.outcome == 'success' && steps.source_admission.outcome
        == 'success' }}
    - name: Native service context through all original Agent callers
      run: "python -B -m tools.qualify_hia_service_context \\\n  --cold-report \"$RUNNER_TEMP/hia-cold.json\" \\\n  --evidence\
        \ \"$RUNNER_TEMP/hia-service-context-callers\"\n"
      id: original_39
      if: ${{ !cancelled() && steps.original_4.outcome == 'success' && steps.original_5.outcome == 'success' && steps.source_admission.outcome
        == 'success' }}
    - name: Record all selected outcomes and final source custody
      id: selected_result
      if: always()
      env:
        HIA_ORIGINAL_STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: "python -B - <<'PYRESULT'\nimport json, os, pathlib, subprocess\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'hia-native-owners-v76'\n\
        out.mkdir(mode=0o700,parents=True,exist_ok=True)\ndef git(*args):\n    return subprocess.check_output(['git',*args],text=True).strip()\n\
        outcomes=json.loads(os.environ['HIA_ORIGINAL_STEP_OUTCOMES'])\nexpected=['original_0', 'original_1', 'original_2',\
        \ 'original_3', 'original_4', 'original_5', 'original_23', 'original_31', 'original_32', 'original_33', 'original_34',\
        \ 'original_35', 'original_36', 'original_37', 'original_38', 'original_39', 'source_admission']\nrecord={'schema':'hia.v76.current-owner-selected-gates.v1',\n\
        \        'scope':'CURRENT_SOURCE_COLD_AND_COMPLETE_SELECTED_OWNER_GROUPS',\n        'source_head':git('rev-parse','HEAD'),'source_tree':git('rev-parse','HEAD^{tree}'),\n\
        \        'status_porcelain':git('status','--porcelain=v1','--untracked-files=all'),\n        'harness_commit':os.environ['GITHUB_SHA'],\n\
        \        'expected_step_ids':expected,'actual_step_outcomes':outcomes,\n        'original_selected_step_bodies_env_tests_and_limits_unchanged':True,\n\
        \        'full_original_core_workflow_executed':False,\n        'full_5400_second_regression_executed':False,\n  \
        \      'whole_native_delivery_qualified':False,\n        'native_defaults_changed':False,'legacy_deleted':False}\n\
        passed=(record['source_head']=='4b19af89a766593f7d5f1cc2db256e81aba7afcb' and record['source_tree']=='1bc7c90996e1910ad66ba771b0bfee1d5bfa655c'\n\
        \        and not record['status_porcelain']\n        and all(outcomes.get(name,{}).get('outcome')=='success' for name\
        \ in expected))\nrecord['status']='ALL_SELECTED_STEPS_PASS' if passed else 'SELECTED_GATES_FAIL_OR_INCOMPLETE'\n(out/'RESULT.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\\\
        n')\nprint(json.dumps(record,sort_keys=True),flush=True)\nraise SystemExit(0 if passed else 1)\nPYRESULT\n"
    - name: Preserve actual cold failure and stage evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hia-current-owners-v76-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
        path: '${{ runner.temp }}/hia-cold.json

          ${{ runner.temp }}/hia-cold.cold/

          ${{ runner.temp }}/hia-language.json

          ${{ runner.temp }}/hia-language.assertions.json

          ${{ runner.temp }}/hia-language.evidence/

          ${{ runner.temp }}/hia-nominal-fixture/

          ${{ runner.temp }}/hia-module-projects/

