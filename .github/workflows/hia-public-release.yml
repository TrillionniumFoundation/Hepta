name: HIA public release consistency

on:
  push:
    branches: [main, 'codex/hia-sixgap-entry-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare an empty public-source destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'jsonschema==4.25.1' 'z3-solver==4.15.4.0'
          mkdir "$RUNNER_TEMP/hia-public-release"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-public-release/entry.txt"
          python -m pip freeze > "$RUNNER_TEMP/hia-public-release/dependencies.txt"
      - name: Fetch exact public source without repository overrides
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/hia_release.py describe > "$RUNNER_TEMP/hia-public-release/describe.json"
          python -B tools/hia_release.py materialize --directory "$RUNNER_TEMP/hia-public-release/release" 2>&1 | tee "$RUNNER_TEMP/hia-public-release/materialize.log"
          python -B tools/hia_release.py check --hepta-root "$RUNNER_TEMP/hia-public-release/release/hepta" --runtime-checkout "$RUNNER_TEMP/hia-public-release/release/runtime" 2>&1 | tee "$RUNNER_TEMP/hia-public-release/check.log"
      - name: Verify discoverable entry and materialized public task inputs
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          entry = Path(os.environ["GITHUB_WORKSPACE"])
          root = Path(os.environ["RUNNER_TEMP"]) / "hia-public-release"
          readme = (entry / "README.md").read_bytes()
          readme_text = readme.decode("utf-8")
          if not readme_text.strip():
              raise SystemExit("public README is empty")
          if ("python3 -B tools/hia_release.py" not in readme_text
                  or "](releases/hia-current.json)" not in readme_text):
              raise SystemExit("public README lacks the entry command or release-lock link")
          lock_raw = (entry / "releases/hia-current.json").read_bytes()
          lock = json.loads(lock_raw)
          source = root / "release/hepta"
          required = (
              "tools/hia_repository_agent_trial.py",
              "tests/test_hia_repository_agent_trial.py",
              "docs/HIA_REPOSITORY_AGENT_TRIAL.md",
              "experiments/hia_repository_select_trial_20261108/public/PROMPT.txt",
              "experiments/hia_repository_select_trial_20261108/public/task.json",
              "tests/test_hia_scalar_proof_contract.py",
              "tools/hia_selfhost_select.py",
              "docs/HIA_AGENT_PROOF_RESULTS.md",
          )
          files = {}
          for name in required:
              expected = lock["files"]["hepta"].get(name)
              path = source / name
              if not expected or not path.is_file():
                  raise SystemExit("public task input is not locked/materialized: " + name)
              raw = path.read_bytes()
              measured = hashlib.sha256(raw).hexdigest()
              if measured != expected:
                  raise SystemExit("public task input differs from lock: " + name)
              files[name] = {"sha256": measured, "bytes": len(raw)}
          record = {
              "schema": "hepta.hia.public-source-inputs.v1",
              "entry_commit": os.environ["GITHUB_SHA"],
              "release_lock_sha256": hashlib.sha256(lock_raw).hexdigest(),
              "hepta_source": lock["sources"]["hepta"],
              "entry_readme": {"sha256": hashlib.sha256(readme).hexdigest(), "bytes": len(readme)},
              "files": files,
              "ok": True,
          }
          (root / "public-inputs.json").write_text(json.dumps(record, indent=2) + "\n")
          print("Public discovery entry and exact task/proof inputs are present")
          PY
      - name: Run native examples and prove installation identity matches the lock
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B "$RUNNER_TEMP/hia-public-release/release/hepta/tools/qualify_hia_direct_native.py" --output "$RUNNER_TEMP/hia-public-release/direct-native.json" 2>&1 | tee "$RUNNER_TEMP/hia-public-release/direct-native.log"
          cd "$RUNNER_TEMP/hia-public-release/release/hepta"
          python -B -E -s -m hepta.hia_agent_worker --installation-manifest > "$RUNNER_TEMP/hia-public-release/installation.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "hia-public-release"
          lock = json.loads((Path(os.environ["GITHUB_WORKSPACE"]) / "releases/hia-current.json").read_text())
          installation = json.loads((root / "installation.json").read_text())
          if installation != lock["installation"]:
              raise SystemExit("materialized installation does not match the public release lock")
          print("Exact public source, runtime contract and installation identity match")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-public-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hia-public-release/*.log
            ${{ runner.temp }}/hia-public-release/*.json
            ${{ runner.temp }}/hia-public-release/*.txt
          if-no-files-found: error
          retention-days: 30
