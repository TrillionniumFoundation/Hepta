              'tests.test_hia_core_patch_cli.CorePatchCliSourceTests',
              'tests.test_hia_core_patch_result_cli.CorePatchResultCliSourceTests',
              'tests.test_hia_core_patch_result_cli.CorePatchResultCliAdapterTests',
              'tests.test_hia_composite_types_native.CompositeTypesSourceTests',
              'tests.test_hia_composite_types_native.CompositeTypesAdapterTests',
              'tests.test_hia_composite_origins_native.CompositeOriginsAdapterTests',
              'tests.test_hia_composite_signatures_native.CompositeSignaturesAdapterTests',
              'tests.test_hia_task_helpers_native.TaskHelpersSourceTests',
              'tests.test_hia_task_helpers_native.TaskHelpersAdapterTests',
              'tests.test_hia_composite_native_composition.SourceTests',
              'tests.test_hia_composite_functions_native.FunctionSourceTests',
              'tests.test_hia_composite_function_tokens.TokenCodecTests',
              'tests.test_hia_composite_function_protocol_audit.FunctionTokenProtocolAuditTests',
              'tests.test_hia_composite_constructor_source.ConstructorSourceTests',
              'tests.test_hia_composite_constructor_native.ConstructorFrameTests',
              'tests.test_hia_composite_outer_source.OuterSourceTests',
              'tests.test_hia_composite_outer_native.OuterFrameTests',
              'tests.test_hia_native_builder_source_binding',
              'tests.test_hia_standalone_builder_source_binding',
              'tests.test_hia_compile_stage_custody',
              'tests.test_hia_unittest_gate',
              'tests.test_hia_verified_increment_gate',
              'tests.test_hia_increment_source_admission',
              'tests.test_hia_recursive_chain',
              'tests.test_hia_sha256_builder_source_binding',
              'tests.test_hia_source_build_entrypoint',
              'tests.test_hia_agent_binary64_format_native.AgentBinary64FormatSourceTests',
              'tests.test_hia_agent_artifact_store_native.AgentArtifactStorePolicyTests',
              'tests.test_hia_worker_request_native.WorkerRequestSourceTests',
              'tests.test_hia_worker_native_helpers.WorkerHelperSourceTests',
              'tests.test_hia_core_lowering_native.CoreLoweringSourceTests',
              'tests.test_hia_core_emitter_native.CoreEmitterSourceTests',
              'tests.test_hia_byte_wrapper_native.ByteWrapperSourceTests',
              'tests.test_hia_machine_object_native.MachineObjectSourceTests',
              'tests.test_hia_execution_observation_native.ExecutionObservationSourceTests',
              'tests.test_hia_continuation_native.ContinuationSourceTests',
              'tests.test_hia_worker_scheduling_bundle.WorkerSchedulingSourceTests',
              'tests.test_hia_installed_fixture_resources',
              'tests.test_hia_machine_plan_native.MachinePlanSourceTests',
              'tests.test_hia_machine_encoding_native.MachineEncodingSourceTests',
              'tests.test_hia_machine_state_native.MachineStateSourceTests',
              'tests.test_hia_machine_instructions_native.MachineInstructionsSourceTests',
              'tests.test_hia_worker_report_native.WorkerReportSourceTests',
              'tests.test_hia_worker_report_custody.WorkerReportCustodySourceTests',
              'tests.test_hia_release_install.ReleaseInstallerSourceTests',
              'tests.test_hia_release_selection.ReleaseSelectionSourceTests',
              'tests.test_hia_release_selection_review.ReleaseSelectionReviewPolicyTests',
              'tests.test_hia_retirement_state_native.RetirementStateSourceTests',
              'tests.test_hia_source_build.SourceBuilderSourceTests',
              'tests.test_hia_nominal_json_native.NominalJSONSourceTests',
              'tests.test_hia_agent_journal_native.JournalSourceTests',
              'tests.test_hia_execution_budget_native.ExecutionBudgetSourceTests',
              'tests.test_hia_candidate_budget_native.CandidateBudgetSourceTests',
              'tests.test_hia_slot_ledger_native.SlotLedgerSourceTests',
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          expected = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          complete = result.testsRun == expected and expected > 0
          clean = not (result.errors or result.failures or result.skipped or
                       result.expectedFailures or result.unexpectedSuccesses)
          raise SystemExit(0 if complete and clean and result.wasSuccessful() else 1)
          PY
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install qualified Clang 20 native execution prerequisites
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hia-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hia-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hia-llvm.asc" /usr/share/keyrings/hia-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hia-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hia-llvm20.list
          sudo apt-get update
          sudo apt-get install -y binutils gcc clang-20 libclang-rt-20-dev strace
          printf 'CLANG=/usr/bin/clang-20\nHEPTA_CLANG=/usr/bin/clang-20\n' >> "$GITHUB_ENV"
      - run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Prepare original locked Rust caller dependencies
        run: |
          set -euo pipefail
          cargo --version
          rustc --version
          sha256sum rust/hia-core-shadow/Cargo.toml rust/hia-core-shadow/Cargo.lock > "$RUNNER_TEMP/hia-rust-caller-inputs.sha256"
          cargo fetch --locked --manifest-path rust/hia-core-shadow/Cargo.toml
          sha256sum --check "$RUNNER_TEMP/hia-rust-caller-inputs.sha256"
          git diff --exit-code -- rust/hia-core-shadow/Cargo.toml rust/hia-core-shadow/Cargo.lock
      - run: python -B tools/replay_hia_selfhost_cold.py --output "$RUNNER_TEMP/hia-cold.json"
      - name: Native linked observer and independent loader lifecycle controls
        env:
          HEPTA_HIA_LINKED_OBSERVER_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_LINKED_OBSERVER_EVIDENCE: ${{ runner.temp }}/hia-linked-observer
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_selfhost_linked_observer
      - name: Native loaded mapping policy and original kernel evidence controls
        env:
          HEPTA_HIA_NATIVE_MAPPING_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_NATIVE_MAPPING_EVIDENCE: ${{ runner.temp }}/hia-native-mapping
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_native_mapping_native
      - name: Original runtime and lease callers with selected HIA mapping policy
        env:
          HEPTA_HIA_NATIVE_MAPPING_MANIFEST: ${{ runner.temp }}/hia-native-mapping/candidate/build/manifest.json
          HEPTA_TEST_CLANG: /usr/bin/clang-20
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_native_mapping_identity tests.test_hia_multiversion_mapping tests.test_hia_host_region 2>&1 | tee "$RUNNER_TEMP/hia-native-mapping-original-callers.log"
      - name: Native publication measurement policy and installed scope controls
        env:
          HEPTA_HIA_PUBLICATION_MEASUREMENT_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_PUBLICATION_MEASUREMENT_EVIDENCE: ${{ runner.temp }}/hia-publication-measurement
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_publication_measurement_native 2>&1 | tee "$RUNNER_TEMP/hia-publication-measurement.log"
      - name: Complete original publication callers with selected HIA measurement policy
        run: >-
          python -B tools/qualify_hia_publication_measurement_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-publication-measurement-callers"
      - name: Native scalar admission profile and installed scope controls
        env:
          HEPTA_HIA_SCALAR_PROFILE_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_SCALAR_PROFILE_EVIDENCE: ${{ runner.temp }}/hia-scalar-profile
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_scalar_profile_native 2>&1 | tee "$RUNNER_TEMP/hia-scalar-profile.log"
      - name: Complete original scalar runtime callers with selected HIA admission profile
        run: >-
          python -B tools/qualify_hia_scalar_profile_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-scalar-profile-callers"
      - name: Retained HIA generation references and installed scope controls
        env:
          HEPTA_HIA_GENERATION_RETENTION_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_GENERATION_RETENTION_EVIDENCE: ${{ runner.temp }}/hia-generation-retention
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_generation_retention_native 2>&1 | tee "$RUNNER_TEMP/hia-generation-retention.log"
      - name: Complete original generation callers with combined native policies
        env:
          HEPTA_HIA_SCALAR_PROFILE_MANIFEST: ${{ runner.temp }}/hia-scalar-profile/candidate/build/manifest.json
          HEPTA_HIA_PUBLICATION_MEASUREMENT_MANIFEST: ${{ runner.temp }}/hia-publication-measurement/PublicationMeasurementNativeTests/candidate/manifest.json
          HEPTA_HIA_NATIVE_MAPPING_MANIFEST: ${{ runner.temp }}/hia-native-mapping/candidate/build/manifest.json
        run: >-
          python -B tools/qualify_hia_generation_retention_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --require-companion-policies
          --evidence "$RUNNER_TEMP/hia-generation-retention-callers"
      - name: Native VM byte memory and installed helper custody controls
        env:
          HEPTA_HIA_BOUNDED_MEMORY_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_bounded_memory_native 2>&1 | tee "$RUNNER_TEMP/hia-bounded-memory.log"
      - name: Complete original VM memory callers with selected HIA owner
        run: >-
          python -B tools/qualify_hia_bounded_memory_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-bounded-memory-callers"
      - name: Native static resource arithmetic and installed controls
        env:
          HEPTA_HIA_STATIC_BUDGET_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_STATIC_BUDGET_EVIDENCE: ${{ runner.temp }}/hia-static-budget
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_static_budget_native
      - name: Complete original static resource callers with all retained owners forbidden
        run: >-
          python -B tools/qualify_hia_static_budget_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-static-budget-callers"
      - name: Native current Store lifecycle and installed worker controls
        env:
          HEPTA_HIA_STORE_LIFECYCLE_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_STORE_LIFECYCLE_EVIDENCE: ${{ runner.temp }}/hia-store-lifecycle
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_store_lifecycle_native
      - name: Complete original Store callers with retained lifecycle bodies forbidden
        run: >-
          python -B tools/qualify_hia_store_lifecycle_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-store-lifecycle-callers"
      - name: Native service context control and actual installed worker
        env:
          HEPTA_HIA_SERVICE_CONTEXT_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_SERVICE_CONTEXT_EVIDENCE: ${{ runner.temp }}/hia-service-context
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_service_context_native
      - name: Complete original context callers with all four policy bodies forbidden
        run: >-
          python -B tools/qualify_hia_service_context_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-service-context-callers"
      - name: Native cost-ledger policy and actual installed worker controls
        env:
          HEPTA_HIA_COST_LEDGER_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_COST_LEDGER_EVIDENCE: ${{ runner.temp }}/hia-cost-ledger
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_cost_ledger_native
      - name: Complete original cost-ledger callers with retained policy forbidden
        run: >-
          python -B tools/qualify_hia_cost_ledger_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-cost-ledger-callers"
      - name: Native transport failures preserve durable unknown outcomes
        env:
          HEPTA_HIA_NATIVE_TRANSPORT_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_NATIVE_TRANSPORT_EVIDENCE: ${{ runner.temp }}/hia-native-transport
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_native_transport_failures
      - name: Native complete evaluation control and actual installed worker custody
        env:
          HEPTA_HIA_EVALUATION_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_EVALUATION_EVIDENCE: ${{ runner.temp }}/hia-evaluation
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_evaluation_native
      - name: Complete original evaluation callers with retained policy forbidden
        run: >-
          python -B tools/qualify_hia_evaluation_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-evaluation-callers"
      - name: Native full-cost arithmetic and actual installed cost and patch impact owners
        env:
          HEPTA_HIA_FULL_COST_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_FULL_COST_EVIDENCE: ${{ runner.temp }}/hia-full-cost
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_full_cost_native
      - name: Complete original full-cost and observation callers with HIA arithmetic
        run: >-
          python -B tools/qualify_hia_full_cost_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-full-cost-callers"
      - name: Installed default HIA full-cost package and ordinary worker custody
        env:
          HEPTA_HIA_DEFAULT_RELEASE_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_DEFAULT_RELEASE_EVIDENCE: ${{ runner.temp }}/hia-default-release
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_default_native_release
      - name: Native patch impact and complete original public graph controls
        env:
          HEPTA_HIA_PATCH_IMPACT_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_PATCH_IMPACT_EVIDENCE: ${{ runner.temp }}/hia-patch-impact
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_patch_impact_native
      - name: Complete original patch impact callers with HIA comparison and graph owners
        run: >-
          python -B tools/qualify_hia_patch_impact_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-patch-impact-callers"
      - name: Original complete CLI discovery JSON native VM runtime and installed controls
        run: >-
          python -B tools/qualify_hia_cli_discovery_json.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-cli-discovery-json"
      - name: Complete JSON outputs through both ordinary CLI control routes
        run: >-
          python -B tools/qualify_hia_cli_discovery_callers.py
          --cold-report "$RUNNER_TEMP/hia-cold.json"
          --evidence "$RUNNER_TEMP/hia-cli-discovery-callers"
      - name: Native SHA stream transitions against pinned original full-buffer observations
        env:
          HEPTA_HIA_SHA256_STREAM_DIFFERENTIAL_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_SHA256_STREAM_DIFFERENTIAL_EVIDENCE: ${{ runner.temp }}/hia-sha256-stream-differential
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_sha256_stream_transition_equivalence 2>&1 | tee "$RUNNER_TEMP/hia-sha256-stream-differential.log"
