name: HIA Core fixture Source6 and derive8 only
on:
  push:
    branches:
      - codex/hia-core-zero-store-fixture-source6-derive8-r1-20261113-e26e
permissions:
  contents: read
jobs:
  source6-derive8:
    if: github.repository == 'TrillionniumFoundation/Hepta' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Freeze exact complete source and original controls
        id: freeze
        run: >-
          python -I -S -B experiments/hia_core_lowering_20261113/zero-store-fixture-source6-derive8-remote-r1/control/freeze_remote.py
          --policy experiments/hia_core_lowering_20261113/zero-store-fixture-source6-derive8-remote-r1/POLICY.json
          --sha256 cc7df1f5b24bc9ae0650f4abe9852a53a9967f813e6347fed0f9ec24c20a1326
      - name: Original Source6 and derive8 under original 180 plus 3 owner
        env:
          FIXTURE_RUNTIME: ${{ steps.freeze.outputs.runtime }}
          FIXTURE_LAUNCHER: ${{ steps.freeze.outputs.launcher }}
          FIXTURE_REQUEST: ${{ steps.freeze.outputs.request }}
          FIXTURE_REQUEST_SHA: ${{ steps.freeze.outputs.request_sha256 }}
        run: |
          set -eu
          "$FIXTURE_RUNTIME" -I -S -B "$FIXTURE_LAUNCHER" --request "$FIXTURE_REQUEST" --sha256 "$FIXTURE_REQUEST_SHA"
      - name: Expose original closed evidence or parent-only HOLD
        id: collect
        if: always()
        run: |
          set -eu
          python -I -S -B experiments/hia_core_lowering_20261113/zero-store-fixture-source6-derive8-remote-r1/control/collect_evidence.py --work "$RUNNER_TEMP/hia-core-fixture-source6-derive8-$GITHUB_RUN_ID-1"
      - name: Preserve complete original Source6 and derive8 evidence
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hia-core-fixture-source6-derive8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect.outputs.upload_root }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
