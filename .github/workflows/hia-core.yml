              'tests.test_hia_core_module_graph_native.CoreModuleGraphSourceTests',
              'tests.test_hia_source_head_identity',
              'tests.test_hia_integrated_workflow',
              'tests.test_hia_core_workspace_json_native.CoreWorkspaceJsonSourceTests',
              'tests.test_hia_core_workspace_json_cli.CoreWorkspaceJsonCliSourceTests',
              'tests.test_hia_core_workspace_pipeline.CoreWorkspacePipelineSourceTests',
              'tests.test_hia_agent_identity_native.AgentIdentitySourceTests',
              'tests.test_hia_scalar_reference_native.ScalarReferenceSourceTests',
              'tests.test_hia_cnf_native.CnfSourceTests',
              'tests.test_hia_direct_call.DirectCallSourceTests',
              'tests.test_hia_agent_slice_native.AgentSliceSourceTests',
              'tests.test_hia_agent_read_page_native.AgentReadPageSourceTests',
              'tests.test_hia_agent_schema_native.AgentSchemaSourceTests',
              'tests.test_hia_agent_installed_resources.AgentInstalledResourceSourceTests',
              'tests.test_hia_sqlite_snapshot_native',
              'tests.test_hia_agent_stdio.AgentStdioSourceTests',
              'tests.test_hia_mcp_request_native.McpRequestSourceTests',
              'tests.test_hia_mcp_reply_native.McpReplySourceTests',
              'tests.test_hia_mcp_negotiation_native.McpNegotiationSourceTests',
              'tests.test_hia_mcp_catalog_native.McpCatalogSourceTests',
              'tests.test_hia_mcp_uri_native.McpUriSourceTests',
              'tests.test_hia_agent_snapshot_native.AgentSnapshotSourceTests',
              'tests.test_hia_agent_snapshot_json_native.AgentSnapshotJsonSourceTests',
              'tests.test_hia_agent_entry',
              'tests.test_hia_elf_linker.ElfLinkerSourceTests',
              'tests.test_hia_core_json_cli.CoreJsonCliSourceTests',
              'tests.test_hia_program_selfhost.SelfhostBuildSourceTests',
              'tests.test_hia_selfhost_word_io.WordIOSourceTests',
              'tests.test_hia_selfhost_emitter_words.EmitterSourceTests',
              'tests.test_hia_sha256_stream_native.Sha256StreamSourceTests',
              'tests.test_hia_sha256_native.Sha256HiaSourceTests',
              'tests.test_hia_json_preflight',
              'tests.test_hia_json_preflight_native.JsonPreflightHiaSourceTests',
              'tests.test_hia_json_decode_native.JsonDecodeHiaSourceTests',
              'tests.test_hia_json_canonical_native.JsonCanonicalHiaSourceTests',
              'tests.test_hia_selfhost_exports.ExportSourceTests',
              'tests.test_hia_core_json_frontend_native.CoreJsonFrontendHiaSourceTests',
              'tests.test_hia_selfhost.SelfhostSourceTests',
              'tests.test_hia_selfhost_call_graph_efficiency.CallGraphSourceTests',
              'tests.test_hia_selfhost_contract.SelfhostContractTests',
              'tests.test_hia_selfhost_cli',
              'tests.test_hia_selfhost_names',
              'tests.test_hia_reference_fixture_efficiency',
              'tests.test_hia_selfhost_returned_loans',
              'tests.test_hia_selfhost_multi_results.SelfhostMultiResultSourceTests',
              'tests.test_hia_selfhost_keywords.SelfhostKeywordTests',
              'tests.test_hia_selfhost_signed.SelfhostSignedTests',
              'tests.test_hia_selfhost_traps.SelfhostExplicitTrapTests',
              'tests.test_hia_selfhost_language_coverage.SelfhostLanguageSourceTests',
              'tests.test_hia_agent_data_json_native.AgentDataJsonSourceTests',
              'tests.test_hia_agent_binary64_native.AgentBinary64SourceTests',
              'tests.test_hia_instruction_policy_native.InstructionPolicySourceTests',
              'tests.test_hia_program_shape_native.ProgramShapeSourceTests',
              'tests.test_hia_function_shape_native.FunctionShapeSourceTests',
              'tests.test_hia_artifact_publication_native.ArtifactPublicationPolicyTests',
              'tests.test_hia_artifact_publication_route.PublicationRouteSourceTests',
              'tests.test_hia_core_admission_native.CoreAdmissionSourceTests',
              'tests.test_hia_core_admission_cli.CoreAdmissionCliSourceTests',
              'tests.test_hia_core_patch_native.CorePatchSourceTests',
              'tests.test_hia_core_patch_cli.CorePatchCliSourceTests',
              'tests.test_hia_core_patch_result_cli.CorePatchResultCliSourceTests',
              'tests.test_hia_core_patch_result_cli.CorePatchResultCliAdapterTests',
              'tests.test_hia_composite_types_native.CompositeTypesSourceTests',
              'tests.test_hia_composite_types_native.CompositeTypesAdapterTests',
              'tests.test_hia_composite_origins_native.CompositeOriginsAdapterTests',
              'tests.test_hia_composite_signatures_native.CompositeSignaturesAdapterTests',
              'tests.test_hia_task_helpers_native.TaskHelpersSourceTests',
              'tests.test_hia_task_helpers_native.TaskHelpersAdapterTests',
              'tests.test_hia_composite_native_composition.SourceTests',
              'tests.test_hia_composite_functions_native.FunctionSourceTests',
              'tests.test_hia_composite_function_tokens.TokenCodecTests',
              'tests.test_hia_composite_function_protocol_audit.FunctionTokenProtocolAuditTests',
              'tests.test_hia_composite_constructor_source.ConstructorSourceTests',
              'tests.test_hia_composite_constructor_native.ConstructorFrameTests',
              'tests.test_hia_composite_outer_source.OuterSourceTests',
              'tests.test_hia_composite_outer_native.OuterFrameTests',
              'tests.test_hia_native_builder_source_binding',
              'tests.test_hia_standalone_builder_source_binding',
              'tests.test_hia_compile_stage_custody',
              'tests.test_hia_unittest_gate',
              'tests.test_hia_sha256_builder_source_binding',
              'tests.test_hia_source_build_entrypoint',
              'tests.test_hia_agent_binary64_format_native.AgentBinary64FormatSourceTests',
              'tests.test_hia_agent_artifact_store_native.AgentArtifactStorePolicyTests',
              'tests.test_hia_worker_request_native.WorkerRequestSourceTests',
              'tests.test_hia_worker_native_helpers.WorkerHelperSourceTests',
              'tests.test_hia_core_lowering_native.CoreLoweringSourceTests',
              'tests.test_hia_core_emitter_native.CoreEmitterSourceTests',
              'tests.test_hia_byte_wrapper_native.ByteWrapperSourceTests',
              'tests.test_hia_machine_object_native.MachineObjectSourceTests',
              'tests.test_hia_execution_observation_native.ExecutionObservationSourceTests',
              'tests.test_hia_continuation_native.ContinuationSourceTests',
              'tests.test_hia_worker_scheduling_bundle.WorkerSchedulingSourceTests',
              'tests.test_hia_installed_fixture_resources',
              'tests.test_hia_machine_plan_native.MachinePlanSourceTests',
              'tests.test_hia_machine_encoding_native.MachineEncodingSourceTests',
              'tests.test_hia_machine_state_native.MachineStateSourceTests',
              'tests.test_hia_machine_instructions_native.MachineInstructionsSourceTests',
              'tests.test_hia_worker_report_native.WorkerReportSourceTests',
              'tests.test_hia_worker_report_custody.WorkerReportCustodySourceTests',
              'tests.test_hia_release_install.ReleaseInstallerSourceTests',
              'tests.test_hia_release_selection.ReleaseSelectionSourceTests',
              'tests.test_hia_release_selection_review.ReleaseSelectionReviewPolicyTests',
              'tests.test_hia_retirement_state_native.RetirementStateSourceTests',
              'tests.test_hia_source_build.SourceBuilderSourceTests',
              'tests.test_hia_nominal_json_native.NominalJSONSourceTests',
              'tests.test_hia_agent_journal_native.JournalSourceTests',
              'tests.test_hia_execution_budget_native.ExecutionBudgetSourceTests',
              'tests.test_hia_candidate_budget_native.CandidateBudgetSourceTests',
              'tests.test_hia_slot_ledger_native.SlotLedgerSourceTests',
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          expected = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          complete = result.testsRun == expected and expected > 0
          clean = not (result.errors or result.failures or result.skipped or
                       result.expectedFailures or result.unexpectedSuccesses)
          raise SystemExit(0 if complete and clean and result.wasSuccessful() else 1)
          PY
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install qualified Clang 20 native execution prerequisites
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hia-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hia-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hia-llvm.asc" /usr/share/keyrings/hia-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hia-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hia-llvm20.list
          sudo apt-get update
          sudo apt-get install -y binutils gcc clang-20 libclang-rt-20-dev strace
          printf 'CLANG=/usr/bin/clang-20\nHEPTA_CLANG=/usr/bin/clang-20\n' >> "$GITHUB_ENV"
      - run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Prepare original locked Rust caller dependencies
        run: |
          set -euo pipefail
          cargo --version
          rustc --version
          sha256sum rust/hia-core-shadow/Cargo.toml rust/hia-core-shadow/Cargo.lock > "$RUNNER_TEMP/hia-rust-caller-inputs.sha256"
          cargo fetch --locked --manifest-path rust/hia-core-shadow/Cargo.toml
          sha256sum --check "$RUNNER_TEMP/hia-rust-caller-inputs.sha256"
          git diff --exit-code -- rust/hia-core-shadow/Cargo.toml rust/hia-core-shadow/Cargo.lock
      - run: python -B tools/replay_hia_selfhost_cold.py --output "$RUNNER_TEMP/hia-cold.json"
      - name: Validate native execution ledger
        run: |
          set -euo pipefail
          compiler=$(find "$RUNNER_TEMP/hia-cold.cold" -name B3.image.bin -print -quit)
          test -n "$compiler"
          python -B -m tools.build_hia_json_preflight --candidate execution-ledger \
            --compiler "$compiler" --cold-report "$RUNNER_TEMP/hia-cold.json" \
            --output "$RUNNER_TEMP/execution-ledger"
          python -B -m tests.test_hia_execution_ledger_native "$RUNNER_TEMP/execution-ledger/manifest.json"
      - name: Build source-bound native SQLite components
        run: |
          set -euo pipefail
          compiler=$(find "$RUNNER_TEMP/hia-cold.cold" -name B3.image.bin -print -quit)
          test -n "$compiler"
          for candidate in sqlite-wal-snapshot sqlite-rowid-lookup sqlite-record-layout sqlite-agent-row-import sqlite-agent-import-batch sqlite-agent-cost-sequence sqlite-agent-artifact-catalog sqlite-agent-catalog; do
            python -B -m tools.build_hia_json_preflight --candidate "$candidate" \
              --compiler "$compiler" --cold-report "$RUNNER_TEMP/hia-cold.json" \
              --output "$RUNNER_TEMP/$candidate"
          done
          python -B -m tools.build_hia_sqlite_pager --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/sqlite-pager"
          python -B -m tools.build_hia_sqlite_components --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/sqlite-components"
          python -B -m tests.test_hia_sqlite_pager_runtime \
            --executable "$RUNNER_TEMP/sqlite-pager/hia-sqlite-pager" \
            --component-root "$RUNNER_TEMP/sqlite-components" --test-root "$RUNNER_TEMP"
          python -B -m tools.build_hia_agent_batch_commit --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/agent-batch-commit"
          python -B -m tools.build_hia_agent_batch_commit --kind sealed --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/agent-sealed-commit"
          python -B -m tools.build_hia_agent_batch_commit --kind initialize --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/agent-store-init"
          python -B -m tools.build_hia_agent_store --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/agent-store"
          python -B -m tools.build_hia_agent_artifact_capture --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/agent-artifact-capture"
          python -B -m tools.build_hia_artifact_publication --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/agent-store-artifact"
          python -B -m tools.build_hia_sqlite_migration_publish --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --artifact "$RUNNER_TEMP/agent-store-artifact" \
            --writer "$RUNNER_TEMP/agent-batch-commit" --output "$RUNNER_TEMP/sqlite-publisher"
          python -B -m tools.build_hia_sqlite_migrate --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --pager "$RUNNER_TEMP/sqlite-pager" \
            --staging "$RUNNER_TEMP/sqlite-components" --initializer "$RUNNER_TEMP/agent-store-init" \
            --publisher "$RUNNER_TEMP/sqlite-publisher" --output "$RUNNER_TEMP/sqlite-migrate"
          python -B -m tests.test_hia_agent_store_runtime \
            --executable "$RUNNER_TEMP/agent-store/hia-agent-store" \
            --module-root "$RUNNER_TEMP/agent-store/module-root" \
            --initializer "$RUNNER_TEMP/agent-store-init/hia-agent-store-init" \
            --batch "$RUNNER_TEMP/agent-batch-commit/hia-agent-batch-commit" \
            --cost-sequence "$RUNNER_TEMP/sqlite-components/hia-sqlite-agent-cost-sequence" \
            --test-root "$RUNNER_TEMP"
      - name: Package, select and run the native Core, Agent Store and migration components
        run: |
          set -euo pipefail
          compiler=$(find "$RUNNER_TEMP/hia-cold.cold" -name B3.image.bin -print -quit)
          test -n "$compiler"
          package="$RUNNER_TEMP/agent-store-package"
          mkdir -m 0700 "$package" "$package/stage" "$package/installed"
          python -B -m tools.build_hia_release_install --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$package/installer"
          python -B -m tools.build_hia_release_install --kind directory --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$package/packager"
          python -B -m tools.build_hia_release_selection --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$package/selector"
          python -B -m tools.build_hia_core_admission_cli --suite --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/core-suite"
          python -B -m tools.build_hia_agent_stdio --output-profile portable --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/agent-stdio"
          python -B -m tools.build_hia_source_build --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/source-build"
          python -B -m tools.build_hia_elf_linker --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/elf-linker"
          python -B -m tools.build_hia_elf_linker --kind verified-shared --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/elf-verified-linker-cli"
          python -B -m tools.build_hia_core_workspace_pipeline --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/workspace-pipeline"
          python -B -m tools.build_hia_core_patch_result_cli --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/patch-result"
          python -B -m tools.build_hia_worker_request_cli --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/worker-request"
          python -B -m tools.build_hia_core_edit --release-only --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/core-edit"
          python -B -m tools.build_hia_core_json_cli --output-profile elf --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/public-selfhost"
          python -B -m tools.build_hia_nominal_json --standalone --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/nominal-packet"
          python -B -m tools.build_hia_nominal_constructor --compiler "$compiler" \
            --cold-report "$RUNNER_TEMP/hia-cold.json" --output "$RUNNER_TEMP/nominal-constructor"
          agent_helpers=(agent-schema agent-response-schema agent-verify-response-schema agent-discovery agent-inspection agent-identity elf-shared-linker scalar-reference)
          for profile in "${agent_helpers[@]}"; do
            python -B -m tools.build_hia_json_preflight --candidate "$profile" \
              --compiler "$compiler" --cold-report "$RUNNER_TEMP/hia-cold.json" \
              --output "$RUNNER_TEMP/$profile"
            install -m 0400 "$RUNNER_TEMP/$profile/$profile.image.bin" "$package/stage"
            install -m 0400 "$RUNNER_TEMP/$profile/manifest.json" "$package/stage/$profile-manifest.json"
          done
          source_roles=(selfhost.hepta source_build_policy.hepta source_build_packer.hepta)
          install -m 0500 "$package/installer/hia-release" \
            "$package/packager/hia-directory-package-build" \
            "$package/selector/hia-select" \
            "$RUNNER_TEMP/core-suite/hia-core" \
            "$RUNNER_TEMP/agent-stdio/hia-native" \
            "$RUNNER_TEMP/source-build/hia-source-build" \
            "$RUNNER_TEMP/elf-linker/hia-elf-link" \
            "$RUNNER_TEMP/elf-verified-linker-cli/hia-elf-link-shared" \
            "$RUNNER_TEMP/workspace-pipeline/hia-workspace-compile" \
            "$RUNNER_TEMP/patch-result/hia-patch-result" \
            "$RUNNER_TEMP/worker-request/hia-worker-admit" \
            "$RUNNER_TEMP/worker-request/hia-worker-terminal" \
            "$RUNNER_TEMP/core-edit"/hia* \
            "$RUNNER_TEMP/agent-store/hia-agent-store" \
            "$RUNNER_TEMP/agent-store-init/hia-agent-store-init" \
            "$RUNNER_TEMP/agent-batch-commit/hia-agent-batch-commit" \
            "$RUNNER_TEMP/agent-sealed-commit/hia-agent-sealed-commit" \
            "$RUNNER_TEMP/agent-store-artifact/hia-artifact" \
            "$RUNNER_TEMP/agent-artifact-capture/hia-agent-artifact-capture" \
            "$RUNNER_TEMP/sqlite-pager/hia-sqlite-pager" \
            "$RUNNER_TEMP/sqlite-publisher/hia-sqlite-migration-publish" \
            "$RUNNER_TEMP/sqlite-migrate/hia-sqlite-migrate" \
            "$RUNNER_TEMP/nominal-packet/hia-nominal-packet" \
            "$RUNNER_TEMP/nominal-constructor/hia-nominal-constructor" \
            "$RUNNER_TEMP"/sqlite-components/hia-sqlite-* "$package/stage"
          install -m 0400 "$RUNNER_TEMP"/agent-store/module-root/module-*.bin "$package/stage"
          for role in "${source_roles[@]}"; do
            install -m 0400 "examples/hia_bootstrap/$role" "$package/stage"
          done
          install -m 0400 "$RUNNER_TEMP/public-selfhost/hia-core-json" \
            "$RUNNER_TEMP/public-selfhost/compiler-manifest.json" \
            examples/hia_bootstrap/core_json_frontend.hepta \
            examples/hia_bootstrap/core_json_cli_packer.hepta \
            docs/HIA_SELFHOST_CORE_SUPPORT.json "$package/stage"
          for profile in mcp-request mcp-reply mcp-negotiation mcp-catalog mcp-uri; do
            python -B -m tools.build_hia_json_preflight --candidate "$profile" \
              --compiler "$compiler" --cold-report "$RUNNER_TEMP/hia-cold.json" \
              --output "$RUNNER_TEMP/$profile-image"
            python -B -m tools.build_hia_agent_read_page --kind "$profile" \
              --compiler "$compiler" --cold-report "$RUNNER_TEMP/hia-cold.json" \
              --manifest "$RUNNER_TEMP/$profile-image/manifest.json" --output "$RUNNER_TEMP/$profile-stdio"
            install -m 0500 "$RUNNER_TEMP/$profile-stdio/hia-agent-$profile" "$package/stage"
          done
          install -m 0400 docs/HIA_AGENT_NATIVE_TOOL_CATALOG.json "$package/stage"
          env -i PATH= "$package/packager/hia-directory-package-build" "$package/stage" \
            > "$package/store.hiapack" 2> "$package/store.sha256"
          read -r digest < "$package/store.sha256"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          env -i PATH= "$package/installer/hia-release" install "$package/installed" "$digest" \
            < "$package/store.hiapack" > "$package/install.json"
          installed="$package/installed/$digest"
          test "$(stat -c '%a' "$installed")" = 500
          test ! -e "$installed/hia-emit-object"
