name: HIA Core-only
on: [push, pull_request, workflow_dispatch]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Regenerate actual HIA sources
        run: |
          set -eu
          for component in core_workspace_pipeline core_workspace_facts core_workspace_facts_cli core_workspace_materialize core_workspace_cli capability_renaming core_module_graph core_workspace_json core_workspace_json_cli agent_identity agent_slice scalar_symbolic agent_read_page mcp_stdio_packer agent_schema agent_discovery agent_inspection agent_artifact_capture elf_linker native_filter core_json_cli agent_stdio agent_snapshot agent_snapshot_json agent_snapshot_json_cli sha256_stream native_observer sha256 json_preflight json_decode json_canonical core_json_frontend selfhost agent_binary64 agent_data_json instruction_policy program_shape function_shape artifact_publication core_admission_cli core_suite core_inspect_json core_admission agent_binary64_format core_patch core_patch_cli core_patch_result_cli core_edit_packer core_edit_templates composite_types task_helpers composite_functions composite_constructor composite_outer worker_request release_install release_selection retirement_state agent_journal agent_journal_transport journal_stdio_packer execution_budget candidate_budget source_build nominal_json nominal_transport_adapters slot_ledger cli_control cli_format json_wire worker_report machine_encoding machine_state machine_instructions machine_plan core_lowering core_emitter byte_wrapper machine_object execution_observation execution_ledger continuation sqlite_agent_catalog sqlite_table_walk sqlite_pager_adapters sqlite_component_adapters sqlite_migration_adapters sqlite_migration_plan sqlite_migration_projection sqlite_pager_stream sqlite_migration_stage sqlite_migration_publish sqlite_migrate; do
            python -B -m "tools.generate_hia_$component"
          done
          python -B -m tools.generate_hia_elf_verified_linker
          git diff --exit-code
      - run: python -B tools/check_hia_core_only.py
      - run: python -B tools/generate_hia_selfhost_contract.py --check
      - run: python -B tests/test_hia_selfhost_language_coverage.py --generate-inventory
      - run: git diff --exit-code
      - name: Core source and independent reference controls
        run: |
          python -B - <<'PY'
          import unittest
          names = (
              'tests.test_hia_core_only',
              'tests.test_hia_cli_native.CliSourceTests',
              'tests.test_hia_json_wire_native.WireSourceTests',
