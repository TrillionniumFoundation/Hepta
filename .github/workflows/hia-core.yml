          name: hia-vm-integer-scalar-source-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: ${{ runner.temp }}/hia-vm-integer-scalar-source.log
      - name: Core source and independent reference controls
