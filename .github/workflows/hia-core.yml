      - name: Preserve complete qualifier successor source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-caller-qualifier-source-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/hia-caller-qualifier-source/
            ${{ runner.temp }}/hia-caller-qualifier-source.log
      - name: Complete HIA integer divrem Source three methods
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_vm_integer_divrem_native.VmIntegerDivRemSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-vm-integer-divrem-source.log"
      - name: Preserve complete HIA integer divrem Source log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-vm-integer-divrem-source-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: ${{ runner.temp }}/hia-vm-integer-divrem-source.log
      - name: Complete HIA integer arithmetic Source three methods
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_vm_integer_arithmetic_native.VmIntegerArithmeticSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-vm-integer-arithmetic-source.log"
      - name: Preserve complete HIA integer arithmetic Source log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-vm-integer-arithmetic-source-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: ${{ runner.temp }}/hia-vm-integer-arithmetic-source.log
      - name: Complete HIA integer scalar Source three methods
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_vm_integer_scalar_native.VmIntegerScalarSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-vm-integer-scalar-source.log"
      - name: Preserve complete HIA integer scalar Source log
