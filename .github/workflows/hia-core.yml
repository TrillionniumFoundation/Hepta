              'tests.test_hia_default_native_release.DefaultReleaseSourceTests',
              'tests.test_hia_store_lifecycle_native.StoreLifecycleSourceTests',
              'tests.test_hia_service_context_native.ServiceContextSourceTests',
              'tests.test_hia_cost_ledger_native.CostLedgerSourceTests',
              'tests.test_hia_evaluation_native.EvaluationSourceTests',
              'tests.test_hia_native_transport_failures.NativeTransportSourceTests',
              'tests.test_hia_static_budget_native.StaticBudgetSourceTests',
              'tests.test_hia_patch_impact_native.PatchImpactSourceTests',
              'tests.test_hia_cli_discovery_json.CliDiscoveryJsonSourceTests',
              'tests.test_hia_cli_discovery_selection.CliDiscoverySelectionSourceTests',
              'tests.test_hia_selfhost_call_graph_efficiency.CallGraphSourceTests',
              'tests.test_hia_selfhost_contract.SelfhostContractTests',
