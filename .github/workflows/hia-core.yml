          from pathlib import Path
          import struct
          import subprocess
          import sys
          from hepta.hia_agent_store import wire
          from tests.test_hia_worker_request_native import request

          executable = Path(sys.argv[1])
          catalog = '2' * 64
          value = request({'name': '汉字', 'negative_zero': -0.0, 'decimal': 1.25}, catalog=catalog)
          raw = wire(value)
          digest_input = wire({key: item for key, item in value.items() if key != 'request_sha256'})

          def run(header, raw):
              return subprocess.run([executable], input=header + raw, capture_output=True,
                                    env={'PATH': ''}, timeout=20)

          header = struct.pack('<8sQ64s', b'HIAWRA01', 4300, catalog.encode())
          exact = raw.ljust(8 << 20, b' ')
          for payload in (raw, exact):
              accepted = run(header, payload)
              assert (accepted.returncode, accepted.stdout, accepted.stderr) == (0, digest_input, b'')
          invalid = (
              (header, wire({**value, 'request_sha256': '0' * 64}), 2),
              (header[:16] + b'a' * 64, raw, 2),
              (header[:8] + struct.pack('<Q', 639) + header[16:], raw, 2),
              (b'bad' + header[3:], raw, 2),
              (header[:64], b'', 2),
              (header, exact + b' ', 3),
          )
          for bad_header, payload, status in invalid:
              refused = run(bad_header, payload)
