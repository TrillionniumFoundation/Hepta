          clean = not (result.errors or result.failures or result.skipped or
                       result.expectedFailures or result.unexpectedSuccesses)
          raise SystemExit(0 if complete and clean and result.wasSuccessful() else 1)
          PYSOURCEBUILD
        env:
          HEPTA_HIA_SOURCE_BUILD_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_SOURCE_BUILD_OBSERVATIONS: ${{ runner.temp }}/hia-source-build
      - name: Native raw JSON nominal packets and actual constructor ingress
        run: |
          python -B - <<'PYNOMINALJSON'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames((
              'tests.test_hia_nominal_json_native',
              'tests.test_hia_nominal_json_constructor_ingress'))
          expected = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          complete = result.testsRun == expected and expected > 0
          clean = not (result.errors or result.failures or result.skipped or
                       result.expectedFailures or result.unexpectedSuccesses)
          raise SystemExit(0 if complete and clean and result.wasSuccessful() else 1)
          PYNOMINALJSON
        env:
          HEPTA_HIA_NOMINAL_JSON_COLD_REPORT: ${{ runner.temp }}/hia-cold.json
          HEPTA_HIA_NOMINAL_JSON_EVIDENCE: ${{ runner.temp }}/hia-nominal-json
          HEPTA_HIA_NOMINAL_JSON_INGRESS_EVIDENCE: ${{ runner.temp }}/hia-nominal-json-ingress

      - name: Native JSON wire entry, exact graph budgets, key cache and installed resources
        run: python -B tools/run_hia_unittest_gate.py tests.test_hia_json_wire_native tests.test_hia_json_wire_entry tests.test_hia_json_wire_cache
