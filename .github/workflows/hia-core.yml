          HEPTA_HIA_MACHINE_OBJECT_FIXTURE_EVIDENCE: ${{ runner.temp }}/machine-object-fixture
      - name: Actual original machine and Core callers with complete HIA ELF object control
        run: python -B tools/qualify_hia_machine_object_callers.py --cold-report "$RUNNER_TEMP/hia-cold.json" --evidence "$RUNNER_TEMP/machine-object-callers"
      - name: Actual original callers with native ELF byte wrapper Emitter and Function control together
        run: python -B tools/qualify_hia_machine_object_callers.py --cold-report "$RUNNER_TEMP/hia-cold.json" --with-core-lowering --with-core-emitter --with-byte-wrapper --evidence "$RUNNER_TEMP/machine-object-composed-callers"
