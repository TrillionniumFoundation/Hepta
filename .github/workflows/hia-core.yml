          retention-days: 7
          path: |
            ${{ runner.temp }}/hia-caller-terminal-readback-source/
            ${{ runner.temp }}/hia-caller-terminal-readback-source.log
      - name: Exact qualifier successor Source two methods
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        env:
          HEPTA_HIA_CALLER_QUALIFIER_SOURCE_EVIDENCE: ${{ runner.temp }}/hia-caller-qualifier-source
        run: |
          set -euo pipefail
