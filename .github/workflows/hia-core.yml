                  or set(authority['manifests']) != {'service', 'operations', 'store', 'transaction', 'ledger'}):
              raise SystemExit('ServiceSlot companion authority is not the current cold composition')
          captured = {}
          for name, value in authority['manifests'].items():
              data = Path(value).read_bytes()
              if sha256(data).hexdigest() != authority['manifest_sha256'][name]:
                  raise SystemExit('ServiceSlot companion manifest changed: ' + name)
              captured[value] = data
          cold_path = parent / 'hia-cold.json'
          cold_raw = cold_path.read_bytes()
          outer = json.loads(cold_raw)
          nested_path = Path(outer['nested_report'])
          nested_raw = nested_path.read_bytes()
          nested = json.loads(nested_raw)
          compiler_path = Path(nested['generations'][-1]['produced_image'])
          compiler_raw = compiler_path.read_bytes()
          if (sha256(compiler_raw).hexdigest() != authority['compiler_sha256']
                  or compiler_path.resolve() != Path(authority['compiler']).resolve()):
              raise SystemExit('ServiceSlot companion compiler differs from current cold')
          selected = {
              'HEPTA_HIA_SLOT_OPERATIONS_MANIFEST': authority['manifests']['operations'],
              'HEPTA_HIA_SLOT_LEDGER_MANIFEST': authority['manifests']['ledger'],
              'HEPTA_HIA_STORE_ARTIFACT_PROFILE_MANIFEST': authority['manifests']['store'],
              'HEPTA_HIA_STORE_TRANSACTION_MANIFEST': authority['manifests']['transaction'],
          }
          outputs = {
              'hia-service-slot-companions.json': selected,
              'hia-service-slot-original-fixture-environment.json': {},
          }
          for name, value in outputs.items():
              with (parent / name).open('x') as stream:
                  stream.write(json.dumps(value, sort_keys=True, indent=2) + '\n')
          if (path.read_bytes() != raw or cold_path.read_bytes() != cold_raw
                  or nested_path.read_bytes() != nested_raw or compiler_path.read_bytes() != compiler_raw
                  or any(Path(name).read_bytes() != value for name, value in captured.items())
                  or authority['sources'] != current_sources()):
              raise SystemExit('ServiceSlot caller input custody changed')
          report = {
              'schema': 'hepta.hia.service-slot-CI-companion-binding.v1',
              'authority_path': str(path), 'authority_sha256': sha256(raw).hexdigest(),
              'cold_path': str(cold_path), 'cold_sha256': sha256(cold_raw).hexdigest(),
