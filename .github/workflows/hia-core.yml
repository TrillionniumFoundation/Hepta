name: HIA Core-only
on: [push, pull_request, workflow_dispatch]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the frozen caller inventory dependency
        run: python -m pip install jsonschema==4.26.0 setuptools==78.1.1
      - name: Regenerate actual HIA sources
        run: |
          set -eu
          for component in core_workspace_pipeline core_workspace_facts core_workspace_facts_cli core_workspace_materialize core_workspace_cli capability_renaming core_module_graph core_workspace_json core_workspace_json_cli agent_identity agent_slice scalar_symbolic agent_read_page mcp_stdio_packer mcp_terminal agent_schema agent_discovery agent_inspection agent_artifact_capture elf_linker shared_linker elf_verified_linker native_filter core_json_cli agent_stdio agent_snapshot agent_snapshot_json agent_snapshot_json_cli sha256_stream native_observer sha256 json_preflight json_decode json_canonical core_json_frontend selfhost agent_binary64 agent_data_json instruction_policy program_shape function_shape artifact_publication core_admission_cli core_suite core_inspect_json core_admission agent_binary64_format core_patch core_patch_cli core_patch_result_cli core_edit_packer core_edit_templates composite_types task_helpers composite_functions composite_constructor composite_outer worker_prepare worker_request release_install release_selection retirement_state agent_journal agent_journal_transport journal_stdio_packer execution_budget candidate_budget source_build nominal_json nominal_transport_adapters slot_ledger cli_control cli_format json_wire worker_report machine_encoding machine_state machine_instructions machine_plan core_lowering core_emitter byte_wrapper machine_object execution_observation execution_ledger continuation sqlite_agent_catalog sqlite_table_walk sqlite_pager_adapters sqlite_component_adapters sqlite_migration_adapters sqlite_migration_plan sqlite_migration_projection sqlite_pager_stream sqlite_migration_stage sqlite_migration_publish sqlite_migrate linked_observer native_mapping publication_measurement scalar_profile generation_retention bounded_memory full_cost patch_impact static_budget store_lifecycle store_transaction service_context cost_ledger evaluation native_build_admission emission store_artifact_profile cli_discovery_json slot_operations service_artifact service_read service_slot service_inspection service_lease store_file_capture service_discovery service_verification service_bootstrap executable_capture exec_release; do
            python -B -m "tools.generate_hia_$component"
          done
          git diff --exit-code
      - run: python -B tools/check_hia_core_only.py
      - run: python -B tools/generate_hia_selfhost_contract.py --check
      - run: python -B tests/test_hia_selfhost_language_coverage.py --generate-inventory
      - run: git diff --exit-code
        id: source_prerequisites
      - name: v9 fixed-width memory independent source controls
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -B tools/generate_hia_catalog.py --check
          python -B tools/run_hia_unittest_gate.py \
            tests.test_hia_word_memory.WordMemoryTests \
            tests.test_hia_selfhost_immediates.ImmediateSourceTests \
            tests.test_hia_static_budget_word_memory.StaticBudgetWordMemorySourceTests \
            tests.test_hia_slot_word_memory.SlotWordMemorySourceTests
      - name: Slot fixed-word original and complete packet Source controls
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        env:
          HEPTA_HIA_SLOT_FIXED_WORD_EVIDENCE: ${{ runner.temp }}/hia-slot-fixed-word-source
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_slot_fixed_words.SlotFixedWordSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-slot-fixed-word-source.log"
      - name: Complete original executable-capture Source three methods
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        env:
          HEPTA_HIA_EXECUTABLE_CAPTURE_EVIDENCE: ${{ runner.temp }}/hia-executable-capture-source
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_executable_capture.ExecutableCaptureSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-executable-capture-source.log"
      - name: Complete executable-capture receipt Source two methods
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        env:
          HEPTA_HIA_EXECUTABLE_CAPTURE_EVIDENCE: ${{ runner.temp }}/hia-executable-capture-receipt-source
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_executable_capture_receipt.ExecutableCaptureReceiptSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-executable-capture-receipt-source.log"
      - name: Preserve complete fixed-word and capture Source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-slot-capture-source-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/hia-slot-fixed-word-source/
            ${{ runner.temp }}/hia-slot-fixed-word-source.log
            ${{ runner.temp }}/hia-executable-capture-source/
            ${{ runner.temp }}/hia-executable-capture-source.log
            ${{ runner.temp }}/hia-executable-capture-receipt-source/
            ${{ runner.temp }}/hia-executable-capture-receipt-source.log
      - name: Exact original caller terminal admission Source2 controls
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        env:
          HEPTA_HIA_CALLER_TERMINAL_SOURCE_EVIDENCE: ${{ runner.temp }}/hia-caller-terminal-source
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_caller_terminal_admission.CallerTerminalAdmissionSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-caller-terminal-source.log"
      - name: Preserve complete caller terminal source admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-caller-terminal-source-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/hia-caller-terminal-source/
            ${{ runner.temp }}/hia-caller-terminal-source.log
      - name: Independent caller terminal readback Source2 controls
        if: ${{ !cancelled() && steps.source_prerequisites.outcome == 'success' }}
        timeout-minutes: 30
        env:
          HEPTA_HIA_CALLER_TERMINAL_READBACK_SOURCE_EVIDENCE: ${{ runner.temp }}/hia-caller-terminal-readback-source
        run: |
          set -euo pipefail
          python -B tools/run_hia_unittest_gate.py tests.test_hia_caller_terminal_readback.CallerTerminalReadbackSourceTests \
            2>&1 | tee "$RUNNER_TEMP/hia-caller-terminal-readback-source.log"
      - name: Preserve complete independent caller source readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-caller-terminal-readback-source-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
