name: HIA shared full eleven acceptance (DENY_ALL)
on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tools/check_core_syntax_lean.py'
      - 'tools/check_core_syntax_staged.py'
      - 'tools/check_core_syntax_partitioned.py'
      - 'tools/core_syntax_partition_sources.py'
      - 'tools/core_syntax_partition_diagnostic_sources.py'
      - 'tools/diagnose_core_syntax_partition.py'
      - 'tools/core_seven_certificate*.py'
      - 'tools/diagnose_core_seven_certificate.py'
      - 'tools/check_core_seven_certificate.py'
      - 'tools/check_core_seven_relocation.py'
      - 'tools/core_seven_relocation_acceptance_plan.py'
      - 'tools/core_seven_relocation_acceptance_replay.py'
      - 'tests/test_core_seven_relocation_acceptance.py'
      - 'docs/seven-relocation-acceptance.md'
      - 'tools/core_seven_parallel_relocation_sources.py'
      - 'tests/test_core_seven_parallel_relocation_sources.py'
      - 'docs/seven-parallel-relocation.md'
      - 'tools/check_core_seven_shared.py'
      - 'tools/core_seven_shared_acceptance_plan.py'
      - 'tools/core_seven_shared_acceptance_replay.py'
      - 'tools/core_seven_shared_sources.py'
      - 'tools/core_seven_nocode_sources.py'
      - 'tools/diagnose_core_seven_nocode.py'
      - 'tests/test_core_seven_shared_acceptance.py'
      - 'tests/test_core_seven_shared_sources.py'
      - 'tests/test_core_seven_nocode_sources.py'
      - 'docs/seven-shared-composition.md'
      - 'docs/seven-data-nocode.md'
      - 'experiments/hia_initialization_frontiers_20261103/SharedTransport.lean'
      - 'experiments/hia_initialization_frontiers_20261103/CORE_MODEL_CONNECTION.md'
      - 'experiments/hia_initialization_frontiers_20261103/UNSIGNED_STEP_CONNECTION.md'
      - '.github/workflows/hia-initialization-frontier-research.yml'
      - 'tools/core_seven_relocation_diagnostic_sources.py'
      - 'tools/diagnose_core_seven_relocation.py'
      - 'tests/test_core_seven_relocation_*.py'
      - 'docs/seven-relocation-diagnostic.md'
      - 'tools/*part04*.py'
      - 'tests/test_core_seven_part04_*.py'
      - 'docs/seven-part04-diagnostic.md'
      - 'tools/core_seven_acceptance_*.py'
      - 'tests/test_core_seven_acceptance.py'
      - 'docs/seven-certificate-acceptance.md'
      - 'tests/test_core_seven_certificate*.py'
      - 'docs/seven-certificate-first-four-diagnostic-design.md'
      - 'docs/seven-certificate-source-proposal.md'
      - 'tools/core_byte_facts_*.py'
      - 'tools/diagnose_core_byte_facts.py'
      - 'tests/test_core_byte_facts_*.py'
      - 'experiments/hia_initialization_frontiers_20261103/ByteFactsResearch.lean'
      - 'tools/diagnose_core_syntax_declarations.py'
      - 'tools/core_syntax_declaration_diagnostic_sources.py'
      - 'tools/core_syntax_diagnostic_capture.py'
      - 'tools/core_syntax_noncomputable_diagnostic_sources.py'
      - 'tools/core_syntax_stage_sources.py'
      - 'tools/core_syntax_structured_sources.py'
      - 'tools/core_syntax_structured_stages.py'
      - 'experiments/hia_initialization_frontiers_20261103/StructuredTransport.lean'
      - 'tests/test_core_syntax_*.py'
      - 'experiments/hia_initialization_frontiers_20261103/CoreSyntaxSlice.lean'
      - '.github/workflows/hia-core-syntax-kernel-research.yml'
      - 'formal/HiaInitializationPrefix.lean'
      - 'formal/toolchain-lock.json'
      - 'formal/proof-dependencies.txt'
      - 'experiments/hia_initialization_frontiers_20261103/GuardedUsizeSlice.lean'
      - 'tools/check_guarded_slice_lean.py'
      - 'tools/check_dynamic_unsigned_step.py'
      - 'tools/extract_initialization_obligations.py'
      - 'tools/check_initialization_frontiers.py'
      - 'tools/experimental_deferred_guard_proposer.py'
      - 'tools/research_deferred_guard_model.py'
      - 'tools/qualify_hia_selected_formal.py'
      - 'tools/evidence_checks.py'
      - 'tools/qualify_hia_initialization_prefix.py'
      - 'tools/bootstrap_verification.py'
      - 'benchmarks/hia_reduction_release/linear.hepta'
      - 'benchmarks/hia_reduction_release/affine.hepta'
      - 'tests/test_guarded_slice_lean.py'
      - '.github/workflows/hia-guarded-slice-kernel-research.yml'
permissions:
  contents: read
jobs:
  core-syntax-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and acquire existing bootstrap dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree}
          python -m pip install zstandard 'z3-solver==4.15.4.0'
          python -m pip show zstandard z3-solver
          python -c "import z3,sys; sys.exit(0 if z3.get_version_string() == '4.15.4' else 1)"
      - name: Acquire only the existing SHA-locked Lean checker
        run: |
          set -euo pipefail
          timeout 300s python -B tools/bootstrap_verification.py --lean-only --directory "$RUNNER_TEMP/core-syntax-tools"
      - name: Check eleven fresh shared modules; narrow syntax only
        run: |
          set -euo pipefail
          status=0
          timeout 600s python -B -m tools.check_core_seven_shared \
            --lean "$RUNNER_TEMP/core-syntax-tools/lean-4.19.0/bin/lean" \
            --output-directory "$RUNNER_TEMP/core-syntax-proof" || status=$?
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          exit "$status"
      - name: Replay complete same-run shared evidence; bounded checked summary
        if: always()
        run: |
          timeout 600s python -B -m tools.check_core_seven_shared --replay \
            --output-directory "$RUNNER_TEMP/core-syntax-proof"

      - name: Preserve complete same-run kernel evidence and failure output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-shared-kernel-${{ env.EXPECTED_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-syntax-proof/
          if-no-files-found: error

  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and acquire existing Python dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree}
          python -m pip install zstandard 'z3-solver==4.15.4.0'
          python -m pip show zstandard z3-solver
          python -c "import z3,sys; sys.exit(0 if z3.get_version_string() == '4.15.4' else 1)"
      - name: Run every fixed source control with complete ID receipts
        env:
          HIA_SOURCE_CONTROLS_DIR: ${{ runner.temp }}/shared-source-controls
        run: |
          set -euo pipefail
          mkdir "$HIA_SOURCE_CONTROLS_DIR"
          status=0
          timeout 420s python -B - <<'PY' >"$HIA_SOURCE_CONTROLS_DIR/stdout" 2>"$HIA_SOURCE_CONTROLS_DIR/stderr" || status=$?
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import unittest

          EXPECTED_IDS = [
            "tests.test_core_seven_shared_acceptance.SharedAcceptanceContractTests.test_actual_compiler_hash_reads_cannot_escape_source_identity",
            "tests.test_core_seven_shared_acceptance.SharedAcceptanceContractTests.test_every_existing_hard_budget_unchanged",
            "tests.test_core_seven_shared_acceptance.SharedAcceptanceContractTests.test_source_generation_never_grants_broader_authority",
            "tests.test_core_seven_shared_acceptance.SharedAcceptanceContractTests.test_source_identity_includes_every_new_trust_dependency",
            "tests.test_core_seven_shared_acceptance.SharedAcceptanceContractTests.test_success_flag_cannot_replace_complete_replay",
            "tests.test_core_seven_shared_acceptance.SharedAcceptanceContractTests.test_timeouts_and_unobserved_cleanup_still_fail",
            "tests.test_core_seven_shared_sources.ApplicationParserTests.test_nested_certificate_arguments_preserved",
            "tests.test_core_seven_shared_sources.ByteAliasScanTests.test_exact_integer_domain_matches_the_old_predicate",
            "tests.test_core_seven_shared_sources.ByteAliasScanTests.test_type_protocols_cannot_impersonate_builtin_int",
            "tests.test_core_seven_shared_sources.ByteAliasScanTests.test_unused_alias_still_obeys_range_and_expanded_length_bounds",
            "tests.test_core_seven_shared_sources.CompoundProofTests.test_aliases_resolve_in_the_defining_namespace_and_cycles_reject",
            "tests.test_core_seven_shared_sources.CompoundProofTests.test_branch_visibility_and_registration_order_are_required",
            "tests.test_core_seven_shared_sources.CompoundProofTests.test_control_mutations_preserve_the_independent_prior_proofs",
            "tests.test_core_seven_shared_sources.CompoundProofTests.test_each_semantic_key_component_is_required",
            "tests.test_core_seven_shared_sources.CompoundProofTests.test_exact_bounds_closed_raw_and_actual_bytes_reuse",
            "tests.test_core_seven_shared_sources.CompoundProofTests.test_nonclosed_data_or_nonliteral_bytes_cannot_reuse",
            "tests.test_core_seven_shared_sources.CompoundProofTests.test_zero_bounds_are_never_candidates",
            "tests.test_core_seven_shared_sources.DeclarationMarkerTests.test_literal_occurrences_match_independent_substring_scan",
            "tests.test_core_seven_shared_sources.FlatDecimalListTests.test_strict_subgrammar_and_legacy_fallback_match_original",
            "tests.test_core_seven_shared_sources.PrintSchedulingTests.test_independent_queries_move_without_changing_any_other_byte",
            "tests.test_core_seven_shared_sources.PrintSchedulingTests.test_indexed_and_legacy_paths_match_the_original_oracle",
            "tests.test_core_seven_shared_sources.PrintSchedulingTests.test_missing_duplicated_or_foreign_subject_is_rejected",
            "tests.test_core_seven_shared_sources.RawDataScanTests.test_raw_string_domain_and_subclass_reads_match_original",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_actual_data_fast_paths_keep_full_verifier_outputs",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_actual_fast_path_keeps_all_v10_modules_and_manifest",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_both_actual_old_validation_gates_are_mandatory",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_changed_byte_actual_reference_data_and_cancellation_are_bound",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_child_certificate_cannot_be_substituted",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_compound_layer_recovers_every_frozen_v6_module",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_compound_reference_and_manifest_cannot_be_forged",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_consumer_repairs_reconstruct_complete_actual_old_bytes",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_consumer_target_local_proof_and_negative_clause_tampering_reject",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_data_and_nocode_headers_still_exact",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_fixed_extension_reconstructs_exact_v4_and_original_order",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_full_actual_source_inverse_and_unchanged_original_subjects",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_generic_layer_and_repartition_cannot_hide_changes",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_helper_tampering_and_hidden_axiom_rejected",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_literal_proof_reference_cannot_be_forged",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_manifest_cannot_authorize_or_hide_edits",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_moved_declarations_cannot_be_dropped_duplicated_or_reassigned",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_new_boundary_checks_actual_import_and_forward_reference",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_original_subject_or_new_helper_cannot_be_omitted",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_print_schedule_cannot_drop_duplicate_substitute_or_delay_queries",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_print_schedule_restores_all_actual_v7_bytes_and_multiplicities",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_shared_proof_body_cannot_be_changed",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_statement_cannot_be_weakened",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_unplanned_retained_copy_is_counted",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_untrusted_reference_is_byte_identical_to_checked_old_builder",
            "tests.test_core_seven_shared_sources.SharedSourceTests.test_wrong_arm_mutation_statement_and_projected_field_remain_bound"
          ]
          EXPECTED_COUNT = 49
          MODULES = ('tests.test_core_seven_shared_sources',
                     'tests.test_core_seven_shared_acceptance')
          ROOT = Path(os.environ['HIA_SOURCE_CONTROLS_DIR'])
          EXPECTED_HEAD = os.environ['EXPECTED_HEAD']
          STARTED = time.monotonic_ns()

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          def require(condition, reason):
              if not condition:
                  raise ValueError(reason)

          def flatten(suite):
              for value in suite:
                  if isinstance(value, unittest.TestSuite):
                      yield from flatten(value)
                  else:
                      yield value

          class RecordedResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.started_ids = []
                  self.finished_ids = []
              def startTest(self, test):
                  self.started_ids.append(test.id())
                  super().startTest(test)
              def stopTest(self, test):
                  self.finished_ids.append(test.id())
                  super().stopTest(test)

          record = {
              'schema': 'hepta.hia.shared-source-controls.v1',
              'status': 'failed', 'expected_count': EXPECTED_COUNT,
              'expected_ids': EXPECTED_IDS, 'modules': list(MODULES),
              'lean_invocations': 0, 'acceptance_eligible': False,
              'scope': 'source-only controls; no kernel or production admission',
          }
          try:
              record['source_commit_before'] = git('rev-parse', 'HEAD')
              record['source_tree_before'] = git('rev-parse', 'HEAD^{tree}')
              record['source_clean_before'] = not git('status', '--porcelain', '--untracked-files=all')
              require(record['source_commit_before'] == EXPECTED_HEAD and record['source_clean_before'],
                      'exact clean source before controls')
              require(len(EXPECTED_IDS) == EXPECTED_COUNT == len(set(EXPECTED_IDS)), 'fixed unique inventory')
              loader = unittest.TestLoader()
              suite = loader.loadTestsFromNames(MODULES)
              collected = [test.id() for test in flatten(suite)]
              record['collected_ids'] = collected
              record['loader_errors'] = list(loader.errors)
              require(not loader.errors and sorted(collected) == EXPECTED_IDS, 'complete collected inventory')
              result = unittest.TextTestRunner(verbosity=2, failfast=False,
                                              resultclass=RecordedResult).run(suite)
              record.update(tests_run=result.testsRun, started_ids=result.started_ids,
                            finished_ids=result.finished_ids, skipped=len(result.skipped),
                            expected_failures=len(result.expectedFailures),
                            unexpected_successes=len(result.unexpectedSuccesses),
                            failures=len(result.failures), errors=len(result.errors))
              require(result.wasSuccessful() and not result.skipped, 'all controls pass without skips')
              require(not result.expectedFailures and not result.unexpectedSuccesses,
                      'expected failures and unexpected successes are rejected')
              require(result.testsRun == EXPECTED_COUNT, 'exact execution count')
              require(result.started_ids == collected == result.finished_ids, 'every collected ID starts and finishes')
              record['status'] = 'source_controls_passed'
          except BaseException as error:
              record['error_type'] = type(error).__name__
              record['error'] = str(error)
          finally:
              try:
                  record['source_commit_after'] = git('rev-parse', 'HEAD')
                  record['source_tree_after'] = git('rev-parse', 'HEAD^{tree}')
                  record['source_clean_after'] = not git('status', '--porcelain', '--untracked-files=all')
                  if not (record['source_commit_after'] == EXPECTED_HEAD
                          and record['source_tree_after'] == record.get('source_tree_before')
                          and record['source_clean_after']):
                      record['status'] = 'failed'
                      record['source_identity_changed'] = True
              except BaseException as error:
                  record['status'] = 'failed'
                  record['source_identity_error'] = str(error)
              record['elapsed_ns'] = time.monotonic_ns() - STARTED
              raw = (json.dumps(record, sort_keys=True, indent=2) + '\n').encode()
              with (ROOT / 'RESULT.json').open('xb') as handle:
                  handle.write(raw)
              print(json.dumps(record, sort_keys=True), flush=True)
              print('SOURCE_CONTROLS_RESULT_SHA256=' + hashlib.sha256(raw).hexdigest(), flush=True)
          raise SystemExit(0 if record['status'] == 'source_controls_passed' else 1)

          PY
          cat "$HIA_SOURCE_CONTROLS_DIR/stdout"
          cat "$HIA_SOURCE_CONTROLS_DIR/stderr"
          if [ "$status" -eq 0 ]; then
            python -B - <<'PY_RECEIPT'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          EXPECTED_COUNT = 49
          EXPECTED_IDS_SHA256 = '3140293a237ad1f497f26b4946f72914257124d97a5fdaea22da7740aee56ddf'
          EXPECTED_HEAD = os.environ['EXPECTED_HEAD']

          def require(condition, reason):
              if not condition:
                  raise ValueError(reason)

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'duplicate receipt key')
                  result[key] = value
              return result

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          raw = (Path(os.environ['HIA_SOURCE_CONTROLS_DIR']) / 'RESULT.json').read_bytes()
          require(0 < len(raw) <= 65536, 'bounded complete receipt')
          record = json.loads(raw, object_pairs_hook=unique_object)
          require(type(record) is dict, 'receipt object')
          require(record.get('schema') == 'hepta.hia.shared-source-controls.v1'
                  and record.get('status') == 'source_controls_passed', 'successful terminal receipt')
          require(record.get('lean_invocations') == 0
                  and type(record.get('lean_invocations')) is int
                  and record.get('acceptance_eligible') is False, 'source-only receipt scope')
          require(record.get('modules') == ['tests.test_core_seven_shared_sources',
                                            'tests.test_core_seven_shared_acceptance'], 'fixed modules')
          for key in ('expected_ids', 'collected_ids', 'started_ids', 'finished_ids'):
              ids = record.get(key)
              require(type(ids) is list and len(ids) == EXPECTED_COUNT
                      and all(type(value) is str for value in ids)
                      and len(set(ids)) == EXPECTED_COUNT, 'complete unique ' + key)
              digest = hashlib.sha256(('\n'.join(sorted(ids)) + '\n').encode()).hexdigest()
              require(digest == EXPECTED_IDS_SHA256, 'fixed actual inventory ' + key)
          require(record['expected_ids'] == sorted(record['expected_ids']), 'canonical fixed inventory')
          require(record['started_ids'] == record['collected_ids'] == record['finished_ids'],
                  'complete ordered start and finish receipts')
          for key in ('expected_count', 'tests_run'):
              require(type(record.get(key)) is int and record[key] == EXPECTED_COUNT, 'exact ' + key)
          for key in ('skipped', 'expected_failures', 'unexpected_successes', 'failures', 'errors'):
              require(type(record.get(key)) is int and record[key] == 0, 'zero ' + key)
          require(record.get('loader_errors') == [], 'no loader errors')
          require(type(record.get('elapsed_ns')) is int and record['elapsed_ns'] >= 0, 'elapsed receipt')
          actual_head, actual_tree = git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}')
          require(actual_head == EXPECTED_HEAD and not git('status', '--porcelain', '--untracked-files=all'),
                  'actual clean exact source after controls')
          require(record.get('source_commit_before') == EXPECTED_HEAD == record.get('source_commit_after')
                  and record.get('source_tree_before') == actual_tree == record.get('source_tree_after')
                  and record.get('source_clean_before') is True
                  and record.get('source_clean_after') is True, 'complete clean source identity receipts')
          require(not any(key in record for key in ('error', 'error_type', 'source_identity_error',
                                                   'source_identity_changed')), 'no concealed terminal error')
          print('SOURCE_CONTROLS_RECEIPT_VERIFIED_SHA256=' + hashlib.sha256(raw).hexdigest(), flush=True)
          PY_RECEIPT
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          exit "$status"
      - name: Preserve source-control receipts and failure output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-shared-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-source-controls
          if-no-files-found: error
