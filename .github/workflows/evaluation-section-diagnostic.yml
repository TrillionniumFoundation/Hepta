name: Exact published Evaluation section diagnostic
on:
  push:
    branches: [codex/hia-evaluation-sections-v84-20261113-dda7]
permissions:
  contents: read
jobs:
  sections314:
    name: Actual 3.14.4 original three cases with sampled section counters
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 4925e72d9f51f4dc3e8f4d1d2a7b24cce2f5772b
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Exact retained tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gcc strace clang-20
          python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Verify authentic published 3324-file source and retained compiler
        run: python -B harness/inputs/run_section_diagnostic.py --stage prepare --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/evaluation-sections"
      - name: One exact development build under the original 20 second compile limit
        if: ${{ !cancelled() }}
        run: python -B harness/inputs/run_section_diagnostic.py --stage build --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/evaluation-sections"
      - name: Original expired evaluation case and cumulative context window
        if: ${{ !cancelled() }}
        run: python -B harness/inputs/run_section_diagnostic.py --stage expired --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/evaluation-sections"
      - name: Original reference loop case and cumulative context window
        if: ${{ !cancelled() }}
        run: python -B harness/inputs/run_section_diagnostic.py --stage loop --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/evaluation-sections"
      - name: Original native timeout case and Evaluation continuation costs
        if: ${{ !cancelled() }}
        run: python -B harness/inputs/run_section_diagnostic.py --stage timeout --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/evaluation-sections"
      - name: Retain every original outcome and exact complete diagnostic evidence
        if: ${{ always() }}
        run: python -B harness/inputs/run_section_diagnostic.py --stage finish --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/evaluation-sections"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: evaluation-sections-original-evidence
          path: |
            ${{ runner.temp }}/evaluation-sections/RAW-EVIDENCE.zip
            ${{ runner.temp }}/evaluation-sections/EVIDENCE-MANIFEST.json
            ${{ runner.temp }}/evaluation-sections/REPORT.json
            ${{ runner.temp }}/evaluation-sections/STAGE-*.json
            harness/inputs
            harness/README.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
