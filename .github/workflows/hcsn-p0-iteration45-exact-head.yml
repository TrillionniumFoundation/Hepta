name: HCSN P0 independent Eq8-A7 and QVI audit (HOLD)

on:
  push:
    branches:
      - research/hcsn-p0-eq8-a7-qvi-independent-20261106-gpt6-01
  pull_request:
    paths:
      - .github/workflows/hcsn-p0-iteration45-exact-head.yml
      - research/hcsn/p0_independent_eq8_a7_qvi_audit.py
      - research/hcsn/test_p0_independent_eq8_a7_qvi_audit.py
      - research/hcsn/gates/2026-11-06-iteration45-independent-eq8-a7-qvi.json
      - research/hcsn/gates/2026-11-06-iteration45-independent-eq8-a7-qvi.md
      - research/hcsn/gates/2026-11-06-iteration45-SHA256SUMS.txt

permissions:
  contents: read

jobs:
  independent-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      EXPECTED_SHA: \${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head or pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source identity and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sha256sum -c research/hcsn/gates/2026-11-06-iteration45-SHA256SUMS.txt

      - name: Install pinned numerical environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"
          cache: pip
      - name: Install pinned packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0

      - name: Run independent numerical tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest research.hcsn.test_p0_independent_eq8_a7_qvi_audit -v 2>&1 | tee "$RUNNER_TEMP/iteration45-tests.log"

      - name: Generate fresh raw numerical JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m research.hcsn.p0_independent_eq8_a7_qvi_audit --output "$RUNNER_TEMP/iteration45-independent.json"
          python - "$RUNNER_TEMP/iteration45-independent.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["schema"] == "hcsn.p0-independent-eq8-eq11-eq12-a7-qvi.v1"
          assert d["original_hx"]["accepted_rows"] == 40
          assert d["original_hx"]["max_boundary_relative_error"] < 1e-9
          assert d["original_hx"]["max_a7_green_relative_error"] < 1e-8
          assert d["fp32_information_loss"]["same_fp32_tax_bits"]
          assert d["fp32_information_loss"]["same_fp32_boundary_bits"]
          assert d["fp32_information_loss"]["opposite_qB_signs"]
          assert d["gates"] == {f"P{i}":"OPEN" for i in range(7)}
          assert d["production_activation"] is False
          PY

      - name: Preserve strict independent gate non-acceptance
        shell: bash
        run: |
          set +e
          python -m research.hcsn.independent_gate --bundle research/hcsn --strict > "$RUNNER_TEMP/iteration45-strict-gate.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/iteration45-strict-gate.log"
          test "$code" -eq 2

      - name: Retain raw JSON and execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-p0-iteration45-exact-head-evidence
          path: |
            \${{ runner.temp }}/iteration45-independent.json
            \${{ runner.temp }}/iteration45-tests.log
            \${{ runner.temp }}/iteration45-strict-gate.log
          if-no-files-found: warn
          retention-days: 30
