name: Hepta C migration adversarial checks
on:
  push:
    branches:
      - dot/hepta-p3-adversarial-gates-20261024
      - audit/hepta-p3-pr4-toplevel-negative-gate-20261030-r25
      - audit/hepta-p3-toplevel-status-fix-20261030-r26
      - audit/hepta-p3-source-freshness-red-20261030-r27
      - audit/hepta-p3-source-freshness-fix-20261030-r28
      - audit/hepta-p3-bounded-source-read-20261030-r29
      - audit/hepta-p3-bounded-recheck-20261030-r30
      - audit/hepta-p3-clang-capture-red-20261030-r31
      - audit/hepta-p3-clang-capture-fix-20261030-r32
      - audit/hepta-p3-ast-depth-red-20261030-r33
      - audit/hepta-p3-ast-depth-fix-20261030-r34
      - audit/hepta-p3-ast-node-budget-red-20261031-r35
      - audit/hepta-p3-ast-node-budget-fix-20261031-r36
      - audit/hepta-p3-macro-inventory-compose-20261031-r37
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-migration-rejection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compiler versions
        run: |
          clang --version
          gcc --version
          python3 --version
      - name: Run C migration positive and adversarial gates
        run: |
          python3 -m unittest discover -s tests -p test_c_migrate.py -v
          python3 -m unittest discover -s tests -p test_c_migrate_adversarial.py -v
      - name: Run C++ bridge tests
        run: python3 -m unittest discover -s tests -p test_cpp_bridge.py -v
