name: Exact Artifact and Evaluation joint development
on:
  push:
    branches: [codex/hia-native-receipt-evaluation-v83-ci-20261113-dda7]
permissions:
  contents: read
jobs:
  native314:
    name: Actual CPython 3.14.4 artifacts and original caller gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 65ceb711e47548f85ecf6b2ec2ae90f11dd50743
          path: base
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Exact original tools and prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gcc strace clang-20
          python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Source custody, actual native component and original 48/35/48 callers
        run: python -B harness/inputs/run_joint_development.py --source "$GITHUB_WORKSPACE/base" --inputs "$GITHUB_WORKSPACE/harness/inputs" --workspace "$RUNNER_TEMP/artifacts-native314" --profile native314
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: artifacts-native314-original-evidence
          path: |
            ${{ runner.temp }}/artifacts-native314
            harness/inputs
            harness/README.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  default311:
    name: Actual Python 3.11 default and unsupported selected ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 65ceb711e47548f85ecf6b2ec2ae90f11dd50743
          path: base
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact prerequisites for default caller behavior
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Default imports, static example, original 8 callers and native refusal
        run: python -B harness/inputs/run_joint_development.py --source "$GITHUB_WORKSPACE/base" --inputs "$GITHUB_WORKSPACE/harness/inputs" --workspace "$RUNNER_TEMP/artifacts-default311" --profile default311
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: artifacts-default311-original-evidence
          path: |
            ${{ runner.temp }}/artifacts-default311
            harness/inputs
            harness/README.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  source314:
    name: Actual CPython 3.14.4 all 97 generators and 973 source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
