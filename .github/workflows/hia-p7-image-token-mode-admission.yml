name: HIA P7 image-token and mode admission exact-head tests
on:
  push:
    branches:
      - work/hia-p7-image-token-mode-admission-20261031-gpt6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p7-image-lookup-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic P7 hostile-input and existing queue-capture regressions
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            tests.test_hia_image_token_admission \
            tests.test_hia_stateful_queue_capture
      - name: Ensure no tests mutated source
        run: git diff --exit-code

  p7-pinned-native-and-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLANG: /usr/bin/clang-20
      HEPTA_CLANG: /usr/bin/clang-20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin Clang 20 and original optimization dependencies
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev llvm-20 lld-20 build-essential
          python -m pip install --disable-pip-version-check -e '.[optimization]' 'zstandard==0.25.0'
          test -x "$CLANG"
          python -c 'import z3; print("Z3", z3.get_version_string())'
      - name: Execute exact-head P0/P1/P5 and real P7 native negative controls
        run: |
          set -euo pipefail
          python -B -m tools.qualify_hia_three_lane --suite core --output "$RUNNER_TEMP/hia-p7-image-core.json"
          python -B -m tools.qualify_hia_three_lane --suite native --output "$RUNNER_TEMP/hia-p7-image-native.json"
          python -B -m unittest -v tests.test_hia_image_token_admission
          python -B -m py_compile hepta/hia_adaptive.py hepta/hia_stateful.py tests/test_hia_image_token_admission.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-p7-image-token-core-and-native
          path: |
            ${{ runner.temp }}/hia-p7-image-core.json
            ${{ runner.temp }}/hia-p7-image-native.json
          if-no-files-found: warn
