name: HIA ownership policy and scalar Core consistency

on:
  push:
    branches: [work/hia-unified-core-20261102, work/hia-core-proof-convergence-20261102, work/hia-seven-track-core-convergence-next]
  pull_request:
    paths:
      - 'hepta/hia_incremental.py'
      - 'hepta/hia_capability_flow.py'
      - 'hepta/hia_translation_validation.py'
      - 'hepta/hia_scalar_lowering_check.py'
      - 'hepta/hia_program_source.py'
      - 'hepta/hia_program_llvm.py'
      - 'hepta/hia_initialization.py'
      - 'tools/verify_hia_capabilities.py'
      - 'tests/test_hia_initialization*.py'
      - 'tests/test_hia_native_command_log.py'
      - 'tests/test_hia_production_capability_witness.py'
      - 'tests/test_hia_incremental_capability_policy.py'
      - 'tests/test_hia_incremental_interface_policy.py'
      - 'tests/test_hia_scalar_lowering_budget.py'
      - 'tests/test_hia_source_layout_limits.py'
      - 'tests/test_hia_translation_guard_partition.py'
      - 'tests/test_hia_scalar_boundary_conformance.py'
      - 'tests/test_hia_trial_observations.py'
      - 'tests/test_hia_three_lane_gate.py'
      - 'tools/provider_adapter/llama_cpp_engine.py'
      - 'tools/qualify_hia_three_lane.py'
      - '.github/workflows/hia-core-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-observations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HEPTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute unchanged trial observations on the real Unix socket host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir "$RUNNER_TEMP/hia-trial-observations"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            uname -a
            python --version
            sha256sum tests/test_hia_trial_observations.py tools/provider_adapter/llama_cpp_engine.py tools/qualify_hia_three_lane.py
          } > "$RUNNER_TEMP/hia-trial-observations/identity.log"
          python -B tools/qualify_hia_three_lane.py --suite trial-observations \
            --output "$RUNNER_TEMP/hia-trial-observations/result.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-trial-observations/tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-trial-observations-${{ env.HEPTA_SOURCE_SHA }}
          path: ${{ runner.temp }}/hia-trial-observations/
          if-no-files-found: error
          retention-days: 30
  core-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLANG: /usr/bin/clang-20
      CLANGXX: /usr/bin/clang++-20
      HEPTA_CLANG: /usr/bin/clang-20
      HEPTA_TEST_CLANG: /usr/bin/clang-20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the actual native compiler and pinned solver
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-20
          python -m pip install z3-solver==4.15.4.0
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup default 1.90.0
          printf 'RUSTC=%s\nCARGO=%s\n' \
            "$(rustup which --toolchain 1.90.0 rustc)" \
            "$(rustup which --toolchain 1.90.0 cargo)" >> "$GITHUB_ENV"
          printf '%s\n' /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
          cargo fetch --locked --manifest-path rust/hia-core-shadow/Cargo.toml
      - name: Check exact tests without skips and preserve source identity
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/hia-core-consistency"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            uname -a
            python --version
            rustc --version
            cargo --version
            "$CLANG" --version
            sha256sum "$(readlink -f "$CLANG")"
            python -c 'import z3; print("Z3", z3.get_version_string())'
          } > "$RUNNER_TEMP/hia-core-consistency/identity.log"
          python -B tools/qualify_hia_three_lane.py --suite core-consistency \
            --output "$RUNNER_TEMP/hia-core-consistency/result.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-core-consistency/tests.log"
      - name: Verify bounded trusted Core on the same exact source
        if: always()
        run: |
          set -euo pipefail
          python -B tools/qualify_hia_three_lane.py --suite trusted-core \
            --output "$RUNNER_TEMP/hia-core-consistency/trusted-core.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-core-consistency/trusted-core.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-core-consistency-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hia-core-consistency/
          if-no-files-found: error
          retention-days: 30
