name: Byte ABI temporary CALL lifecycle diagnostic
on:
  push:
    branches: [codex/hia-byte-call-lifetime-v78-20261112-dda7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  call-lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4b19af89a766593f7d5f1cc2db256e81aba7afcb
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Fixed component import prerequisites
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Four original CALL lifetime observations only
        run: python -B harness/inputs/run_call_diagnostic.py --source source --input harness/inputs --output call-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-byte-call-lifetime-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            call-evidence/
            harness/inputs/
          if-no-files-found: error
          include-hidden-files: true
