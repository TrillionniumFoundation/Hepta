name: HIA P0/P7 exact-source policy and native continuation convergence (research)

on:
  push:
    branches:
      - work/hia-p0-p7-policy-rebind-convergence-20261031-gpt6
  pull_request:
    paths:
      - hepta/hia_optimization.py
      - tests/test_hia_optimization.py
      - hepta/hia_continuation.py
      - hepta/hia_stateful.py
      - .github/workflows/hia-p0-p7-exact-convergence.yml
      - .github/workflows/hia-p0-optimizer-policy-admission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-policy-and-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact tested HEAD and full dual-parent source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD^{tree}
          git show --format='%P' --no-patch HEAD
          sha256sum hepta/hia_optimization.py hepta/hia_stateful.py hepta/hia_continuation.py tests/test_hia_optimization.py tests/test_hia_p7_verified_partial_rebind.py
      - name: Run negative P0 policy and P7 continuation admission without skips
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_optimization.OptimizationPolicyAdmissionTests tests.test_hia_p7_verified_partial_rebind tests.test_hia_image_token_admission tests.test_hia_queue_candidate_admission.CandidateAdmissionControls -v 2>&1 | tee "$RUNNER_TEMP/hia-p0p7-admission.log"
          if grep -qE 'skipped|expected failure|unexpected success' "$RUNNER_TEMP/hia-p0p7-admission.log"; then exit 1; fi
          python tools/generate_hia_catalog.py --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-p0p7-admission-${{ github.sha }}
          path: ${{ runner.temp }}/hia-p0p7-admission.log
          if-no-files-found: warn

  pinned-native-p0p1p5p7:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CLANG: /usr/bin/clang-20
      HEPTA_CLANG: /usr/bin/clang-20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native toolchain and optimization verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev llvm-20 lld-20 build-essential
          python -m pip install --disable-pip-version-check -e '.[optimization]' 'zstandard==0.25.0'
          test -x "$CLANG"
          python -c 'import z3; print("Z3", z3.get_version_string())'
      - name: Execute P0 proof-policy refusal and real P7 native prefix/suffix tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_optimization.OptimizationPolicyAdmissionTests tests.test_hia_p7_verified_partial_rebind tests.test_hia_continuation tests.test_hia_stateful_generation_fence tests.test_hia_image_token_admission tests.test_hia_queue_candidate_admission -v 2>&1 | tee "$RUNNER_TEMP/hia-p0p7-native.log"
          if grep -qE 'skipped|expected failure|unexpected success' "$RUNNER_TEMP/hia-p0p7-native.log"; then exit 1; fi
      - name: Independently requalify full source-bound P0/P1/P5 Core and native receipt
        shell: bash
        run: |
          set -euo pipefail
          python -B -m tools.qualify_hia_three_lane --suite core --output "$RUNNER_TEMP/hia-p0p7-core.json"
          python -B -m tools.qualify_hia_three_lane --suite native --output "$RUNNER_TEMP/hia-p0p7-native.json"
          python -B -m py_compile hepta/hia_optimization.py hepta/hia_stateful.py hepta/hia_continuation.py tests/test_hia_optimization.py tests/test_hia_p7_verified_partial_rebind.py
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-p0p7-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hia-p0p7-native.log
            ${{ runner.temp }}/hia-p0p7-core.json
            ${{ runner.temp }}/hia-p0p7-native.json
          if-no-files-found: warn
