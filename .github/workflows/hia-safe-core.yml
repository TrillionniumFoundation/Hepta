name: HIA Safe Core final image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hepta/hia_safe_core*.py'
      - 'hepta/hia_program_native.py'
      - 'hepta/hia_machine_x64.py'
      - 'hepta/hia_machine_elf.py'
      - 'hepta/hia_native_byte_abi.py'
      - 'hepta/hia_program.py'
      - 'hepta/hia_opcodes.py'
      - 'hepta/elf_shared_abi.py'
      - 'tools/build_hia_safe_core.py'
      - 'tools/qualify_hia_safe_core.py'
      - 'tests/test_hia_safe_core.py'
      - 'examples/hia_safe_core/**'
      - '.github/workflows/hia-safe-core.yml'

permissions:
  contents: read

jobs:
  selected-final-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install z3-solver==4.15.4.0
      - run: python tools/qualify_hia_safe_core.py --output "$RUNNER_TEMP/hia-safe-core"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-safe-core-final-image
          path: ${{ runner.temp }}/hia-safe-core
          if-no-files-found: error
