name: Module local binding isolation
on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/test_module_local_bindings.py'
      - 'tests/test_checker.py'
      - 'tests/test_c_backend.py'
      - 'tests/test_owned_generics.py'
      - 'tests/test_borrowed_returns.py'
      - 'tests/test_modules.py'
      - 'tests/test_cross_feature_audit.py'
      - 'tests/test_project_protocol.py'
      - 'tests/test_workspace_query_cli.py'
      - 'tools/test_module_local_bindings.py'
      - '.github/workflows/hepta-module-local-bindings.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind source and execute all binding and native integration controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          rustup toolchain install 1.90.0 --profile minimal
          export RUSTC="$(rustup which --toolchain 1.90.0 rustc)"
          export CC="$(command -v gcc)"
          command -v git
          mkdir -p artifacts/module-local-bindings
          { git rev-parse HEAD HEAD^{tree}; uname -a; python --version; \
            "$CC" --version; git --version; "$RUSTC" --version; \
            sha256sum "$CC" "$(command -v git)" "$RUSTC"; } > artifacts/module-local-bindings/identities.txt
          python -B tools/test_module_local_bindings.py 2>&1 | tee artifacts/module-local-bindings/tests.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-local-bindings-${{ matrix.os }}-${{ env.EXPECTED_HEAD }}
          path: artifacts/module-local-bindings
          if-no-files-found: error
