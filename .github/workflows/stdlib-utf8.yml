name: Runtime UTF-8 source library

on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'stdlib/utf8/**'
      - 'examples/packages/utf8_scan/**'
      - 'tests/test_stdlib_utf8.py'
      - 'tools/stdlib_utf8_oracle.py'
      - 'toolchain-lock.json'
      - '.github/workflows/stdlib-utf8.yml'
  push:
    branches: [main]
    paths:
      - 'hepta/**'
      - 'stdlib/utf8/**'
      - 'examples/packages/utf8_scan/**'
      - 'tests/test_stdlib_utf8.py'
      - 'tools/stdlib_utf8_oracle.py'
      - 'toolchain-lock.json'
      - '.github/workflows/stdlib-utf8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-utf8:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: c
            python: '3.11'
          - os: ubuntu-24.04-arm
            backend: c
            python: '3.13'
          - os: ubuntu-24.04
            backend: rust
            python: '3.13'
          - os: ubuntu-24.04-arm
            backend: rust
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HEPTA_UTF8_BACKEND: ${{ matrix.backend }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Select pinned Rust
        if: matrix.backend == 'rust'
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          echo "RUSTC=$(rustup which --toolchain 1.90.0 rustc)" >> "$GITHUB_ENV"
      - name: Record exact source and tools
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          python --version
          gcc --version
          sha256sum "$(command -v gcc)"
          if [ "$HEPTA_UTF8_BACKEND" = rust ]; then "$RUSTC" -vV; sha256sum "$RUSTC"; fi
      - name: Require complete public consumer suite
        run: |
          python - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests')
          suite = unittest.defaultTestLoader.loadTestsFromName('test_stdlib_utf8')
          assert suite.countTestCases() == 12, suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 12, result.testsRun
          assert result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          PY
      - name: Independent exhaustive native C oracle
        if: matrix.backend == 'c'
        run: python tools/stdlib_utf8_oracle.py
      - name: Require unchanged source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
