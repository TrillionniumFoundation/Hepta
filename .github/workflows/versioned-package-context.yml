name: Versioned package context C qualification

on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/VERSIONED_PACKAGE_CONTEXT_HOSTED.md'
      - '.github/workflows/versioned-package-context.yml'

permissions:
  contents: read

jobs:
  scoped-context-c:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEPTA_PACKAGE_TEST_BACKEND: c
      CC: gcc
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact head and export an isolated source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          evidence="$RUNNER_TEMP/versioned-package-context-evidence"
          snapshot="$RUNNER_TEMP/versioned-package-context-source"
          mkdir "$evidence" "$snapshot"
          {
            git rev-parse HEAD HEAD^{tree}
            printf 'backend: c\n'
            uname -a
            python --version
            gcc --version
            git --version
            sha256sum "$(command -v python)" "$(command -v gcc)" "$(command -v git)"
          } > "$evidence/identities.txt"
          git ls-tree -r HEAD > "$evidence/source-tree.txt"
          git archive --format=tar HEAD | tar -xf - -C "$snapshot"
      - name: Run the unchanged 83-method C qualifier and both scoped oracles
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B "$RUNNER_TEMP/versioned-package-context-source/tools/qualify_versioned_package_context.py" \
            2>&1 | tee "$RUNNER_TEMP/versioned-package-context-evidence/scoped.log"
      - name: Verify final checkout identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: versioned-package-context-c-${{ matrix.os }}-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/versioned-package-context-evidence
          if-no-files-found: error
