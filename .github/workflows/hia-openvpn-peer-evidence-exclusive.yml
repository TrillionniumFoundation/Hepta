name: HIA OpenVPN peer evidence exclusive-create regression (DENY_ALL)

on:
  push:
    branches:
      - research/hia-openvpn-evidence-create-excl-20261105
      - fix/openvpn-hia-hotspot-symbols-20261106-gpt6
      - fix/openvpn-hia-hotspot-test-contract-20261106-gpt6
      - fix/openvpn-hia-p2p-read-fairness-20261106-gpt6
  pull_request:
    paths:
      - .github/workflows/hia-openvpn-peer-evidence-exclusive.yml
      - experiments/openvpn_hia_20261105/target_host/dco_peer_stats.py
      - experiments/openvpn_hia_20261105/target_host/test_dco_peer_stats.py
      - experiments/openvpn_hia_20261105/target_host/test_dco_peer_stats_wire.py
      - experiments/openvpn_hia_20261105/target_host/run_matrix.py
      - experiments/openvpn_hia_20261105/target_host/test_run_matrix_rekey.py
      - experiments/openvpn_hia_20261105/target_host/test_rekey_attempt_grouping.py
      - experiments/openvpn_hia_20261105/target_host/test_profile_capture.py
      - experiments/openvpn_hia_20261105/target_host/test_matrix_evidence.py
      - experiments/openvpn_hia_20261105/target_host/verify_result.py
      - experiments/openvpn_hia_20261105/target_host/test_matrix_budget.py
      - experiments/openvpn_hia_20261105/target_host/plan.json
      - experiments/openvpn_hia_20261105/target_host/source-lock.json
      - experiments/openvpn_hia_20261105/target_host/build.py
      - experiments/openvpn_hia_20261105/target_host/patches/**
      - experiments/openvpn_hia_20261105/target_host/test_p2p_fair_dispatch_patch.py
      - experiments/openvpn_hia_20261105/target_host/verify_p2p_fair_dispatch_build.py
      - .github/workflows/hia-openvpn-fair-dispatch-build.yml
      - .github/workflows/hia-openvpn-target-host.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze exact source and run fail-closed output plus netlink regressions
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          head_record="$(printf 'HEAD=%s\n' "$(git rev-parse HEAD)")"
          test "$head_record" = "HEAD=$EXPECTED_SHA"
          printf '%s\n' "$head_record"
          sha256sum experiments/openvpn_hia_20261105/target_host/dco_peer_stats.py
          sha256sum experiments/openvpn_hia_20261105/target_host/test_dco_peer_stats.py
          sha256sum experiments/openvpn_hia_20261105/target_host/test_dco_peer_stats_wire.py
          sha256sum experiments/openvpn_hia_20261105/target_host/run_matrix.py
          sha256sum experiments/openvpn_hia_20261105/target_host/test_run_matrix_rekey.py
          sha256sum experiments/openvpn_hia_20261105/target_host/test_rekey_attempt_grouping.py
          sha256sum experiments/openvpn_hia_20261105/target_host/test_profile_capture.py
          sha256sum experiments/openvpn_hia_20261105/target_host/test_matrix_evidence.py
          sha256sum experiments/openvpn_hia_20261105/target_host/verify_result.py
          sha256sum experiments/openvpn_hia_20261105/target_host/test_matrix_budget.py
          sha256sum experiments/openvpn_hia_20261105/target_host/plan.json
          sha256sum experiments/openvpn_hia_20261105/target_host/source-lock.json
          sha256sum experiments/openvpn_hia_20261105/target_host/build.py
          sha256sum experiments/openvpn_hia_20261105/target_host/patches/0001-openvpn-p2p-dual-read-fairness.patch
          sha256sum experiments/openvpn_hia_20261105/target_host/test_p2p_fair_dispatch_patch.py
          sha256sum experiments/openvpn_hia_20261105/target_host/verify_p2p_fair_dispatch_build.py
          sha256sum .github/workflows/hia-openvpn-fair-dispatch-build.yml
          sha256sum .github/workflows/hia-openvpn-target-host.yml
          python3 -B experiments/openvpn_hia_20261105/target_host/test_dco_peer_stats.py -v
          python3 -B experiments/openvpn_hia_20261105/target_host/test_dco_peer_stats_wire.py -v
          python3 -B experiments/openvpn_hia_20261105/target_host/test_run_matrix_rekey.py -v
          python3 -B experiments/openvpn_hia_20261105/target_host/test_rekey_attempt_grouping.py -v
          python3 -B experiments/openvpn_hia_20261105/target_host/test_profile_capture.py -v
          python3 -B experiments/openvpn_hia_20261105/target_host/test_matrix_evidence.py -v
          python3 -B experiments/openvpn_hia_20261105/target_host/test_matrix_budget.py -v
          python3 -B experiments/openvpn_hia_20261105/target_host/test_p2p_fair_dispatch_patch.py -v
          test -z "$(git status --porcelain)"
