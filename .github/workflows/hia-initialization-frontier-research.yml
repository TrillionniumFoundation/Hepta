name: HIA initialization frontier research (Python only, DENY_ALL)
on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tools/check_core_syntax_lean.py'
      - 'tools/check_core_syntax_staged.py'
      - 'tools/check_core_syntax_partitioned.py'
      - 'tools/core_syntax_partition_sources.py'
      - 'tools/core_syntax_partition_diagnostic_sources.py'
      - 'tools/diagnose_core_syntax_partition.py'
      - 'tools/core_seven_certificate*.py'
      - 'tools/diagnose_core_seven_certificate.py'
      - 'tests/test_core_seven_certificate*.py'
      - 'docs/seven-certificate-first-four-diagnostic-design.md'
      - 'docs/seven-certificate-source-proposal.md'
      - 'tools/core_byte_facts_*.py'
      - 'tools/diagnose_core_byte_facts.py'
      - 'tests/test_core_byte_facts_*.py'
      - 'experiments/hia_initialization_frontiers_20261103/ByteFactsResearch.lean'
      - 'tools/diagnose_core_syntax_declarations.py'
      - 'tools/core_syntax_declaration_diagnostic_sources.py'
      - 'tools/core_syntax_diagnostic_capture.py'
      - 'tools/core_syntax_noncomputable_diagnostic_sources.py'
      - 'tools/core_syntax_stage_sources.py'
      - 'tools/core_syntax_structured_sources.py'
      - 'tools/core_syntax_structured_stages.py'
      - 'experiments/hia_initialization_frontiers_20261103/StructuredTransport.lean'
      - 'tests/test_core_syntax_*.py'
      - 'experiments/hia_initialization_frontiers_20261103/CoreSyntaxSlice.lean'
      - '.github/workflows/hia-core-syntax-kernel-research.yml'
      - 'benchmarks/hia_reduction_release/linear.hepta'
      - 'benchmarks/hia_reduction_release/affine.hepta'
      - 'tools/check_guarded_slice_lean.py'
      - 'tests/test_guarded_slice_lean.py'
      - 'experiments/hia_initialization_frontiers_20261103/GuardedUsizeSlice.lean'
      - 'tools/check_dynamic_unsigned_step.py'
      - 'tests/test_dynamic_unsigned_step.py'
      - 'experiments/hia_initialization_frontiers_20261103/UNSIGNED_STEP_CONNECTION.md'
      - 'tools/observe_single_store_projection.py'
      - 'tests/test_single_store_projection.py'
      - 'experiments/hia_initialization_frontiers_20261103/SINGLE_STORE_CONNECTION.md'
      - 'tools/extract_initialization_obligations.py'
      - 'formal/HiaInitializationPrefix.lean'
      - 'formal/toolchain-lock.json'
      - 'formal/proof-dependencies.txt'
      - 'tools/qualify_hia_initialization_prefix.py'
      - 'tools/qualify_hia_selected_formal.py'
      - 'experiments/hia_initialization_frontiers_20261103/CORE_MODEL_CONNECTION.md'
      - 'tools/check_initialization_frontiers.py'
      - 'tools/research_initialization_writes.py'
      - 'tools/prove_initialization_prefix_conditions.py'
      - 'tools/experimental_deferred_guard_proposer.py'
      - 'tools/research_deferred_guard_model.py'
      - 'tests/test_initialization_*.py'
      - 'tests/test_hia_initialization.py'
      - 'tests/test_hia_program.py'
      - '.github/workflows/hia-initialization-frontier-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and existing solver pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree}
          python -m pip install 'z3-solver==4.15.4.0'
          python -c "import z3; assert z3.get_version_string() == '4.15.4'"
      - name: Run only structural, scalar and ordinary-VM controls
        run: |
          set -euo pipefail
          timeout 180s python -B - <<'PYTEST'
          import hashlib, json, unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_core_syntax_transport',
              'tests.test_core_syntax_runner',
              'tests.test_core_syntax_staged',
              'tests.test_core_syntax_structured',
              'tests.test_guarded_slice_lean',
              'tests.test_dynamic_unsigned_step',
              'tests.test_single_store_projection',
              'tests.test_initialization_obligation_ledger',
              'tests.test_initialization_write_observer',
              'tests.test_initialization_frontier_checker',
              'tests.test_initialization_prefix_conditions',
              'tests.test_hia_initialization.InitializationCoverageTests'])
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          ids = sorted(test.id() for test in flatten(suite))
          assert len(ids) == len(set(ids)) == 207, 'test inventory changed'
          print(json.dumps({'tests': ids, 'inventory_sha256': hashlib.sha256(json.dumps(ids).encode()).hexdigest()}))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 207 and result.wasSuccessful(), 'research controls failed'
          assert not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses, 'incomplete controls'
          PYTEST
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
  declaration-diagnostic-controls:
    name: Isolated source and execution controls / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [sources, execution, noncomputable-sources, noncomputable-execution, partition-sources-a, partition-sources-b, partition-execution, partition-diagnostic-sources, partition-diagnostic-capture, partition-diagnostic-execution, byte-facts-dag, byte-facts-sources, byte-facts-diagnostic, byte-facts-execution, byte-facts-replay, seven-sources-a, seven-sources-b, seven-sources-c, seven-diagnostic, seven-execution-a, seven-execution-b, seven-execution-inverse, seven-pending-eio]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      CONTROL_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and existing solver pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'z3-solver==4.15.4.0'
          python -c "import z3; assert z3.get_version_string() == '4.15.4'"
      - name: Run bounded source and fake-child controls; never Lean
        run: |
          set -euo pipefail
          timeout 180s python -B - <<'PYDIAG'
          import hashlib, json, os, unittest
          groups = {
              'sources': (['tests.test_core_syntax_declaration_diagnostic_sources'], 16),
              'partition-sources-a': (['tests.test_core_syntax_partition_sources'], 8),
              'partition-sources-b': (['tests.test_core_syntax_partition_sources'], 8),
              'partition-diagnostic-sources': (['tests.test_core_syntax_partition_diagnostic_sources'], 9),
              'partition-diagnostic-capture': (['tests.test_core_syntax_partition_diagnostic_capture'], 5),
              'partition-diagnostic-execution': (['tests.test_core_syntax_partition_diagnostic_runner'], 16),
              'byte-facts-dag': (['tests.test_core_byte_facts_dag'], 14),
              'byte-facts-sources': (['tests.test_core_byte_facts_sources'], 21),
              'byte-facts-diagnostic': (['tests.test_core_byte_facts_diagnostic'], 12),
              'byte-facts-execution': (['tests.test_core_byte_facts_runner'], 22),
              'byte-facts-replay': (['tests.test_core_byte_facts_capture_replay'], 8),
              'seven-sources-a': (['tests.test_core_seven_certificate_sources'], 11),
              'seven-sources-b': (['tests.test_core_seven_certificate_sources'], 10),
              'seven-sources-c': (['tests.test_core_seven_certificate_sources'], 10),
              'seven-pending-eio': (['tests.test_core_seven_certificate_pending_eio'], 15),
              'seven-diagnostic': (['tests.test_core_seven_certificate_diagnostic'], 12),
              'seven-execution-a': (['tests.test_core_seven_certificate_runner'], 8),
              'seven-execution-b': (['tests.test_core_seven_certificate_runner'], 7),
              'seven-execution-inverse': (['tests.test_core_seven_certificate_runner'], 1),
              'partition-execution': (['tests.test_core_syntax_partitioned'], 12),
              'noncomputable-sources': (['tests.test_core_syntax_noncomputable_diagnostic_sources'], 16),
              'noncomputable-execution': (['tests.test_core_syntax_noncomputable_diagnostic_runner'], 8),
              'execution': (['tests.test_core_syntax_declaration_diagnostic_runner',
                             'tests.test_core_syntax_diagnostic_capture'], 42),
          }
          def flatten(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          inventories = {}
          suites = {}
          for group, (names, expected) in groups.items():
              cases = sorted(flatten(unittest.defaultTestLoader.loadTestsFromNames(names)), key=lambda case: case.id())
              if group.startswith(('partition-sources-', 'seven-sources-', 'seven-execution-')):
                  complete_expected = 31 if group.startswith('seven-sources-') else 16
                  assert len(cases) == len({case.id() for case in cases}) == complete_expected, 'complete split inventory changed'
                  if group.startswith('partition-sources-'):
                      start = 0 if group.endswith('-a') else 8
                      cases = cases[start:start + 8]
                  elif group.startswith('seven-sources-'):
                      cases = cases['abc'.index(group[-1])::3]
                  else:
                      inverse_id = 'tests.test_core_seven_certificate_runner.SevenRunnerTests.test_full_inverse_replay_integration'
                      inverse = [case for case in cases if case.id() == inverse_id]
                      ordinary = [case for case in cases if case.id() != inverse_id]
                      assert len(inverse) == 1 and len(ordinary) == 15, 'runner split inventory changed'
                      # Preserve full truthful IDs; the indivisible full inverse runs alone.
                      cases = inverse if group.endswith('-inverse') else ordinary[0 if group.endswith('-a') else 1::2]
              ids = [case.id() for case in cases]
              assert len(ids) == len(set(ids)) == expected, 'isolated test inventory changed: ' + group
              inventories[group] = ids
              suites[group] = unittest.TestSuite(cases)
          all_ids = [test_id for ids in inventories.values() for test_id in ids]
          all_names = sorted({name for names, _ in groups.values() for name in names})
          complete_ids = [case.id() for case in flatten(unittest.defaultTestLoader.loadTestsFromNames(all_names))]
          assert len(all_ids) == len(set(all_ids)) == len(complete_ids) == 291, 'combined inventory changed'
          assert set(all_ids) == set(complete_ids), 'split omitted or duplicated controls'
          group = os.environ['CONTROL_GROUP']
          ids, suite = inventories[group], suites[group]
          expected = groups[group][1]
          print(json.dumps({'group': group, 'count': len(ids), 'tests': ids,
                            'inventory_sha256': hashlib.sha256('\n'.join(ids).encode()).hexdigest()}), flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == expected and result.wasSuccessful(), 'isolated controls failed'
          assert not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          PYDIAG
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
