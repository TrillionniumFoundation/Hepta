        with:
          python-version: '3.12'
      - name: Keep the exact source and solver pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'z3-solver==4.15.4.0'
          python -c "import z3,sys; sys.exit(0 if z3.get_version_string() == '4.15.4' else 1)"
      - name: Keep new closure controls separate from historical inventories
        run: |
          set -euo pipefail
          timeout 60s python -B - <<'PY'
          import json, sys, unittest
          names = [
              'test_complete_reviewed_closure_retains_every_prior_path',
              'test_duplicate_declared_filename_is_refused',
              'test_each_new_compiler_module_is_required',
              'test_extra_actual_compiler_filename_is_refused',
              'test_unreviewed_declared_filename_is_refused',
