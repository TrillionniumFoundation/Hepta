name: HIA initialization frontier research (Python only, DENY_ALL)
on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tools/check_core_syntax_lean.py'
      - 'tools/check_core_syntax_staged.py'
      - 'tools/check_core_syntax_partitioned.py'
