                  inverse_id = 'tests.test_core_seven_part04_runner.Part04RunnerTests.test_full_inverse_replay_integration'
                  inverse = [case for case in cases if case.id() == inverse_id]
                  ordinary = [case for case in cases if case.id() != inverse_id]
                  assert len(inverse) == 1 and len(ordinary) == 16, 'Part04 runner split inventory changed'
                  cases = inverse if group.endswith('-inverse') else ordinary[0 if group.endswith('-a') else 1::2]
              if group.startswith('relocation-runner-'):
                  assert len(cases) == len({case.id() for case in cases}) == 23, 'complete relocation runner inventory changed'
                  inverse_id = 'tests.test_core_seven_relocation_runner.Part04RunnerTests.test_full_inverse_replay_integration'
                  inverse = [case for case in cases if case.id() == inverse_id]
                  ordinary = [case for case in cases if case.id() != inverse_id]
                  assert len(inverse) == 1 and len(ordinary) == 22, 'relocation runner split inventory changed'
                  cases = inverse if group.endswith('-inverse') else ordinary[0 if group.endswith('-a') else 1::2]
              ids = [case.id() for case in cases]
              assert len(ids) == len(set(ids)) == expected, 'isolated test inventory changed: ' + group
              inventories[group] = ids
              suites[group] = unittest.TestSuite(cases)
          all_ids = [test_id for ids in inventories.values() for test_id in ids]
          all_names = sorted({name for names, _ in groups.values() for name in names})
          complete_ids = [case.id() for case in flatten(unittest.defaultTestLoader.loadTestsFromNames(all_names))]
          assert len(all_ids) == len(set(all_ids)) == len(complete_ids) == 712, 'combined inventory changed'
          assert set(all_ids) == set(complete_ids), 'split omitted or duplicated controls'
          acceptance_ids = [case.id() for case in flatten(unittest.defaultTestLoader.loadTestsFromName('tests.test_core_seven_acceptance'))]
          assigned_acceptance_ids = [test_id for group, ids in inventories.items() if group.startswith('seven-acceptance-') for test_id in ids]
          assert len(acceptance_ids) == len(set(acceptance_ids)) == len(assigned_acceptance_ids) == len(set(assigned_acceptance_ids)) == 140, 'complete acceptance inventory changed'
          assert set(acceptance_ids) == set(assigned_acceptance_ids), 'acceptance shards omitted or duplicated controls'
          part04_names = ['tests.test_core_seven_part04_sources', 'tests.test_core_seven_part04_capture', 'tests.test_core_seven_part04_runner']
          part04_ids = [case.id() for case in flatten(unittest.defaultTestLoader.loadTestsFromNames(part04_names))]
          assigned_part04_ids = [test_id for group, ids in inventories.items() if group.startswith('part04-') for test_id in ids]
          assert len(part04_ids) == len(set(part04_ids)) == len(assigned_part04_ids) == len(set(assigned_part04_ids)) == 73, 'complete Part04 inventory changed'
          assert set(part04_ids) == set(assigned_part04_ids), 'Part04 shards omitted or duplicated controls'
          legacy_ids = [test_id for group, ids in inventories.items() if not group.startswith(('relocation-', 'full-relocation-acceptance-')) for test_id in ids]
          assert len(legacy_ids) == len(set(legacy_ids)) == 504, 'all prior isolated controls must remain assigned once'
          relocation_names = ['tests.test_core_seven_parallel_relocation_sources', 'tests.test_core_seven_relocation_sources', 'tests.test_core_seven_relocation_runner']
          relocation_ids = [case.id() for case in flatten(unittest.defaultTestLoader.loadTestsFromNames(relocation_names))]
          assigned_relocation_ids = [test_id for group, ids in inventories.items() if group.startswith('relocation-') for test_id in ids]
          assert len(relocation_ids) == len(set(relocation_ids)) == len(assigned_relocation_ids) == len(set(assigned_relocation_ids)) == 68, 'complete relocation inventory changed'
          assert set(relocation_ids) == set(assigned_relocation_ids), 'relocation shards omitted or duplicated controls'
          full_relocation_ids = [case.id() for case in flatten(unittest.defaultTestLoader.loadTestsFromName('tests.test_core_seven_relocation_acceptance'))]
          assigned_full_relocation_ids = [test_id for group, ids in inventories.items() if group.startswith('full-relocation-acceptance-') for test_id in ids]
          assert len(full_relocation_ids) == len(set(full_relocation_ids)) == len(assigned_full_relocation_ids) == len(set(assigned_full_relocation_ids)) == 140, 'complete full relocation acceptance inventory changed'
          assert set(full_relocation_ids) == set(assigned_full_relocation_ids), 'full relocation acceptance shards omitted or duplicated controls'
          old_ids = [test_id for group, ids in inventories.items() if not group.startswith('full-relocation-acceptance-') for test_id in ids]
          assert len(old_ids) == len(set(old_ids)) == 572, 'all prior isolated controls retained once'
          # The deadline controls run in their own job, but must remain disjoint
          # from all 712 source and fake-child controls above.
          deadline_ids = [case.id() for case in flatten(unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_core_seven_part04_deadlines', 'tests.test_core_seven_relocation_timeout']))]
          assert not unittest.defaultTestLoader.errors, 'deadline test loading failed'
          assert len(deadline_ids) == len(set(deadline_ids)) == 11, 'deadline control inventory changed'
          assert not set(all_ids).intersection(deadline_ids), 'deadline controls assigned twice'
          assert len(set(all_ids).union(deadline_ids)) == 723, 'integrated control inventory changed'
          group = os.environ['CONTROL_GROUP']
          ids, suite = inventories[group], suites[group]
          expected = groups[group][1]
          print(json.dumps({'group': group, 'count': len(ids), 'tests': ids,
                            'inventory_sha256': hashlib.sha256('\n'.join(ids).encode()).hexdigest()}), flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == expected and result.wasSuccessful(), 'isolated controls failed'
          assert not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          PYDIAG
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

  fixed-source-closure-controls:
    name: Exact compiler source closure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
