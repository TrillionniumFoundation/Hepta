      - 'tools/extract_initialization_obligations.py'
      - 'formal/HiaInitializationPrefix.lean'
      - 'formal/toolchain-lock.json'
      - 'formal/proof-dependencies.txt'
      - 'tools/qualify_hia_initialization_prefix.py'
      - 'tools/qualify_hia_selected_formal.py'
      - 'experiments/hia_initialization_frontiers_20261103/CORE_MODEL_CONNECTION.md'
      - 'tools/check_initialization_frontiers.py'
      - 'tools/research_initialization_writes.py'
      - 'tools/prove_initialization_prefix_conditions.py'
      - 'tools/experimental_deferred_guard_proposer.py'
      - 'tools/research_deferred_guard_model.py'
      - 'tests/test_initialization_*.py'
      - 'tests/test_hia_initialization.py'
      - 'tests/test_hia_program.py'
      - '.github/workflows/hia-initialization-frontier-research.yml'
permissions:
  contents: read
jobs:
  python-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and existing solver pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree}
          python -m pip install 'z3-solver==4.15.4.0'
          python -c "import z3; assert z3.get_version_string() == '4.15.4'"
      - name: Run only structural, scalar and ordinary-VM controls
        run: |
          set -euo pipefail
          timeout 180s python -B - <<'PYTEST'
          import hashlib, json, unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_core_syntax_transport',
              'tests.test_core_syntax_runner',
              'tests.test_core_syntax_staged',
              'tests.test_core_syntax_structured',
              'tests.test_guarded_slice_lean',
              'tests.test_dynamic_unsigned_step',
              'tests.test_single_store_projection',
              'tests.test_initialization_obligation_ledger',
              'tests.test_initialization_write_observer',
              'tests.test_initialization_frontier_checker',
              'tests.test_initialization_prefix_conditions',
              'tests.test_hia_initialization.InitializationCoverageTests'])
          if unittest.defaultTestLoader.errors:
              print(json.dumps({'loader_errors': unittest.defaultTestLoader.errors}), flush=True)
          assert not unittest.defaultTestLoader.errors, 'ordinary test loading failed'
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          ids = sorted(test.id() for test in flatten(suite))
          assert len(ids) == len(set(ids)) == 207, 'test inventory changed'
          print(json.dumps({'tests': ids, 'inventory_sha256': hashlib.sha256(json.dumps(ids).encode()).hexdigest()}))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 207 and result.wasSuccessful(), 'research controls failed'
          assert not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses, 'incomplete controls'
          PYTEST
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
  declaration-diagnostic-controls:
    name: Isolated source and execution controls / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [sources, execution, noncomputable-sources, noncomputable-execution, partition-sources-a, partition-sources-b, partition-execution, partition-diagnostic-sources, partition-diagnostic-capture, partition-diagnostic-execution, byte-facts-dag, byte-facts-sources, byte-facts-diagnostic, byte-facts-execution, byte-facts-replay, seven-sources-a, seven-sources-b, seven-sources-c, seven-diagnostic, seven-execution-a, seven-execution-b, seven-execution-inverse, seven-pending-eio, seven-acceptance-fast, seven-acceptance-records, seven-acceptance-record_types, seven-acceptance-full_eleven, seven-acceptance-fail_every_stage, seven-acceptance-adversary_provenance_finalization, seven-acceptance-write_faults, seven-acceptance-fsync_faults, seven-acceptance-reread_faults, seven-acceptance-review_boundaries_shadows, seven-acceptance-negative_pair_1, seven-acceptance-negative_pair_2, seven-acceptance-negative_pair_3, seven-acceptance-negative_pair_4, seven-acceptance-negative_pair_5, part04-sources, part04-capture, part04-grammar, part04-runner-a, part04-runner-b, part04-runner-inverse, relocation-proposal, relocation-sources, relocation-grammar, relocation-runner-a, relocation-runner-b, relocation-runner-inverse, full-relocation-acceptance-fast, full-relocation-acceptance-records, full-relocation-acceptance-record_types, full-relocation-acceptance-full_eleven, full-relocation-acceptance-runner, full-relocation-acceptance-provenance_shadows, full-relocation-acceptance-final_replay, full-relocation-acceptance-clock_replay, full-relocation-acceptance-writes_faults, full-relocation-acceptance-fsyncs_faults, full-relocation-acceptance-rereads_faults, full-relocation-acceptance-negative_byte_modulo_alias, full-relocation-acceptance-negative_changed_exact_byte, full-relocation-acceptance-negative_duplicate_keys, full-relocation-acceptance-negative_leading_zero, full-relocation-acceptance-negative_literal_two, full-relocation-acceptance-negative_stale_descriptor, full-relocation-acceptance-negative_unordered_keys, full-relocation-acceptance-negative_wrong_arm_implementation, full-relocation-acceptance-negative_wrong_condition, full-relocation-acceptance-negative_wrong_phi, full-relocation-acceptance-source_contract, full-relocation-acceptance-protocols, full-relocation-acceptance-retained_source]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      CONTROL_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and existing solver pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'z3-solver==4.15.4.0'
          python -c "import z3; assert z3.get_version_string() == '4.15.4'"
      - name: Run bounded source and fake-child controls; never Lean
        run: |
          set -euo pipefail
          timeout 180s python -B - <<'PYDIAG'
          import hashlib, json, os, unittest
          groups = {
              'sources': (['tests.test_core_syntax_declaration_diagnostic_sources'], 16),
              'partition-sources-a': (['tests.test_core_syntax_partition_sources'], 8),
              'partition-sources-b': (['tests.test_core_syntax_partition_sources'], 8),
              'partition-diagnostic-sources': (['tests.test_core_syntax_partition_diagnostic_sources'], 9),
              'partition-diagnostic-capture': (['tests.test_core_syntax_partition_diagnostic_capture'], 5),
              'partition-diagnostic-execution': (['tests.test_core_syntax_partition_diagnostic_runner'], 16),
              'byte-facts-dag': (['tests.test_core_byte_facts_dag'], 14),
              'byte-facts-sources': (['tests.test_core_byte_facts_sources'], 21),
              'byte-facts-diagnostic': (['tests.test_core_byte_facts_diagnostic'], 12),
              'byte-facts-execution': (['tests.test_core_byte_facts_runner'], 22),
              'byte-facts-replay': (['tests.test_core_byte_facts_capture_replay'], 8),
              'seven-sources-a': (['tests.test_core_seven_certificate_sources'], 11),
              'seven-sources-b': (['tests.test_core_seven_certificate_sources'], 10),
              'seven-sources-c': (['tests.test_core_seven_certificate_sources'], 10),
              'seven-pending-eio': (['tests.test_core_seven_certificate_pending_eio'], 15),
              'seven-diagnostic': (['tests.test_core_seven_certificate_diagnostic'], 12),
              'seven-execution-a': (['tests.test_core_seven_certificate_runner'], 8),
              'seven-execution-b': (['tests.test_core_seven_certificate_runner'], 7),
              'seven-execution-inverse': (['tests.test_core_seven_certificate_runner'], 1),
              'partition-execution': (['tests.test_core_syntax_partitioned'], 12),
              'noncomputable-sources': (['tests.test_core_syntax_noncomputable_diagnostic_sources'], 16),
              'noncomputable-execution': (['tests.test_core_syntax_noncomputable_diagnostic_runner'], 8),
              'execution': (['tests.test_core_syntax_declaration_diagnostic_runner',
                             'tests.test_core_syntax_diagnostic_capture'], 42),
              'relocation-proposal': (['tests.test_core_seven_parallel_relocation_sources'], 23),
              'relocation-sources': (['tests.test_core_seven_relocation_sources'], 12),
              'relocation-grammar': (['tests.test_core_seven_relocation_runner.Part04ReplayGrammarTests', 'tests.test_core_seven_relocation_runner.RelocationNumericBoundsTests'], 10),
              'relocation-runner-a': (['tests.test_core_seven_relocation_runner.Part04RunnerTests'], 11),
              'relocation-runner-b': (['tests.test_core_seven_relocation_runner.Part04RunnerTests'], 11),
              'relocation-runner-inverse': (['tests.test_core_seven_relocation_runner.Part04RunnerTests'], 1),
              'part04-sources': (['tests.test_core_seven_part04_sources'], 9),
              'part04-capture': (['tests.test_core_seven_part04_capture'], 41),
              'part04-grammar': (['tests.test_core_seven_part04_runner.Part04ReplayGrammarTests'], 6),
              'part04-runner-a': (['tests.test_core_seven_part04_runner.Part04RunnerTests'], 8),
              'part04-runner-b': (['tests.test_core_seven_part04_runner.Part04RunnerTests'], 8),
              'part04-runner-inverse': (['tests.test_core_seven_part04_runner.Part04RunnerTests'], 1),
              'seven-acceptance-fast': ([
                  'tests.test_core_seven_acceptance.SchemaTests',
                  'tests.test_core_seven_acceptance.FilesystemTests',
                  'tests.test_core_seven_acceptance.CaptureTests',
                  'tests.test_core_seven_acceptance.ClockTests',
                  'tests.test_core_seven_acceptance.LaunchTests',
                  'tests.test_core_seven_acceptance.TransitionTests',
                  'tests.test_core_seven_acceptance.VerifiedDisplayTests',
                  'tests.test_core_seven_acceptance.ReceiptBoundaryTests',
                  'tests.test_core_seven_acceptance.OwnedProcessIdentityTests.test_actual_child_self_identity_matches_the_shared_authentication',
                  'tests.test_core_seven_acceptance.OwnedProcessIdentityTests.test_mismatched_pidfd_namespace_cannot_use_a_guessed_proc_pid',
                  'tests.test_core_seven_acceptance.OwnedProcessIdentityTests.test_inconsistent_procfs_session_cannot_attest_child_identity',
                  'tests.test_core_seven_acceptance.OwnedProcessIdentityTests.test_unavailable_pidfd_never_falls_back_to_numeric_proc_path',
              ], 112),
              'seven-acceptance-records': (['tests.test_core_seven_acceptance.RecordAndSizingTests.test_all_failed_stage_codes_and_fields', 'tests.test_core_seven_acceptance.RecordAndSizingTests.test_every_nested_identity_plan_run_field', 'tests.test_core_seven_acceptance.RecordAndSizingTests.test_exact_approved_serialized_reserve'], 3),
              'seven-acceptance-record_types': (['tests.test_core_seven_acceptance.RecordAndSizingTests.test_every_nested_wrong_type_unknown_and_numeric_bounds'], 1),
              'seven-acceptance-full_eleven': (['tests.test_core_seven_acceptance.FullRunTests'], 1),
              'seven-acceptance-fail_every_stage': (['tests.test_core_seven_acceptance.RunnerAdversaryTests.test_failure_at_each_of_eleven_stages'], 1),
              'seven-acceptance-adversary_provenance_finalization': (['tests.test_core_seven_acceptance.RunnerAdversaryTests.test_bad_capture_inventory_source_module', 'tests.test_core_seven_acceptance.RunnerAdversaryTests.test_deadline_after_expensive_prelaunch_checks', 'tests.test_core_seven_acceptance.RunnerAdversaryTests.test_stale_root_and_symlink', 'tests.test_core_seven_acceptance.ProvenanceTests', 'tests.test_core_seven_acceptance.FinalReplayFailureTests'], 6),
              'seven-acceptance-write_faults': (['tests.test_core_seven_acceptance.ReceiptTransactionTests.test_all_writes_fail_closed'], 1),
              'seven-acceptance-fsync_faults': (['tests.test_core_seven_acceptance.ReceiptTransactionTests.test_all_fsyncs_fail_closed'], 1),
              'seven-acceptance-reread_faults': (['tests.test_core_seven_acceptance.ReceiptTransactionTests.test_all_rereads_fail_closed'], 1),
              'seven-acceptance-review_boundaries_shadows': (['tests.test_core_seven_acceptance.SupportShadowTests', 'tests.test_core_seven_acceptance.BoundaryReplayTests'], 3),
              'seven-acceptance-negative_pair_1': (['tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_byte_modulo_alias', 'tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_changed_exact_byte'], 2),
              'seven-acceptance-negative_pair_2': (['tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_duplicate_keys', 'tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_leading_zero'], 2),
              'seven-acceptance-negative_pair_3': (['tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_literal_two', 'tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_stale_descriptor'], 2),
              'seven-acceptance-negative_pair_4': (['tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_unordered_keys', 'tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_wrong_arm_implementation'], 2),
              'seven-acceptance-negative_pair_5': (['tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_wrong_condition', 'tests.test_core_seven_acceptance.NegativeMutationTests.test_exact_negation_wrong_phi'], 2),
              'full-relocation-acceptance-fast': (['tests.test_core_seven_relocation_acceptance.SchemaTests', 'tests.test_core_seven_relocation_acceptance.FilesystemTests', 'tests.test_core_seven_relocation_acceptance.CaptureTests', 'tests.test_core_seven_relocation_acceptance.ClockTests', 'tests.test_core_seven_relocation_acceptance.LaunchTests', 'tests.test_core_seven_relocation_acceptance.TransitionTests', 'tests.test_core_seven_relocation_acceptance.VerifiedDisplayTests', 'tests.test_core_seven_relocation_acceptance.ReceiptBoundaryTests'], 108),
              'full-relocation-acceptance-records': (['tests.test_core_seven_relocation_acceptance.RecordAndSizingTests.test_all_failed_stage_codes_and_fields', 'tests.test_core_seven_relocation_acceptance.RecordAndSizingTests.test_every_nested_identity_plan_run_field', 'tests.test_core_seven_relocation_acceptance.RecordAndSizingTests.test_exact_approved_serialized_reserve'], 3),
              'full-relocation-acceptance-record_types': (['tests.test_core_seven_relocation_acceptance.RecordAndSizingTests.test_every_nested_wrong_type_unknown_and_numeric_bounds'], 1),
              'full-relocation-acceptance-full_eleven': (['tests.test_core_seven_relocation_acceptance.FullRunTests'], 1),
              'full-relocation-acceptance-runner': (['tests.test_core_seven_relocation_acceptance.RunnerAdversaryTests'], 4),
              'full-relocation-acceptance-provenance_shadows': (['tests.test_core_seven_relocation_acceptance.ProvenanceTests', 'tests.test_core_seven_relocation_acceptance.SupportShadowTests'], 4),
              'full-relocation-acceptance-final_replay': (['tests.test_core_seven_relocation_acceptance.FinalReplayFailureTests'], 1),
              'full-relocation-acceptance-clock_replay': (['tests.test_core_seven_relocation_acceptance.BoundaryReplayTests'], 1),
              'full-relocation-acceptance-writes_faults': (['tests.test_core_seven_relocation_acceptance.ReceiptTransactionTests.test_all_writes_fail_closed'], 1),
              'full-relocation-acceptance-fsyncs_faults': (['tests.test_core_seven_relocation_acceptance.ReceiptTransactionTests.test_all_fsyncs_fail_closed'], 1),
              'full-relocation-acceptance-rereads_faults': (['tests.test_core_seven_relocation_acceptance.ReceiptTransactionTests.test_all_rereads_fail_closed'], 1),
              'full-relocation-acceptance-negative_byte_modulo_alias': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_byte_modulo_alias'], 1),
              'full-relocation-acceptance-negative_changed_exact_byte': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_changed_exact_byte'], 1),
              'full-relocation-acceptance-negative_duplicate_keys': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_duplicate_keys'], 1),
              'full-relocation-acceptance-negative_leading_zero': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_leading_zero'], 1),
              'full-relocation-acceptance-negative_literal_two': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_literal_two'], 1),
              'full-relocation-acceptance-negative_stale_descriptor': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_stale_descriptor'], 1),
              'full-relocation-acceptance-negative_unordered_keys': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_unordered_keys'], 1),
              'full-relocation-acceptance-negative_wrong_arm_implementation': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_wrong_arm_implementation'], 1),
              'full-relocation-acceptance-negative_wrong_condition': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_wrong_condition'], 1),
              'full-relocation-acceptance-negative_wrong_phi': (['tests.test_core_seven_relocation_acceptance.NegativeMutationTests.test_exact_negation_wrong_phi'], 1),
              'full-relocation-acceptance-source_contract': (['tests.test_core_seven_relocation_acceptance.RelocationBoundaryTests.test_exact_protocol_identity_and_actual_inputs'], 1),
