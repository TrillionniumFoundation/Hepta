          expected = sorted('tests.test_core_seven_shared_source_closure.FixedCompilerSourceClosureTests.' + name for name in names)
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName('tests.test_core_seven_shared_source_closure')
          def flatten(items):
              for item in items:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item.id()
          actual = sorted(flatten(suite))
          print(json.dumps({'expected': expected, 'actual': actual, 'loader_errors': loader.errors}))
          if sys.flags.optimize or loader.errors or actual != expected:
              raise SystemExit('fixed source closure control inventory changed')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 5 or not result.wasSuccessful() or result.skipped
