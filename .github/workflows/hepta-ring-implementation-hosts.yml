name: HIA implementation-change native hosts

on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/test_c_inline_record_views.py'
      - 'tests/test_ring_implementation_cycle.py'
      - 'tests/fixtures/c_migration/ring_buffer_implementation_history/**'
      - 'tools/migrate_c_inline_record_project.py'
      - 'tools/qualify_ring_implementation_cycle.py'
      - 'tools/fixtures/ring_inline_host.c'
      - 'experiments/ring_implementation_cycle/**'
      - '.github/workflows/hepta-ring-implementation-hosts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  actual-native-host:
    name: ${{ matrix.machine }} implementation maintenance and OS descriptors
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            machine: x86_64
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            machine: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HEPTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      CLANG: /usr/bin/clang-20
      HEPTA_CLANG: /usr/bin/clang-20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source and install the signed native LLVM profile
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/ring-implementation-evidence"
          python -m pip install -e .
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          hepta_llvm_fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$hepta_llvm_fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-llvm.asc" /usr/share/keyrings/hepta-llvm.asc
          printf '%s\n' 'deb [arch=${{ matrix.deb_arch }} signed-by=/usr/share/keyrings/hepta-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-llvm20.list
          sudo apt-get update
          sudo apt-get install --yes clang-20 libclang-20-dev llvm-20 lld-20 build-essential
          printf '%s\n' /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
      - name: Record the actual default driver and selected linker identity
        shell: bash
        run: |
          python - <<'PYCODE'
          from hashlib import sha256
          import json, os, shutil, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'ring-implementation-evidence'
          selected = subprocess.check_output(['gcc', '-print-prog-name=ld'], text=True).strip()
          resolved = Path(shutil.which(selected) or selected).resolve(strict=True)
          driver = subprocess.run(['gcc', '-v'], capture_output=True, text=True, check=True)
          linker = subprocess.run([str(resolved), '--version'], capture_output=True, text=True, check=True)
          probe_argv = ['gcc', '-v', '-x', 'c', '-', '-o', str(out / 'default-link-probe')]
          probe = subprocess.run(probe_argv, input='int main(void) { return 0; }\n',
                                 capture_output=True, text=True, check=True)
          (out / 'default-link-probe.stdout').write_text(probe.stdout)
          (out / 'default-link-probe.stderr').write_text(probe.stderr)
          receipt = {'source': os.environ['HEPTA_SOURCE_SHA'], 'selected': selected,
                     'resolved': str(resolved), 'sha256': sha256(resolved.read_bytes()).hexdigest(),
                     'driver_version': driver.stdout + driver.stderr,
                     'linker_version': linker.stdout + linker.stderr, 'probe_argv': probe_argv,
                     'probe_returncode': probe.returncode,
                     'scope': 'GCC default linker identity and actual verbose probe; original build argv retained separately; no syscall trace or verified backend claim.'}
          (out / 'LINKER_IDENTITY.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE
      - name: Require actual native adapter controls without skipped tests
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, unittest
          from pathlib import Path
          assert platform.machine() == '${{ matrix.machine }}'
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_c_inline_record_views', 'tests.test_ring_implementation_cycle'])
          count = suite.countTestCases()
          out = Path(os.environ['RUNNER_TEMP']) / 'ring-implementation-evidence'
          with (out / 'tests.log').open('w') as log:
              result = unittest.TextTestRunner(stream=log, verbosity=2).run(suite)
          passed = (count > 0 and result.testsRun == count and result.wasSuccessful()
                    and not result.skipped and not result.expectedFailures)
          receipt = {'source': os.environ['HEPTA_SOURCE_SHA'], 'native_machine': platform.machine(),
                     'tests_run': result.testsRun, 'failures': len(result.failures),
                     'errors': len(result.errors), 'skipped': len(result.skipped), 'passed': passed}
          (out / 'UNIT_RESULT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt)); raise SystemExit(0 if passed else 1)
          PY
      - name: Execute the complete implementation upgrade and real host profiles
        shell: bash
        run: |
          python tools/qualify_ring_implementation_cycle.py \
            --output "$RUNNER_TEMP/ring-implementation-evidence/formal" \
            --source-sha "$HEPTA_SOURCE_SHA" --native-host '${{ matrix.machine }}' \
            --clang "$CLANG" --cc gcc
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ring-implementation-evidence/formal/RESULT.json').read_text())
          assert r['ok'] and not r['development']
          assert r['source_sha'] == os.environ['HEPTA_SOURCE_SHA']
          PY
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain actual native successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-ring-implementation-${{ matrix.machine }}-${{ env.HEPTA_SOURCE_SHA }}
          path: ${{ runner.temp }}/ring-implementation-evidence
          if-no-files-found: error
          include-hidden-files: true
