name: HCSN P2 single-read input exact-head (DENY_ALL)
on:
  push:
    branches:
      - fix/hcsn-p2-single-read-input-20261106-gpt6
  pull_request:
    branches:
      - fix/hcsn-p2-signed-zero-20261106-gpt6
permissions:
  contents: read
jobs:
  input-snapshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run exact-source P2 negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          node --test research/hcsn/test_p2_exact_occupancy_reference.mjs research/hcsn/test_p2_config_contract.mjs research/hcsn/test_p2_signed_zero_reference.mjs research/hcsn/test_p2_input_snapshot.mjs
