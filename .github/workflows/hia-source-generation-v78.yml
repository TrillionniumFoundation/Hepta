name: HIA v78 authentic joint source generation EOF repair

"on":
  push:
    branches:
      - codex/hia-joint-source-generation-v78-r2-20261112-dda7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CANDIDATE_SHA: 4b19af89a766593f7d5f1cc2db256e81aba7afcb
      CANDIDATE_TREE: 1bc7c90996e1910ad66ba771b0bfee1d5bfa655c
      OVERLAY_SHA256: 154c049816899fdc9e445162b3086b325da88bde66cb8a5d830e5c2176634453
    steps:
      - name: Check out independent minimal harness
        id: harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - name: Check out complete exact 4b product source
        id: candidate
        uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 4b19af89a766593f7d5f1cc2db256e81aba7afcb
          path: source
          persist-credentials: false
          fetch-depth: 2
      - name: Set up exact source-harness Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Materialize the exact compressed source overlay
        shell: bash
        run: |
          set -eu
          python -B - <<'PYOVERLAY76'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'harness' / 'overlay'
          wrapper = json.loads((root / 'source-overlay.wrapper.json').read_bytes())
          if wrapper.get('schema') != 'hia.source-overlay-zlib-wrapper.v1':
              raise ValueError('unexpected overlay wrapper')
          compressed = base64.b64decode(wrapper['data'], validate=True)
          if len(compressed) != wrapper['compressed_bytes'] or hashlib.sha256(compressed).hexdigest() != wrapper['compressed_sha256']:
              raise ValueError('compressed overlay bytes differ')
          raw = zlib.decompress(compressed)
          if len(raw) != wrapper['bytes'] or hashlib.sha256(raw).hexdigest() != os.environ['OVERLAY_SHA256']:
              raise ValueError('uncompressed exact overlay identity differs')
          with (root / 'source-overlay.json').open('xb') as stream:
              stream.write(raw)
          if (root / 'source-overlay.json').read_bytes() != raw:
              raise ValueError('overlay publication readback differs')
          print(json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'qualification_claimed':False}))
          PYOVERLAY76
      - name: Generate real sources and run complete source controls
        id: driver
        shell: bash
        run: |
          set -u
          set +e
          set -o pipefail
          python -B harness/tools/hia_source_integration_v78.py \
            --source "$GITHUB_WORKSPACE/source" \
            --expected-commit "$CANDIDATE_SHA" \
            --expected-tree "$CANDIDATE_TREE" \
            --overlay "$GITHUB_WORKSPACE/harness/overlay/source-overlay.json" \
            --overlay-sha256 "$OVERLAY_SHA256" \
            --output "$GITHUB_WORKSPACE/hia-source-v78-evidence" \
            --install-dependencies \
            2>"$GITHUB_WORKSPACE/hia-source-v78-driver.stderr" \
            | tee "$GITHUB_WORKSPACE/hia-source-v78-driver.stdout"
          hia_v78_driver_status=$?
          cat "$GITHUB_WORKSPACE/hia-source-v78-driver.stderr" >&2
          exit "$hia_v78_driver_status"
      - name: Export lossless source packet and complete raw evidence
        id: export
        if: always()
        shell: bash
        env:
          HIA_HARNESS_CHECKOUT_OUTCOME: ${{ steps.harness.outcome }}
          HIA_SOURCE_CHECKOUT_OUTCOME: ${{ steps.candidate.outcome }}
          HIA_PYTHON_SETUP_OUTCOME: ${{ steps.python.outcome }}
          HIA_DRIVER_OUTCOME: ${{ steps.driver.outcome }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/hia-source-v78-evidence"
          for hia_v78_stream in stdout stderr; do
            hia_v78_log="$GITHUB_WORKSPACE/hia-source-v78-driver.$hia_v78_stream"
            if test -f "$hia_v78_log"; then
              cp "$hia_v78_log" "$GITHUB_WORKSPACE/hia-source-v78-evidence/driver-launch.$hia_v78_stream"
            fi
          done
          set +e
          python -B harness/tools/hia_source_integration_v78.py \
            --source "$GITHUB_WORKSPACE/source" \
            --expected-commit "$CANDIDATE_SHA" \
            --expected-tree "$CANDIDATE_TREE" \
            --overlay "$GITHUB_WORKSPACE/harness/overlay/source-overlay.json" \
            --overlay-sha256 "$OVERLAY_SHA256" \
            --output "$GITHUB_WORKSPACE/hia-source-v78-evidence" \
            --export-only
          hia_v78_export_status=$?
          set -e
          if test "$hia_v78_export_status" -ne 0; then
            python -B - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import zipfile
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "hia-source-v78-evidence"
          root.mkdir(parents=True, exist_ok=True)
          result = {
              "schema": "hepta.hia.source-exporter-failure.v78",
              "status": "EXPORTER_FAILED_OR_COULD_NOT_START",
              "qualification_claimed": False,
              "workflow_outcomes": {key: os.environ.get(key) for key in (
                  "HIA_HARNESS_CHECKOUT_OUTCOME", "HIA_SOURCE_CHECKOUT_OUTCOME",
                  "HIA_PYTHON_SETUP_OUTCOME", "HIA_DRIVER_OUTCOME")},
          }
          path = root / "EXPORTER-FAILURE.json"
          path.write_text(json.dumps(result, indent=2) + "\n")
          members = [p for p in sorted(root.rglob("*")) if p.is_file() and not p.is_symlink()]
          archive = root / "FALLBACK-RAW-EVIDENCE.zip"
          if archive.exists():
              raise RuntimeError("refusing to overwrite fallback evidence")
          with zipfile.ZipFile(archive, "x", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
              for member in members:
                  bundle.write(member, member.relative_to(root).as_posix())
          with zipfile.ZipFile(archive) as bundle:
              if bundle.testzip() is not None:
                  raise RuntimeError("fallback evidence CRC failure")
              for member in members:
                  if bundle.read(member.relative_to(root).as_posix()) != member.read_bytes():
                      raise RuntimeError("fallback evidence bytes differ")
          raw = archive.read_bytes()
          print(json.dumps({"fallback_archive": str(archive), "bytes": len(raw),
                            "sha256": sha256(raw).hexdigest(), "passed": False}), flush=True)
          PY
          fi
          exit "$hia_v78_export_status"
      - name: Preserve complete source generation and original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-source-v78-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hia-source-v78-evidence/EVIDENCE.zip
            hia-source-v78-evidence/EVIDENCE-ZIP-RECEIPT.json
            hia-source-v78-evidence/FALLBACK-RAW-EVIDENCE.zip
            hia-source-v78-evidence/REPORT.json
            hia-source-v78-evidence/SOURCE-PACKET.json
            hia-source-v78-evidence/PARTIAL-FAILURE-SOURCE.json
            hia-source-v78-driver.stdout
            hia-source-v78-driver.stderr
          if-no-files-found: error
