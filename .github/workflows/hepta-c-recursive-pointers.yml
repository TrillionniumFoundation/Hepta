name: Independent C recursive pointer records
on:
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/test_c_recursive_pointers.py'
      - 'tests/test_c_backend.py'
      - 'tests/test_c_owned_backend.py'
      - '.github/workflows/hepta-c-recursive-pointers.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind compilers and execute complete no-skip controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.90.0 --profile minimal
          export RUSTC="$(rustup which --toolchain 1.90.0 rustc)"
          export CC="$(command -v gcc)"
          mkdir -p artifacts/c-recursive-pointers
          { "$CC" --version; "$RUSTC" --version; sha256sum "$CC" "$RUSTC"; } > artifacts/c-recursive-pointers/compilers.txt
          python - <<'PY' 2>&1 | tee artifacts/c-recursive-pointers/tests.log
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_c_recursive_pointers', 'tests.test_c_backend',
              'tests.test_c_owned_backend'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 43:
              raise SystemExit('Expected all 43 controls with no skips')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-recursive-pointers-${{ matrix.os }}-${{ env.EXPECTED_HEAD }}
          path: artifacts/c-recursive-pointers
