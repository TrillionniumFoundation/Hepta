name: HIA recoverable owner and Proof source integration V79

"on":
  push:
    branches:
      - codex/hia-recoverable-proof-source-v79-r1-20261112-dda7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Exact recoverable owner and Proof source generation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out immutable harness
        id: harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1

      - name: Check out exact product base
        id: source
        uses: actions/checkout@v4
        with:
          ref: 4b19af89a766593f7d5f1cc2db256e81aba7afcb
          path: source
          persist-credentials: false
          fetch-depth: 2

      - name: Set up exact Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"

      - name: Compose pinned recoverable sources
        id: compose
        shell: bash
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python -B - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          root = Path(os.environ["GITHUB_WORKSPACE"])
          out = root / "evidence"
          stdout, stderr = out / "composition.stdout", out / "composition.stderr"
          command = [sys.executable, "-B", str(root / "harness/tools/compose_recoverable_owners.py"),
                     "--harness", str(root / "harness"),
                     "--output", str(out / "composition")]
          with stdout.open("xb") as first, stderr.open("xb") as second:
              result = subprocess.run(command, stdout=first, stderr=second)
          sys.stdout.buffer.write(stdout.read_bytes())
          sys.stderr.buffer.write(stderr.read_bytes())
          raise SystemExit(result.returncode)
          PY

      - name: Generate sources and run unchanged source controls
        id: driver
        shell: bash
        run: |
          set -eu
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os
          import subprocess
          import sys
          root = Path(os.environ["GITHUB_WORKSPACE"])
          out = root / "evidence"
          overlay = root / "harness/overlay/source-overlay.json"
          command = [sys.executable, "-B", str(root / "harness/tools/hia_source_integration_v78.py"),
                     "--source", str(root / "source"),
                     "--expected-commit", "4b19af89a766593f7d5f1cc2db256e81aba7afcb",
                     "--expected-tree", "1bc7c90996e1910ad66ba771b0bfee1d5bfa655c",
                     "--overlay", str(overlay), "--overlay-sha256", sha256(overlay.read_bytes()).hexdigest(),
                     "--output", str(out / "source-generation"), "--install-dependencies"]
          stdout, stderr = out / "driver.stdout", out / "driver.stderr"
          with stdout.open("xb") as first, stderr.open("xb") as second:
              result = subprocess.run(command, stdout=first, stderr=second)
          sys.stdout.buffer.write(stdout.read_bytes())
          sys.stderr.buffer.write(stderr.read_bytes())
          raise SystemExit(result.returncode)
          PY

      - name: Export all completed source evidence
        if: always()
        id: export
        shell: bash
        env:
          HIA_HARNESS_CHECKOUT_OUTCOME: ${{ steps.harness.outcome }}
          HIA_SOURCE_CHECKOUT_OUTCOME: ${{ steps.source.outcome }}
          HIA_PYTHON_SETUP_OUTCOME: ${{ steps.python.outcome }}
          HIA_COMPOSITION_OUTCOME: ${{ steps.compose.outcome }}
          HIA_DRIVER_OUTCOME: ${{ steps.driver.outcome }}
        run: |
          set -eu
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          import os
          import subprocess
          import sys
          import traceback
          import zipfile
          root = Path(os.environ["GITHUB_WORKSPACE"])
          out = root / "evidence"
          out.mkdir(parents=True, exist_ok=True)
          outcomes = {key: value for key, value in os.environ.items()
                      if key.startswith("HIA_") and key.endswith("_OUTCOME")}
          outcomes.update(github_run_id=os.environ.get("GITHUB_RUN_ID"),
                          github_run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"),
                          github_sha=os.environ.get("GITHUB_SHA"),
                          phase="SOURCE_GENERATION_AND_DEVELOPMENT_CONTROLS",
                          current_cold=False, full_suite=False,
                          native_default=False, historical_results_transferred=False)
          (out / "WORKFLOW-OUTCOMES.json").write_text(
              json.dumps(outcomes, sort_keys=True, indent=2) + "\n")
          driver = root / "harness/tools/hia_source_integration_v78.py"
          overlay = root / "harness/overlay/source-overlay.json"
          exported = False
          if driver.is_file():
              digest = sha256(overlay.read_bytes()).hexdigest() if overlay.is_file() else "0" * 64
              command = [sys.executable, "-B", str(driver), "--source", str(root / "source"),
                         "--expected-commit", "4b19af89a766593f7d5f1cc2db256e81aba7afcb",
                         "--expected-tree", "1bc7c90996e1910ad66ba771b0bfee1d5bfa655c",
                         "--overlay", str(overlay), "--overlay-sha256", digest,
                         "--output", str(out / "source-generation"), "--export-only"]
              try:
                  result = subprocess.run(command)
                  exported = result.returncode == 0
              except BaseException:
                  (out / "EXPORT-EXCEPTION.txt").write_text(traceback.format_exc())
          if not exported:
              target = out / "FALLBACK-RAW-EVIDENCE.zip"
              with zipfile.ZipFile(target, "x", compression=zipfile.ZIP_DEFLATED, compresslevel=1) as archive:
                  for path in sorted(out.rglob("*")):
                      if path.is_file() and not path.is_symlink() and path != target:
                          archive.write(path, path.relative_to(out).as_posix())
              print(json.dumps({"fallback_evidence": target.name,
                                "bytes": target.stat().st_size,
                                "sha256": sha256(target.read_bytes()).hexdigest(),
                                "source_qualification": False}, sort_keys=True))
          PY

      - name: Upload original source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-recoverable-proof-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
