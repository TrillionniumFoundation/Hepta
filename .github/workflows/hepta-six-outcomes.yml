name: HIA six-outcome source and application gates

on:
  push:
    branches: [codex/hia-core-closure-20261028, codex/hia-six-outcomes-20261028, codex/hia-blocker-closure-next-20261028]
  pull_request:
    paths:
      - 'hepta/**'
      - 'tests/test_hia_*'
      - 'tests/test_c_contract_identity.py'
      - 'tools/qualify_hia_*'
      - 'tools/hia_filecheck_*'
      - 'docs/HIA_SAFETY_CONTRACT*'
      - 'examples/hia_filecheck/**'
      - 'experiments/hia_agent_factorial_v4_20261028/**'
      - 'experiments/hia_filecheck/**'
      - 'examples/hia_legacy_queue/**'
      - 'experiments/hia_legacy_queue/**'
      - 'experiments/hia_agent_factorial_v5_20261028/**'
      - 'experiments/hia_agent_factorial_v6_20261028/**'
      - 'experiments/hia_agent_structured_v7_20261029/**'
      - 'experiments/hia_agent_toolstudy_v8_20261029/**'
      - 'experiments/hia_agent_toolstudy_v9_20261029/**'
      - 'experiments/hia_ndu_activation/**'
      - 'experiments/hia_ndu_prepared_reuse/**'
      - 'experiments/hia_next_payload_bound/**'
      - 'tests/fixtures/hia_payload_bound/**'
      - 'tools/analyze_hia_entry_payload.py'
      - 'tests/test_c2hepta*'
      - 'tests/test_migration_ir*'
      - '.github/workflows/hepta-six-outcomes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEPTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RECURSIVE_NDU_SOURCE_SHA: 2590c0c94c5bf9a9004caeeb7b75edd6faf3eb8b
      FINITE_NDU_SOURCE_SHA: 4b6391e116949af0c7e59776baead67271856bdb
      STREAM_NDU_SOURCE_SHA: c4a1bbed3a39beba43a6abf1a18b6f75c5725c21
      CLANG: /usr/bin/clang-20
      CLANGXX: /usr/bin/clang++-20
      PYTHONDONTWRITEBYTECODE: '1'
      HEPTA_RUN_ARTIFACT_SESSION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin the source, solver and toolchains
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          python -m pip install -e '.[optimization,verification]'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hepta-six-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          hepta_six_fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hepta-six-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$hepta_six_fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hepta-six-llvm.asc" /usr/share/keyrings/hepta-six-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hepta-six-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hepta-six-llvm.list
          sudo apt-get update
          sudo apt-get install --yes clang-20 libclang-20-dev libclang-rt-20-dev llvm-20 lld-20 qemu-user
          printf '%s\n' /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal
          rustup toolchain install 1.95.0 --profile minimal
          echo "RUSTC=$(rustup which --toolchain 1.90.0 rustc)" >> "$GITHUB_ENV"
          echo "CARGO=$(rustup which --toolchain 1.90.0 cargo)" >> "$GITHUB_ENV"
          echo "FINITE_NDU_RUSTC=$(rustup which --toolchain 1.95.0 rustc)" >> "$GITHUB_ENV"
          echo "FINITE_NDU_CARGO=$(rustup which --toolchain 1.95.0 cargo)" >> "$GITHUB_ENV"
          dirname "$(rustup which --toolchain 1.90.0 rustc)" >> "$GITHUB_PATH"
          hepta_evidence_dir="$RUNNER_TEMP/hepta-six-outcomes"
          mkdir -p "$hepta_evidence_dir" "$RUNNER_TEMP/hepta-six-cargo-home" "$RUNNER_TEMP/hepta-six-cargo-target"
          echo "HEPTA_EVIDENCE_DIR=$hepta_evidence_dir" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/hepta-six-cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-six-cargo-target" >> "$GITHUB_ENV"
      - name: Fetch locked Rust shadow dependencies before offline native checks
        run: cargo fetch --locked --manifest-path rust/hia-core-shadow/Cargo.toml
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/hepta-private-ci
          ref: ${{ env.RECURSIVE_NDU_SOURCE_SHA }}
          path: recursive-ndu-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codex-rs/Cargo.toml
            /codex-rs/hepta-ndu/
            /codex-rs/hepta-types/
            /codex-rs/hepta-contracts/
            /tools/hia-ndu-bridge/
      - name: Build the original recursive NDU bridge with exact source identity
        run: |
          CARGO_INCREMENTAL=0 CARGO_PROFILE_RELEASE_DEBUG=0 python tools/build_hia_recursive_ndu_bridge.py \
            --ndu-source recursive-ndu-source --expected-source "$RECURSIVE_NDU_SOURCE_SHA" \
            --cargo "$CARGO" --rustc "$RUSTC" --output "$RUNNER_TEMP/hia-recursive-ndu" \
            --target-dir "$RUNNER_TEMP/hia-recursive-ndu-target"
          printf 'HEPTA_RECURSIVE_NDU_BRIDGE=%s\nHEPTA_RECURSIVE_NDU_IDENTITY=%s\n' \
            "$RUNNER_TEMP/hia-recursive-ndu/native/hepta-hia-ndu-bridge" \
            "$RUNNER_TEMP/hia-recursive-ndu/identity.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/hepta-private-ci
          ref: ${{ env.FINITE_NDU_SOURCE_SHA }}
          path: finite-ndu-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codex-rs/Cargo.toml
            /codex-rs/hepta-ndu/
            /codex-rs/hepta-types/
            /codex-rs/hepta-contracts/
            /tools/hia-ndu-bridge/
      - name: Build the separately pinned finite graph evaluator
        run: |
          CARGO_INCREMENTAL=0 CARGO_PROFILE_RELEASE_DEBUG=0 python tools/build_hia_recursive_ndu_bridge.py \
            --ndu-source finite-ndu-source --expected-source "$FINITE_NDU_SOURCE_SHA" \
            --cargo "$FINITE_NDU_CARGO" --rustc "$FINITE_NDU_RUSTC" \
            --output "$RUNNER_TEMP/hia-finite-ndu" --target-dir "$RUNNER_TEMP/hia-finite-ndu-target"
          printf 'HEPTA_FINITE_NDU_BRIDGE=%s\nHEPTA_FINITE_NDU_IDENTITY=%s\n' \
            "$RUNNER_TEMP/hia-finite-ndu/native/hepta-hia-ndu-bridge" \
            "$RUNNER_TEMP/hia-finite-ndu/identity.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/hepta-private-ci
          ref: ${{ env.STREAM_NDU_SOURCE_SHA }}
          path: stream-ndu-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codex-rs/Cargo.toml
            /codex-rs/hepta-ndu/
            /codex-rs/hepta-types/
            /codex-rs/hepta-contracts/
            /tools/hia-ndu-bridge/
      - name: Build the separately pinned persistent stream evaluator
        run: |
          CARGO_INCREMENTAL=0 CARGO_PROFILE_RELEASE_DEBUG=0 python tools/build_hia_recursive_ndu_bridge.py \
            --ndu-source stream-ndu-source --expected-source "$STREAM_NDU_SOURCE_SHA" \
            --cargo "$CARGO" --rustc "$RUSTC" --output "$RUNNER_TEMP/hia-stream-ndu" \
            --target-dir "$RUNNER_TEMP/hia-stream-ndu-target"
          printf 'HEPTA_NDU_STREAM_BRIDGE=%s\nHEPTA_NDU_STREAM_IDENTITY=%s\n' \
            "$RUNNER_TEMP/hia-stream-ndu/native/hepta-hia-ndu-bridge" \
            "$RUNNER_TEMP/hia-stream-ndu/identity.json" >> "$GITHUB_ENV"
      - name: Prepare a clean exact source for application gates
        shell: bash
        run: |
          set -euo pipefail
          hepta_six_source="$GITHUB_WORKSPACE/../hepta-six-clean-source"
          git --no-replace-objects worktree add --detach "$hepta_six_source" "$HEPTA_SOURCE_SHA"
          test "$(git --no-replace-objects -C "$hepta_six_source" rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git --no-replace-objects -C "$hepta_six_source" status --porcelain --untracked-files=all)"
      - name: Retain pinned NDU identities without private source or binaries
        shell: bash
        run: |
          set -euo pipefail
          for profile in recursive finite stream; do
            cp "$RUNNER_TEMP/hia-$profile-ndu/identity.json" "$HEPTA_EVIDENCE_DIR/ndu-$profile-identity.json"
            cp "$RUNNER_TEMP/hia-$profile-ndu/build-commands.json" "$HEPTA_EVIDENCE_DIR/ndu-$profile-build-commands.json"
          done
      - name: Execute the checkable safety boundary
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_safety_contract.py --output "$HEPTA_EVIDENCE_DIR/safety.json"
      - name: Run finite source and application regressions without skips
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: |
          python - <<'PY'
          import json, os, pathlib, unittest
          names = ['tests.test_c_contract_identity', 'tests.test_hia_round3_routes',
                   'tests.test_hia_narrowing', 'tests.test_hia_prepared',
                   'tests.test_hia_adaptive_retirement', 'tests.test_hia_filecheck',
                   'tests.test_hia_filecheck_target_profile', 'tests.test_hia_filecheck_native_isolation',
                   'tests.test_hia_agent_factorial', 'tests.test_hia_safety_protocol',
                   'tests.test_hia_integrated_inputs', 'tests.test_hia_integrated_workflow',
                   'tests.test_hia_source_local_views', 'tests.test_hia_source_returned_local_views',
                   'tests.test_hia_source_nested_returned_views',
                   'tests.test_hia_rust_execution_crosscheck',
                   'tests.test_hia_source_unit_enums', 'tests.test_hia_rust_bound_depth',
                   'tests.test_hia_rust_transport_lifecycle', 'tests.test_cpp_upstream_host',
                   'tests.test_c2hepta_api_path_isolation', 'tests.test_c2hepta_bounded_source',
                   'tests.test_c2hepta_bounded_capture', 'tests.test_migration_ir_identifier_guard',
                   'tests.test_migration_ir_literal_guard', 'tests.test_migration_ir_structural_budget',
                   'tests.test_migration_ir_neg_payload_guard', 'tests.test_migration_ir_parser_budget',
                   'tests.test_hia_agent_repair', 'tests.test_c2hepta_snapshot_capture',
                   'tests.test_hia_scalar_lowering_check', 'tests.test_hia_cursor_math',
                   'tests.test_hia_c_project_views', 'tests.test_hia_artifact_session',
                   'tests.test_hia_native_pinning', 'tests.test_hia_ndu_prepared_reuse',
                   'tests.test_hia_legacy_irpgo', 'tests.test_hia_agent_primitive_into',
                   'tests.test_hia_entry_payload_bound', 'tests.test_hia_agent_structured',
                   'tests.test_hia_agent_toolstudy', 'tests.test_hia_agent_toolstudy_v9',
                   'tests.test_hia_agent_tool_references', 'tests.test_hia_ndu_activation.ActivationForecastTests']
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          record = dict(tests=result.testsRun, failures=len(result.failures),
                        errors=len(result.errors), skipped=len(result.skipped))
          (pathlib.Path(os.environ['HEPTA_EVIDENCE_DIR']) / 'regression.json').write_text(json.dumps(record, indent=2)+'\n')
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
      - name: Execute real C migration, lifetime, maintenance and LTO/PGO preparation
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_filecheck.py --prepare-only --output "$HEPTA_EVIDENCE_DIR/filecheck"
      - name: Validate selected scalar lowering for all typed inputs
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_scalar_lowering.py --expected-head "$HEPTA_SOURCE_SHA" --output "$HEPTA_EVIDENCE_DIR/scalar-lowering"
      - name: Check the actual migration Core payload bound without native admission
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/analyze_hia_entry_payload.py tests/fixtures/hia_payload_bound/legacy_core.hia.json legacy_checksum_chunk --require-clean-source --output "$HEPTA_EVIDENCE_DIR/legacy-core-payload.json"
      - name: Prepare actual legacy record-view Core migration and strong baseline builds
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_legacy_queue.py --prepare-only --output "$HEPTA_EVIDENCE_DIR/legacy-queue"
      - name: Validate actual IR PGO counters and allocation refusal after optimization
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_legacy_irpgo.py --prepare-only --output "$HEPTA_EVIDENCE_DIR/legacy-irpgo"
      - name: Execute actual Agent experiment reference and hostile controls
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_agent_factorial.py controls --output "$HEPTA_EVIDENCE_DIR/agent-controls" --clang "$CLANG" --rustc "$RUSTC"
      - name: Validate primitive conversion with actual rustc and unchanged legacy refusal
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_agent_primitive_repair.py profile-controls --output "$HEPTA_EVIDENCE_DIR/agent-v6-profile-controls" --clang "$CLANG" --rustc "$RUSTC"
      - name: Execute actual revision-bound HIA and Rust node transactions
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_structured_controls.py --output "$HEPTA_EVIDENCE_DIR/agent-node-controls" --clang "$CLANG" --rustc "$RUSTC"
      - name: Execute all registered full and node native reference controls
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_agent_tool_references.py --output "$HEPTA_EVIDENCE_DIR/agent-tool-native-references" --clang "$CLANG" --rustc "$RUSTC"
      - name: Execute the separately bound V9 native reference controls
        working-directory: ${{ github.workspace }}/../hepta-six-clean-source
        run: python tools/qualify_hia_agent_tool_references.py --study-version v9 --output "$HEPTA_EVIDENCE_DIR/agent-tool-native-references-v9" --clang "$CLANG" --rustc "$RUSTC"
      - name: Retain completed and failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-six-outcomes-${{ env.HEPTA_SOURCE_SHA }}
          path: ${{ env.HEPTA_EVIDENCE_DIR }}
          if-no-files-found: error
