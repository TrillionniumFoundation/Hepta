name: Fixed HIA source guard comparison
on:
  push:
    branches: [codex/hia-source-admission-guard-v94-r2-20261113-dda7]
permissions:
  contents: read
jobs:
  guard-controls-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: abeef212e34023534d91f8f952280e2a8d0cbde6
          path: work/source-original
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install original discovery dependencies
        run: python -m pip install jsonschema==4.26.0 setuptools==78.1.1 wheel==0.46.3
      - name: Verify narrow successor, original source controls, and warm ABBA
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B harness/tools/prepare_guard.py --source work/source-original --harness harness --evidence evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-guard-diagnostic-${{ github.sha }}
          path: |
            evidence
            harness/README.md
            harness/inputs
            harness/tools
            harness/.github/workflows/diagnostic.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
