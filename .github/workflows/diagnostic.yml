name: Fixed HIA source admission diagnostic
on:
  push:
    branches: [codex/hia-source-admission-diagnostic-v94-r1-20261113-dda7]
permissions:
  contents: read
jobs:
  source-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TrillionniumFoundation/Hepta
          ref: abeef212e34023534d91f8f952280e2a8d0cbde6
          path: fixed-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install original discovery dependencies
        run: python -m pip install jsonschema==4.26.0 setuptools==78.1.1 wheel==0.46.3
      - name: Observe exact source scan and protocol
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B harness/tools/diagnose_source_scan.py --source fixed-source --inputs harness/inputs/INPUTS.json --evidence evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-admission-diagnostic-${{ github.sha }}
          path: |
            evidence
            harness/tools/diagnose_source_scan.py
            harness/inputs/INPUTS.json
            harness/.github/workflows/diagnostic.yml
            harness/README.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
