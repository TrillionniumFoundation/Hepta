name: HIA CPython 3.14 verification runtime
on:
  push:
    branches:
      - 'audit/hia-py314-runtime-*'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Install the original fixed verification prerequisites
        run: python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
      - name: Preserve the exact relocatable verification runtime
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import hashlib, importlib.metadata, json, os, platform, stat, sys, tarfile
          assert platform.python_implementation() == 'CPython'
          assert sys.version_info[:3] == (3, 14, 10), sys.version
          source = Path(sys.base_prefix).resolve()
          output = Path(os.environ['RUNNER_TEMP']) / 'hia-python314-runtime'
          output.mkdir()
          entries = []
          paths = [source, *sorted(source.rglob('*'))]
          for path in paths:
              info = path.lstat()
              relative = path.relative_to(source).as_posix()
              entry = {'path': relative, 'mode': stat.S_IMODE(info.st_mode)}
              if path.is_symlink():
                  target = os.readlink(path)
                  assert not os.path.isabs(target), (relative, target)
                  assert path.resolve().is_relative_to(source), (relative, target)
                  entry.update(kind='symlink', target=target)
              elif path.is_dir():
                  entry.update(kind='directory')
              else:
                  assert stat.S_ISREG(info.st_mode), relative
                  raw = path.read_bytes()
                  entry.update(kind='file', bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
              entries.append(entry)
          metadata = {'schema': 'hepta.verification-python-runtime.v1', 'runtime': sys.version,
              'source_prefix': str(source), 'implementation': platform.python_implementation(),
              'machine': platform.machine(), 'libc': platform.libc_ver(),
              'executable_relative_path': Path(sys.executable).resolve().relative_to(source).as_posix(),
              'distributions': sorted([{'name': d.metadata['Name'], 'version': d.version}
                                      for d in importlib.metadata.distributions()], key=lambda d: d['name'].lower()),
              'files': entries, 'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_sha': os.environ['GITHUB_SHA'], 'product_imported': False,
              'product_native_or_vm_executed': False, 'product_qualification': False}
          manifest = output / 'runtime-manifest.json'
          manifest.write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n')
          archive = output / 'runtime.tar.xz'
          with tarfile.open(archive, 'w:xz', preset=6) as tar:
              for path in paths:
                  relative = path.relative_to(source).as_posix()
                  tar.add(path, arcname='runtime' if relative == '.' else 'runtime/' + relative, recursive=False)
          for entry in entries:
              path = source / entry['path']
              assert stat.S_IMODE(path.lstat().st_mode) == entry['mode']
              if entry['kind'] == 'file':
                  raw = path.read_bytes()
                  assert len(raw) == entry['bytes'] and hashlib.sha256(raw).hexdigest() == entry['sha256']
              elif entry['kind'] == 'symlink':
                  assert os.readlink(path) == entry['target']
          archive_bytes = archive.read_bytes()
          status = {'archive_bytes': len(archive_bytes), 'archive_sha256': hashlib.sha256(archive_bytes).hexdigest(),
                    'manifest_bytes': manifest.stat().st_size, 'manifest_sha256': hashlib.sha256(manifest.read_bytes()).hexdigest(),
                    'file_count': sum(e['kind'] == 'file' for e in entries), 'source_before_after_equal': True,
                    'product_qualification': False}
          (output / 'runtime-archive.json').write_text(json.dumps(status, indent=2) + '\n')
          print(json.dumps(status, indent=2))
          PY
      - name: Upload the complete verification runtime
        uses: actions/upload-artifact@v4
        with:
          name: hia-python314-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/hia-python314-runtime
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
