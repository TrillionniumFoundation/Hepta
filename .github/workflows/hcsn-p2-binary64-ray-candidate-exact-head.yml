name: HCSN P2 exact binary64 ray candidate and frozen negative (HOLD)
on:
  push:
    branches:
      - research/hcsn-p2-binary64-ray-candidate-20261106-gpt6-01
  pull_request:
    branches:
      - research/hcsn-p2-scale-equivariance-negative-20261106-gpt6
permissions:
  contents: read
jobs:
  candidate-and-frozen-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original failure stays frozen and candidate cannot borrow qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git hash-object research/hcsn/p2_exact_occupancy_reference.mjs)" = ac5a4a6c757c5c9c01983639d17178b29c08d406
          test "$(git hash-object research/hcsn/p2_binary64_exact_ray_candidate.mjs)" = 9783215b5567846c876f72fa2af95165e986c1e4
          test "$(git hash-object research/hcsn/test_p2_binary64_exact_ray_candidate.mjs)" = cbfad7ec164175739aa9705c1e591d6386eec2a2
          node --version
          node --test research/hcsn/test_p2_exact_occupancy_reference.mjs research/hcsn/test_p2_config_contract.mjs research/hcsn/test_p2_signed_zero_reference.mjs research/hcsn/test_p2_input_snapshot.mjs research/hcsn/test_p2_scale_equivariance_negative.mjs
          node --test research/hcsn/test_p2_binary64_exact_ray_candidate.mjs
          node research/hcsn/p2_scale_equivariance_evidence.mjs --json /tmp/hcsn-scale-original-negative.json >/tmp/hcsn-scale-original-negative-stdout.json
          set +e
          node research/hcsn/p2_scale_equivariance_evidence.mjs --strict >/tmp/hcsn-scale-strict-negative.json
          code=$?
          set -e
          test "$code" -eq 2
          echo "HOLD: original counterexample retained; candidate numerical check is not HCSN P0-P6 acceptance"
