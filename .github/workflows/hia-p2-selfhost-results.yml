name: HIA P2 selfhost CFG and scalar results

on:
  pull_request:
    branches: ['codex/hia-sixgap-source-5e6c-20261108']
    paths:
      - '.github/workflows/hia-p2-selfhost-results.yml'
      - 'tools/generate_hia_selfhost.py'
      - 'tools/hia_selfhost*.py'
      - 'tools/qualify_hia_selfhost*.py'
      - 'tools/replay_hia_selfhost*.py'
      - 'tools/hia_release.py'
      - 'tests/test_hia_selfhost*.py'
      - 'examples/hia_bootstrap/selfhost.hiaasm'
      - 'docs/HIA_SELFHOST*'
      - 'docs/HIA_SELF_HOSTING_CORE.md'
      - 'review-evidence/hia-p2-selfhost-recovery-20261109/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hia-p2-selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HIA_P2_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HIA_P2_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIA_P2_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'jsonschema==4.25.1' 'z3-solver==4.15.4.0'

      - name: Verify original source recovery and unchanged generated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/hia-p2-source"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-p2-source/source.txt"
          python -m pip freeze > "$RUNNER_TEMP/hia-p2-source/dependencies.txt"
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-p2-source/recovery.log"
          from hashlib import sha256
          import gzip, json, subprocess
          from pathlib import Path
          root = Path("review-evidence/hia-p2-selfhost-recovery-20261109")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["original_source_tree"] == manifest["recovered_source_tree"]
          for key in ("git_bundle", "original_source_snapshot"):
              item = manifest[key]
              data = Path(item["path"]).read_bytes()
              assert len(data) == item["bytes"] and sha256(data).hexdigest() == item["sha256"]
          # Historical recovery is checked against its immutable recovered
          # commit, not against a later compiler that intentionally changes it.
          subprocess.run(["git", "bundle", "verify", manifest["git_bundle"]["path"]], check=True)
          subprocess.run(["git", "fetch", "--no-tags", manifest["git_bundle"]["path"], "HEAD"], check=True)
          original = manifest["original_commits"][1]["sha"]
          recovered = manifest["recovered_source_commit"]
          assert subprocess.check_output(["git", "rev-parse", "FETCH_HEAD"], text=True).strip() == original
          assert subprocess.check_output(["git", "rev-parse", original + "^{tree}"], text=True).strip() == manifest["original_source_tree"]
          assert subprocess.check_output(["git", "rev-parse", recovered + "^{tree}"], text=True).strip() == manifest["recovered_source_tree"]
          subprocess.run(["git", "merge-base", "--is-ancestor", recovered, "HEAD"], check=True)
          snapshot = json.loads(gzip.decompress(Path(manifest["original_source_snapshot"]["path"]).read_bytes()))
          for path, text in snapshot["files"].items():
              assert subprocess.check_output(["git", "show", original + ":" + path]) == text.encode()
          for path, item in manifest["recovered_changed_files"].items():
              data = subprocess.check_output(["git", "show", recovered + ":" + path])
              assert len(data) == item["bytes"] and sha256(data).hexdigest() == item["sha256"], path
          subprocess.run(["git", "diff", "--exit-code", original, recovered, "--", *manifest["recovered_changed_files"]], check=True)
          print(json.dumps({"status": "SOURCE_RECOVERY_VERIFIED", "changed_files": len(manifest["recovered_changed_files"]), "original_tree": manifest["original_source_tree"]}, sort_keys=True))
          PY
          python -B tools/generate_hia_selfhost.py 2>&1 | tee "$RUNNER_TEMP/hia-p2-source/generator.log"
          python -B tests/test_hia_selfhost_language_coverage.py --generate-inventory 2>&1 | tee "$RUNNER_TEMP/hia-p2-source/inventory.log"
          python -B tools/generate_hia_selfhost_contract.py --check 2>&1 | tee "$RUNNER_TEMP/hia-p2-source/contract.log"
          git diff --exit-code
      - name: Run source, contract, short-circuit and tuple reference assertions
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-p2-source/tests.log"
          import json, os, unittest
          from pathlib import Path
          names = (
              "tests.test_hia_selfhost.SelfhostSourceTests",
              "tests.test_hia_selfhost_contract.SelfhostContractTests",
              "tests.test_hia_selfhost_cli",
              "tests.test_hia_selfhost_returned_loans",
              "tests.test_hia_selfhost_multi_results.SelfhostMultiResultSourceTests",
              "tests.test_hia_selfhost_keywords.SelfhostKeywordTests",
              "tests.test_hia_selfhost_signed.SelfhostSignedTests",
              "tests.test_hia_selfhost_traps.SelfhostExplicitTrapTests",
              "tests.test_hia_selfhost_language_coverage.SelfhostLanguageSourceTests",
              "tests.test_hia_agent_native_tools.ArtifactContractTests.test_discovery_is_readable_and_source_bound",
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (result.wasSuccessful() and result.testsRun > 0 and not result.skipped
                    and not result.expectedFailures and not result.unexpectedSuccesses)
          report = {
              "schema": "hepta.hia.p2.source-tests.v1",
              "source_sha": os.environ["HIA_P2_SOURCE_SHA"],
              "status": "PASS" if passed else "FAIL", "tests_run": result.testsRun,
              "failures": [{"test": t.id(), "detail": d} for t,d in result.failures],
              "errors": [{"test": t.id(), "detail": d} for t,d in result.errors],
              "skipped": [{"test": t.id(), "reason": d} for t,d in result.skipped],
              "old_temporary_evidence_reused": False,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "hia-p2-source/tests.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps({k:report[k] for k in ("source_sha", "status", "tests_run")}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve source evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-p2-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-p2-source
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 9


  cold:
    needs: source
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HIA_P2_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIA_P2_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'jsonschema==4.25.1' 'z3-solver==4.15.4.0'

      - name: Run cold qualification on this head
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir "$RUNNER_TEMP/hia-p2-cold"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-p2-cold/source.txt"
          python -m pip freeze > "$RUNNER_TEMP/hia-p2-cold/dependencies.txt"
          python -B tools/replay_hia_selfhost_cold.py --output "$RUNNER_TEMP/hia-p2-cold/qualification.json" 2>&1 | tee "$RUNNER_TEMP/hia-p2-cold/qualification.log"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "hia-p2-cold/qualification.json").read_text())
          assert report["status"] == "COLD_SELFHOST_REPLAY_PASS", report["status"]
          print(json.dumps({"source_sha": os.environ["HIA_P2_SOURCE_SHA"], "gate": "cold", "status": report["status"]}, sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve cold evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-p2-cold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-p2-cold
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 9


  native:
    needs: [source, cold]
    if: always() && needs.source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HIA_P2_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIA_P2_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'jsonschema==4.25.1' 'z3-solver==4.15.4.0'

      - name: Run native qualification on this head
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir "$RUNNER_TEMP/hia-p2-native"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-p2-native/source.txt"
          python -m pip freeze > "$RUNNER_TEMP/hia-p2-native/dependencies.txt"
          python -B tools/qualify_hia_selfhost.py --output "$RUNNER_TEMP/hia-p2-native/qualification.json" 2>&1 | tee "$RUNNER_TEMP/hia-p2-native/qualification.log"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "hia-p2-native/qualification.json").read_text())
          assert report["status"] == "SELF_HOSTED_FIXED_CORE_PASS", report["status"]
          print(json.dumps({"source_sha": os.environ["HIA_P2_SOURCE_SHA"], "gate": "native", "status": report["status"]}, sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve native evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-p2-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-p2-native
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 9


  language:
    needs: [source, native]
    if: always() && needs.source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HIA_P2_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HIA_P2_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'jsonschema==4.25.1' 'z3-solver==4.15.4.0'

      - name: Run language qualification on this head
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir "$RUNNER_TEMP/hia-p2-language"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-p2-language/source.txt"
          python -m pip freeze > "$RUNNER_TEMP/hia-p2-language/dependencies.txt"
          python -B tests/test_hia_selfhost_language_coverage.py --output "$RUNNER_TEMP/hia-p2-language/qualification.json" 2>&1 | tee "$RUNNER_TEMP/hia-p2-language/qualification.log"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "hia-p2-language/qualification.json").read_text())
          assert report["status"] == "SELFHOST_LANGUAGE_COVERAGE_PASS", report["status"]
          print(json.dumps({"source_sha": os.environ["HIA_P2_SOURCE_SHA"], "gate": "language", "status": report["status"]}, sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve language evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hia-p2-language-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-p2-language
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 9

