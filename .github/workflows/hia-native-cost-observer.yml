name: HIA native-cost observer (Linux scoped)
on:
  push:
    branches:
      - work/hia-native-observer-20261031-gpt6
  pull_request:
    branches:
      - work/hia-p0-p7-full-cost-evidence-20261031-gpt6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-elf-negatives:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify actual C compiler and Linux wait4
        run: |
          set -eu
          gcc --version
          python -c "import os,sys; assert sys.platform == 'linux' and hasattr(os, 'wait4')"
      - name: Compile and run all four real ELF strategies and adversarial trials
        run: |
          set -eu
          python -B -m unittest tests.test_hia_native_process_observer -v
          python -B -m unittest tests.test_hia_full_cost_gate -v
      - name: Check Python syntax and scoped source cleanliness
        run: |
          set -eu
          python -B -m py_compile tools/hia_native_process_observer.py tests/test_hia_native_process_observer.py
          git diff --exit-code -- tools/hia_native_process_observer.py tests/test_hia_native_process_observer.py
