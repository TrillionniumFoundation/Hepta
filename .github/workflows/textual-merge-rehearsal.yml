name: Fixed textual merge rehearsal

on:
  push:
    branches:
      - codex/hia-textual-merge-rehearsal-v84-20261113-dda7

permissions:
  contents: write

jobs:
  observe-fixed-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the isolated four-file harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false
      - name: Record the fixed textual merge and exact main archive
        shell: bash
        env:
          HIA_REHEARSAL_TOKEN: ${{ github.token }}
          EXPECTED_INPUTS_SHA256: c5c7939b0475a79effb36ca740df23c633ac46ad3a8192cfb1e75eaf9821d180
          EXPECTED_DRIVER_SHA256: 5219abbccf0fde210b3f7879b840a44dc8dffc7a50c476cce85e937adf14f134
        run: |
          python3 -I -B "${GITHUB_WORKSPACE}/harness/tools/rehearse_fixed_merge.py" \
            --inputs "${GITHUB_WORKSPACE}/harness/inputs/FIXED-INPUTS.json" \
            --root "${RUNNER_TEMP}/hia-textual-merge-rehearsal-v84"
      - name: Preserve all original observations and partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-textual-merge-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-textual-merge-rehearsal-v84/evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
