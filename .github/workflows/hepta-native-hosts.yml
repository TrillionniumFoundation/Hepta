name: Hepta actual host ABI qualification

on:
  push:
    branches: [feat/hepta-safe-migration-agent-20261024, dot/hepta-p0-p1-semantic-bridge-20261025, dot/hepta-p0-p7-integration-20261025, codex/hia-ndu-verified-optimization-20261027, codex/hia-ndu-bounded-pipeline-20261027, codex/hia-contract-integration-20261027, codex/hia-v8-blocker-convergence-20261027, codex/hia-round5-*, codex/hia-core-closure-20261028, codex/hia-round6-convergence-20261029]
  pull_request:
    branches: [main, codex/hia-p0-p7-convergence-20261027, codex/hia-ndu-verified-optimization-20261027, codex/hia-ndu-bounded-pipeline-20261027, codex/hia-contract-integration-20261027]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  native-host:
    name: ${{ matrix.os }} / ${{ matrix.machine }} / ${{ matrix.cc_family }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: Linux
            machine: x86_64
            cc: gcc
            cc_family: gcc
          - os: ubuntu-24.04
            system: Linux
            machine: x86_64
            cc: clang
            cc_family: clang
          - os: ubuntu-24.04-arm
            system: Linux
            machine: aarch64
            cc: gcc
            cc_family: gcc
          - os: ubuntu-24.04-arm
            system: Linux
            machine: aarch64
            cc: clang
            cc_family: clang
          - os: windows-2025
            system: Windows
            machine: x86_64
            cc: cl.exe
            cc_family: msvc
          - os: windows-2025
            system: Windows
            machine: x86_64
            cc: clang
            cc_family: clang
          - os: macos-15
            system: Darwin
            machine: aarch64
            cc: clang
            cc_family: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HEPTA_QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEPTA_HOST_CC: ${{ matrix.cc }}
      HEPTA_HOST_CC_FAMILY: ${{ matrix.cc_family }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_QUALIFICATION_HEAD_SHA }}
      - name: Retain an unqualified result if setup or execution never finishes
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/native-host.json <<'JSON'
          {"schema":"hepta.native-host.v2","status":"failed","error":"Native host setup or execution did not finish; inspect retained setup/test logs.","requested_compiler":"${{ matrix.cc }}","requested_family":"${{ matrix.cc_family }}","claims":{"cross_host_results_inferred":false}}
          JSON
          cat > artifacts/stb-divide-host.json <<'JSON'
          {"schema":"hepta.c-stb-divide-qualification.v1","ok":false,"status":"failed","error":"Complete component setup or execution did not finish; inspect retained setup and component logs.","claims":{"cross_host_results_inferred":false,"cpp_migration":false}}
          JSON
          cat > artifacts/original-type-preflight.json <<'JSON'
          {"schema":"hepta.c-original-type-host-preflight.v1","ok":false,"status":"failed","error":"Original-type preflight did not finish; inspect retained setup/preflight logs.","claims":{"native_component_qualified":false,"cross_host_results_inferred":false,"original_type_guard_bypassed":false}}
          JSON
          git rev-parse HEAD > artifacts/native-host-setup.log
      - uses: actions/setup-python@v5
        with:
          # CPython exposes Darwin waitid(WNOWAIT) starting in 3.13.
          # Capture must retain the leader until its final owned group signal.
          python-version: ${{ matrix.system == 'Darwin' && '3.13' || '3.11' }}
      - name: Verify exact head and install the pinned native Rust version
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEPTA_QUALIFICATION_HEAD_SHA"
          rustup toolchain install 1.90.0 --profile minimal 2>&1 | tee -a artifacts/native-host-setup.log
      - name: Establish the actual Visual Studio and Windows SDK environment
        if: matrix.system == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'System vswhere.exe is required' }
          $installDir = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installDir) { throw 'An installed Microsoft C++ x64 toolchain is required' }
          $devcmd = Join-Path -Path ($installDir.Trim()) -ChildPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devcmd)) { throw 'Installed VsDevCmd.bat is required' }
          "vswhere=$vswhere`nVsDevCmd=$devcmd`narchitecture=x64/host_x64" | Out-File artifacts/native-host-setup.log -Append -Encoding utf8
          $environmentLines = & $env:ComSpec /d /s /c "`"$devcmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) {
            $environmentLines | Where-Object { $_ -notmatch '^[^=]+=' } | Out-File artifacts/native-host-setup.log -Append -Encoding utf8
            throw 'VsDevCmd failed; see retained setup log'
          }
          # Import only compiler/SDK search paths into this job, never print the
          # complete environment captured by cmd.exe or alter machine settings.
          $allowed = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion')
          $captured = @{}
          foreach ($line in $environmentLines) {
            if ($line -match '^([^=]+)=(.*)$' -and $allowed -contains $Matches[1]) {
              $captured[$Matches[1]] = $Matches[2]
            }
          }
          foreach ($required in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir')) {
            if (-not $captured.ContainsKey($required)) { throw "VsDevCmd did not provide $required" }
          }
          foreach ($name in $allowed) {
            if ($captured.ContainsKey($name)) {
              [Environment]::SetEnvironmentVariable($name, $captured[$name], 'Process')
              "$name=$($captured[$name])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          # Git Bash prepends its own tools to PATH. Resolve the installed x64
          # Microsoft linker from the captured VS environment, not Get-Command.
          $linker = Join-Path -Path $captured['VCToolsInstallDir'] -ChildPath 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw 'The captured VS x64 linker is required' }
          $linker = (Resolve-Path -LiteralPath $linker).Path
          "HEPTA_HOST_LINKER=$linker" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "rust-linker=$linker`nrust-linker-sha256=$((Get-FileHash -LiteralPath $linker -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File artifacts/native-host-setup.log -Append -Encoding utf8
          "cl.exe=$((Get-Command cl.exe -ErrorAction Stop).Source)" | Out-File artifacts/native-host-setup.log -Append -Encoding utf8
      - name: Check adapter and failed-report contracts
        shell: bash
        run: |
          python -m unittest tests.test_native_host_evidence -v 2>&1 | tee artifacts/native-host-adapter-tests.log
      - name: Execute both C profiles, three ill-typed declarations, and a compiled wrong echo
        shell: bash
        run: |
          python tools/validate_native_host.py \
            --rustc "$(rustup which --toolchain 1.90.0 rustc)" \
            --cc "$HEPTA_HOST_CC" --cc-family "$HEPTA_HOST_CC_FAMILY" \
            --expected-system '${{ matrix.system }}' --expected-machine '${{ matrix.machine }}' \
            --output artifacts/native-host.json
      - name: Check bounded compiler capture process ownership on this host
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_clang_capture -v 2>&1 | tee artifacts/clang-capture-tests.log
          capture_status=${PIPESTATUS[0]}
          exit "$capture_status"
      - name: Check non-reaping POSIX leader and capture-read boundaries
        if: ${{ matrix.system != 'Windows' }}
        shell: bash
        run: |
          python -m unittest tests.test_clang_capture_ownership -v 2>&1 | tee artifacts/clang-capture-ownership-tests.log
      - name: Check serialized-AST process status and argument forwarding on this host
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_c_parameter_types.OriginalTypeEmissionProcessTests -v 2>&1 | tee artifacts/original-type-process-tests.log
          process_status=${PIPESTATUS[0]}
          exit "$process_status"
      - name: Resolve capture Clang and check actual original array parameter types
        shell: bash
        run: |
          set +e
          python tools/preflight_c_original_types.py \
            --clang clang --expected-system '${{ matrix.system }}' \
            --output-directory artifacts/original-type-preflight \
            --github-env "$GITHUB_ENV" 2>&1 | tee artifacts/original-type-preflight.log
          preflight_status=${PIPESTATUS[0]}
          if [ -f artifacts/original-type-preflight/qualification.json ]; then
            cp artifacts/original-type-preflight/qualification.json artifacts/original-type-preflight.json
          fi
          exit "$preflight_status"
      - name: Execute the complete frozen stb_divide C component on this actual host
        shell: bash
        run: |
          linker_args=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -n "$HEPTA_HOST_LINKER"
            linker_args=(--linker "$HEPTA_HOST_LINKER")
          fi
          set +e
          python tools/qualify_c_stb_divide.py \
            --clang "$HEPTA_CAPTURE_CLANG" --rustc "$(rustup which --toolchain 1.90.0 rustc)" \
            "${linker_args[@]}" \
            --cc "$HEPTA_HOST_CC" --cc-family "$HEPTA_HOST_CC_FAMILY" \
            --expected-system '${{ matrix.system }}' --expected-machine '${{ matrix.machine }}' \
            --output-directory artifacts/stb-divide-host 2>&1 | tee artifacts/stb-divide-host.log
          stb_status=${PIPESTATUS[0]}
          if [ -f artifacts/stb-divide-host/qualification.json ]; then
            cp artifacts/stb-divide-host/qualification.json artifacts/stb-divide-host.json
          fi
          exit "$stb_status"
      - name: Retain actual host evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.cc_family }}-${{ env.HEPTA_QUALIFICATION_HEAD_SHA }}
          path: |
            artifacts/native-host.json
            artifacts/native-host-setup.log
            artifacts/native-host-adapter-tests.log
            artifacts/clang-capture-tests.log
            artifacts/original-type-process-tests.log
            artifacts/original-type-preflight.json
            artifacts/original-type-preflight.log
            artifacts/original-type-preflight/
            artifacts/stb-divide-host.json
            artifacts/stb-divide-host.log
            artifacts/stb-divide-host/
          if-no-files-found: error
