name: HIA exact source closure

on:
  push:
    branches: ['codex/hia-sixgap-source-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HEPTA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind source and verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install 'jsonschema==4.25.1' 'z3-solver==4.15.4.0'
          mkdir "$RUNNER_TEMP/hia-sixgap"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/hia-sixgap/source.txt"
          python -m pip freeze > "$RUNNER_TEMP/hia-sixgap/dependencies.txt"
      - name: Qualify direct machine code and Core without skips
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B tools/qualify_hia_direct_native.py --output "$RUNNER_TEMP/hia-sixgap/direct-native.json" 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/direct-native.log"
      - name: Verify proof contracts and actual native consumers
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B -m unittest discover -s tests -p 'test_hia_agent_native*.py' -v 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/agent-native.log"
      - name: Qualify borrowed-buffer lifecycle and the unchanged frozen compiler
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/agent-buffer-tests.log"
          import json
          import os
          from pathlib import Path
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames((
              'tests.test_hia_agent_buffer_lifecycle', 'tests.test_hia_agent_external_roots'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          qualified = (result.wasSuccessful() and result.testsRun > 0 and not result.skipped
                       and not result.expectedFailures)
          report = {'schema': 'hepta.hia.agent-buffer-source-tests.v1',
              'source_sha': os.environ['HEPTA_SOURCE_SHA'],
              'status': 'QUALIFIED' if qualified else 'FAILED', 'tests_run': result.testsRun,
              'failures': [{'test': t.id(), 'detail': d} for t,d in result.failures],
              'errors': [{'test': t.id(), 'detail': d} for t,d in result.errors],
              'skipped': [{'test': t.id(), 'reason': d} for t,d in result.skipped],
              'general_compiler_refinement_proved': False, 'production_adoption': False}
          (Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap/agent-buffer-tests.json').write_text(json.dumps(report,indent=2) + '\n')
          if not qualified:
              raise SystemExit(1)
          PY
          python -B - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import zipfile
          archive = Path('review-evidence/hia-agent-buffer-20261108-5e6c/raw-continuation.zip')
          assert sha256(archive.read_bytes()).hexdigest() == 'e0253f117a5f80b2a93efcaa30575b28d131fef9782a60bab3d32797b57d8b25'
          output = Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap/frozen-agent-inputs'
          output.mkdir()
          fixtures = {
              'selfhost.hiaasm': '2dd847d9df46392e4ef4b99c781b45f56c9841ae61127a260be6e8523f042845',
              'fresh-select.patch': 'e74f3c27d6ea7e7ccfc1c9e2a4e7674fecabef08ee0e05236e5a6e2b5bd75cb4'}
          with zipfile.ZipFile(archive) as source:
              for name, expected in fixtures.items():
                  data = source.read('frozen-inputs/' + name)
                  assert sha256(data).hexdigest() == expected
                  (output / name).write_bytes(data)
          PY
          python -B tools/qualify_hia_agent_buffer_lifecycle.py \
            --compiler-source "$RUNNER_TEMP/hia-sixgap/frozen-agent-inputs/selfhost.hiaasm" \
            --expected-source-sha256 2dd847d9df46392e4ef4b99c781b45f56c9841ae61127a260be6e8523f042845 \
            --output "$RUNNER_TEMP/hia-sixgap/agent-buffer-continuation" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/agent-buffer-continuation.log"
      - name: Qualify the current checked-in compiler through the borrowed-buffer lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          hia_current_compiler_sha=$(python -B -c 'from hashlib import sha256; from pathlib import Path; print(sha256(Path("examples/hia_bootstrap/selfhost.hiaasm").read_bytes()).hexdigest())')
          python -B tools/qualify_hia_agent_buffer_lifecycle.py \
            --compiler-source examples/hia_bootstrap/selfhost.hiaasm \
            --expected-source-sha256 "$hia_current_compiler_sha" \
            --output "$RUNNER_TEMP/hia-sixgap/agent-buffer-current-compiler" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/agent-buffer-current-compiler.log"
      - name: Recheck the real original select delta and preserve strict rejection
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import zipfile
          archive = Path('review-evidence/hia-agent-original-select-delta-20261108-5e6c/raw-evidence.zip')
          assert sha256(archive.read_bytes()).hexdigest() == '0b18f5665657601141ada5fe67990ee192d91665eb5463f806b495d6240a2d3a'
          output = Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap/original-select-inputs'
          output.mkdir()
          fixtures = {
              'original-selfhost.hiaasm': '85288cfc4b649b2be13175675880f5372f16bf3d9c5d4b78ba21ffa2c90b6b44',
              'candidate-selfhost.hiaasm': '2dd847d9df46392e4ef4b99c781b45f56c9841ae61127a260be6e8523f042845',
              'fresh-select.patch': 'e74f3c27d6ea7e7ccfc1c9e2a4e7674fecabef08ee0e05236e5a6e2b5bd75cb4'}
          with zipfile.ZipFile(archive) as source:
              for name, expected in fixtures.items():
                  data = source.read('installed-source/frozen-inputs/' + name)
                  assert sha256(data).hexdigest() == expected
                  (output / name).write_bytes(data)
          PY
          python -B tools/qualify_hia_agent_original_select_delta.py \
            --original "$RUNNER_TEMP/hia-sixgap/original-select-inputs/original-selfhost.hiaasm" \
            --candidate "$RUNNER_TEMP/hia-sixgap/original-select-inputs/candidate-selfhost.hiaasm" \
            --patch "$RUNNER_TEMP/hia-sixgap/original-select-inputs/fresh-select.patch" \
            --output "$RUNNER_TEMP/hia-sixgap/original-select-strict" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/original-select-strict.log"
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap/original-select-strict/qualification.json').read_text())
          assert report['status'] == 'HOLD_REAL_DELTA_STRICT_GATE'
          assert report['worker_calls'] == 20
          assert report['evaluation_response']['error']['code'] == 'E_HIA_CLAIM_REQUIRED'
          assert not report['adoption_attempted'] and not report['adoption_authorized']
          assert report['empty_slot_count'] == report['empty_lease_count'] == 0
          assert report['same_core_substitution'] is False and report['strict_claims_weakened'] is False
          assert report['canonical_subjects']['original']['sha256'] != report['canonical_subjects']['candidate']['sha256']
          print('Strict refusal reproduced; original-delta proof/evaluation/adoption acceptance remains HOLD.')
          PY
      - name: Independently validate actual frozen select output fragments
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B -m unittest tests.test_hia_original_select_fragments -v
          python -B tools/qualify_hia_original_select_fragments.py \
            --original "$RUNNER_TEMP/hia-sixgap/original-select-inputs/original-selfhost.hiaasm" \
            --candidate "$RUNNER_TEMP/hia-sixgap/original-select-inputs/candidate-selfhost.hiaasm" \
            --patch "$RUNNER_TEMP/hia-sixgap/original-select-inputs/fresh-select.patch" \
            --output "$RUNNER_TEMP/hia-sixgap/original-select-fragments" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/original-select-fragments.log"
          python -B - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap'
          source = root / 'original-select-fragments'
          manifest = sha256((source / 'artifact-manifest.json').read_bytes()).hexdigest()
          subprocess.run([sys.executable, '-B', 'tools/replay_hia_original_select_fragments.py',
              '--input', str(source), '--expected-manifest-sha256', manifest,
              '--output', str(root / 'original-select-fragments-replay')], check=True)
          PY
      - name: Verify public scalar proof scope and receipt rejection
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_scalar_proof_contract tests.test_hia_translation_validation tests.test_hia_bounded_unroll tests.test_hia_scalar_call_validation tests.test_hia_scalar_totality -v 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/scalar-proof-scope.log"
          python -B tools/generate_hia_selfhost_contract.py --check 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/selfhost-contract.log"
          python -B -m unittest tests.test_hia_selfhost_contract.SelfhostContractTests -v 2>&1 | tee -a "$RUNNER_TEMP/hia-sixgap/selfhost-contract.log"
      - name: Validate supplied Safe Core bytes and public release diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B tools/qualify_hia_safe_core.py --output "$RUNNER_TEMP/hia-sixgap/safe-core" 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/safe-core.log"
          python -B -m unittest discover -s tests -p 'test_hia_release*.py' -v 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/supplied-bytes-release.log"
      - name: Validate exact CMOVNE leaf subjects and retain all counterexamples
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B -m unittest \
            tests.test_hia_safe_core_cmovne.CmovneLeafTests.test_all_register_fields_include_rex_extensions_and_aliases \
            tests.test_hia_safe_core_cmovne.CmovneLeafTests.test_unreviewed_forms_fail_even_when_unreachable \
            tests.test_hia_safe_core_cmovne.CmovneLeafTests.test_branch_cannot_enter_a_cmov_operand \
            -v 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/cmovne-decoder.log"
          python -B tools/qualify_hia_safe_core_cmovne.py \
            --output "$RUNNER_TEMP/hia-sixgap/cmovne-leaf" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/cmovne-leaf.log"
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap/cmovne-leaf'
          report = json.loads((root / 'qualification.json').read_text())
          assert report['status'] == 'PASS'
          assert report['counts'] == {'smt_validated': 13, 'refuted': 6, 'unsupported': 3,
              'native_calls': 492, 'decoded_register_combinations': 256, 'decoder_refusals': 17}
          assert report['original_agent_four_claim_gate'] == 'HOLD'
          assert report['whole_compiler_or_original_agent_delta_proved'] is False
          assert report['hardware_isa_refinement_proved'] is False
          for case in report['cases']:
              proof = json.loads((root / case['id'] / 'validation.json').read_text())
              if case['expected'] == 'smt_validated':
                  assert [ob['result'] for ob in proof['obligations']] == ['sat', 'unsat', 'unsat', 'unsat', 'unsat']
                  assert all(key in proof for key in ('subject', 'property', 'profile', 'assumptions', 'checker', 'unproved_obligations'))
              else:
                  assert case['native_calls'] == 0
                  if case['expected'] == 'refuted':
                      assert proof['validation']['ok'] is False
                      assert proof['validation']['obligations'][-1]['result'] == 'sat'
                  else:
                      assert proof['proof_issued'] is False
          print('Exact CMOVNE leaf model qualified; whole-compiler and original-task proof gates remain HOLD.')
          PY
      - name: Preserve complete cost accounting and strong ordinary controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_agent_macro_policy tests.test_hia_macro_strong_control tests.test_hia_macro_campaign tests.test_hia_macro_codex_provider tests.test_hia_repository_agent_trial -v 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/macro-cost-controls.log"
          python -B -m unittest tests.test_hia_native_cohort_gate tests.test_hia_native_performance_tail_gate tests.test_hia_native_ndu tests.test_hia_native_ndu_identity tests.test_hia_prepared_gate_profile -v 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/native-cohort-gate.log"
      - name: Audit scalar control cells and replay the original registered measurements
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/scalar-controller-tests.log"
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_hia_scalar_controller_controls')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not (result.wasSuccessful() and result.testsRun == 28 and not result.skipped
                  and not result.expectedFailures):
              raise SystemExit('all named scalar evidence tests must pass without skips')
          PY
          python -B - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import zipfile
          archive = Path('review-evidence/hia-ndu-scalar-controls-20261108-23d1/original-campaign.zip')
          assert sha256(archive.read_bytes()).hexdigest() == 'd9025d10bacdd5e8558625c26fce40130effc87e05fe962a2387bfd4680add6d'
          root = Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap/scalar-control-originals'
          root.mkdir()
          with zipfile.ZipFile(archive) as source:
              assert len(source.infolist()) == len(set(source.namelist())) == 443
              assert source.testzip() is None
              for member in source.infolist():
                  if not member.filename.startswith('campaign/'):
                      continue
                  target = root / member.filename
                  assert not member.is_dir() and target.resolve().is_relative_to(root.resolve())
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read(member))
          PY
          python -B tools/measure_hia_scalar_controller_controls.py verify \
            --directory "$RUNNER_TEMP/hia-sixgap/scalar-control-originals/campaign" \
            --expected-plan-sha256 882a8c1e8ed96c0b409c8f4183f6b6e079bafbe76a9872666b44304f1acbc493 \
            --output "$RUNNER_TEMP/hia-sixgap/scalar-control-replay.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/scalar-control-replay.log"
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'hia-sixgap'
          report = json.loads((root / 'scalar-control-replay.json').read_bytes())
          original = json.loads((root / 'scalar-control-originals/campaign/VERIFICATION.json').read_bytes())
          assert report == original
          assert report['verification'] == 'ORIGINAL_BYTES_AND_ACCOUNTING_VERIFIED'
          assert report['scheduled_cells_verified'] == 128 and report['objects_verified'] == 307
          assert report['completed_pairs'] == report['successful_native_calls'] == 64
          assert report['new_native_calls'] == report['new_provider_calls'] == 0
          assert report['economic_benefit_established'] is False
          print('Original scalar evidence replays without new calls; incremental and economic value remain HOLD.')
          PY
      - name: Check selfhost compiler input limits
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_hia_selfhost.SelfhostSourceTests tests.test_hia_selfhost_process_owner tests.test_hia_selfhost_language_coverage.SelfhostLanguageSourceTests tests.test_hia_selfhost_owned_flow tests.test_hia_selfhost_chain tests.test_hia_selfhost_machine_plans -v 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/selfhost-source.log"
      - name: Rebuild the frozen selfhost chain from a cold directory
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B tools/replay_hia_selfhost_cold.py --output "$RUNNER_TEMP/hia-sixgap/cold-selfhost" 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/cold-selfhost.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Cover every declared selfhost input operation and boundary
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B tests/test_hia_selfhost_language_coverage.py --output "$RUNNER_TEMP/hia-sixgap/selfhost-language.json" 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/selfhost-language.log"
      - name: Freeze and verify the public exact source/runtime release lock
        timeout-minutes: 20
        env:
          HIA_RUNTIME_SHA: '4cd85c99c5f5a480832c48fbde8561bb365f67a9'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: http.extraheader
          GIT_CONFIG_VALUE_1: ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          HIA_RUNTIME_ROOT="$RUNNER_TEMP/hia-sixgap-runtime-$HIA_RUNTIME_SHA"
          test ! -e "$HIA_RUNTIME_ROOT"
          test ! -L "$HIA_RUNTIME_ROOT"
          {
            timeout --kill-after=10s 30s git init -- "$HIA_RUNTIME_ROOT"
            timeout --kill-after=10s 30s git -C "$HIA_RUNTIME_ROOT" remote add origin https://github.com/TrillionniumFoundation/hepta-runtime.git
            timeout --kill-after=10s 30s git -C "$HIA_RUNTIME_ROOT" config remote.origin.promisor true
            timeout --kill-after=10s 30s git -C "$HIA_RUNTIME_ROOT" config remote.origin.partialclonefilter blob:none
            timeout --kill-after=10s 300s git -C "$HIA_RUNTIME_ROOT" fetch --no-tags --no-recurse-submodules --filter=blob:none --depth=1 origin "$HIA_RUNTIME_SHA"
            test "$(git --no-replace-objects -C "$HIA_RUNTIME_ROOT" rev-parse FETCH_HEAD)" = "$HIA_RUNTIME_SHA"
            timeout --kill-after=10s 600s git -C "$HIA_RUNTIME_ROOT" checkout --detach "$HIA_RUNTIME_SHA"
            test "$(git --no-replace-objects -C "$HIA_RUNTIME_ROOT" rev-parse HEAD)" = "$HIA_RUNTIME_SHA"
            test -z "$(git -C "$HIA_RUNTIME_ROOT" status --porcelain --untracked-files=all)"
            git --no-replace-objects -C "$HIA_RUNTIME_ROOT" rev-parse HEAD 'HEAD^{tree}'
          } 2>&1 | tee "$RUNNER_TEMP/hia-sixgap/release-runtime-fetch.log"
          timeout --kill-after=10s 120s python -B tools/hia_release.py freeze \
            --hepta-root "$GITHUB_WORKSPACE" --hepta-revision "$HEPTA_SOURCE_SHA" \
            --runtime-checkout "$HIA_RUNTIME_ROOT" --runtime-revision "$HIA_RUNTIME_SHA" \
            --release-id "hia-sixgap-ci-$HEPTA_SOURCE_SHA" \
            --output "$RUNNER_TEMP/hia-sixgap/release-lock.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/release-freeze.log"
          sha256sum "$RUNNER_TEMP/hia-sixgap/release-lock.json" > "$RUNNER_TEMP/hia-sixgap/release-lock.sha256"
          timeout --kill-after=10s 120s python -B tools/hia_release.py \
            --lock "$RUNNER_TEMP/hia-sixgap/release-lock.json" check \
            --hepta-root "$GITHUB_WORKSPACE" --runtime-checkout "$HIA_RUNTIME_ROOT" \
            2>&1 | tee "$RUNNER_TEMP/hia-sixgap/release-check.log"
          test "$(git rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hia-exact-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hia-sixgap/
            !${{ runner.temp }}/hia-sixgap/agent-buffer-continuation/state/state.sqlite3*
            !${{ runner.temp }}/hia-sixgap/agent-buffer-current-compiler/state/state.sqlite3*
            !${{ runner.temp }}/hia-sixgap/original-select-strict/state/state.sqlite3*
          if-no-files-found: error
          retention-days: 30
