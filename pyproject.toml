[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hepta-language"
version = "0.1.0"
description = "Experimental native systems language with checked ownership, effects, and resource contracts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hepta = "hepta.cli:main"

[tool.setuptools]
packages = ["hepta"]
